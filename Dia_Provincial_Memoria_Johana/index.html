<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Día Provincial en Memoria de Johana — Actividades interactivas</title>
<style>
  :root {
    --azul: #1565c0;
    --azul-osc: #0d47a1;
    --naranja: #f57c00;
    --verde: #2e7d32;
    --rojo: #c62828;
    --fondo: #eef6ff;
    --texto: #1a1a1a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: 'Trebuchet MS', 'Verdana', sans-serif;
    background: var(--fondo);
    color: var(--texto);
    -webkit-tap-highlight-color: transparent;
  }
  #app { min-height: 100vh; display: flex; flex-direction: column; }
  .pantalla { flex: 1; padding: 12px 16px 84px; max-width: 900px; margin: 0 auto; width: 100%; }
  /* Mientras suena el audio de instrucción, se ve todo "esperando" para que
     los toques tempranos no se pierdan en silencio (evita el bug de tener
     que tocar dos veces la primera vez). */
  .pantalla.esperando-audio .clasificar-items, .pantalla.esperando-audio .clasificar-categorias,
  .pantalla.esperando-audio .ordenar-opciones, .pantalla.esperando-audio .trivia-opciones,
  .pantalla.esperando-audio .asociar-columnas, .pantalla.esperando-audio .hotspot-zona,
  .pantalla.esperando-audio .recorrido-punto, .pantalla.esperando-audio .sopa-grid,
  .pantalla.esperando-audio .memo-grid, .pantalla.esperando-audio .puzzle-grid {
    opacity: 0.5; pointer-events: none; filter: grayscale(40%);
    transition: opacity 0.2s;
  }
  h1 { color: var(--azul-osc); margin: 4px 0 8px; font-size: 1.4em; }
  h2 { color: var(--azul-osc); margin: 0 0 6px; font-size: 1.25em; }
  .instruccion { background: #fff3e0; border-left: 5px solid var(--naranja); padding: 8px 12px; border-radius: 8px; margin: 6px 0; font-size: 0.95em; }
  .img-pantalla {
    width: 100%; max-height: 24vh; min-height: 90px; object-fit: contain;
    border-radius: 14px; margin: 6px 0; background: #eceff1;
  }
  /* Para fotografías puntuales que necesitan verse más grandes (ej. las
     fotos reales del mural y la escuela): 50% más alto que el estándar,
     pero SOLO en pantallas anchas (netbook/notebook/tablet). En celular
     (pantalla angosta) se queda en el tamaño normal, para no empujar el
     resto del contenido fuera de la pantalla. */
  .img-pantalla-grande { max-height: 24vh; }
  @media (min-width: 600px) {
    .img-pantalla-grande { max-height: 36vh; }
  }
  .img-fuente { text-align: right; font-size: 0.75em; color: #607d8b; font-style: italic; margin: -4px 0 6px; }
  .pregunta { font-size: 1.1em; font-weight: bold; margin: 6px 0; }

  /* Botones generales */
  .btn-verificar, .btn-comenzar {
    background: var(--azul); color: #fff; border: none; border-radius: 30px;
    padding: 12px 28px; font-size: 1em; font-weight: bold; cursor: pointer; margin-top: 10px;
  }
  .btn-verificar:disabled { background: #b0bec5; cursor: not-allowed; }
  .feedback { margin-top: 10px; font-weight: bold; min-height: 1.4em; }

  /* Selector de ciclo en portada */
  .selector-ciclo { display: flex; flex-direction: column; gap: 12px; margin-top: 18px; align-items: center; }
  .btn-ciclo {
    background: var(--azul); color: #fff; border: none; border-radius: 30px;
    padding: 14px 30px; font-size: 1.05em; font-weight: bold; cursor: pointer;
    width: 100%; max-width: 320px; transition: transform 0.15s ease, background 0.15s ease;
  }
  .btn-ciclo:hover { background: var(--azul-osc); transform: scale(1.03); }
  .btn-ciclo:nth-child(2) { background: var(--rojo, #c62828); }
  .btn-ciclo:nth-child(2):hover { background: #8e1f1f; }

  /* Barra inferior / Siguiente */
  .barra-inferior {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 1000;
    background: #fff; box-shadow: 0 -2px 8px rgba(0,0,0,0.15);
    padding: 10px 16px; display: flex; justify-content: flex-end;
  }
  #btn-siguiente {
    background: var(--verde); color: #fff; border: none; border-radius: 30px;
    padding: 12px 26px; font-size: 1em; font-weight: bold; cursor: pointer;
  }
  #btn-siguiente:disabled { background: #b0bec5; cursor: not-allowed; }

  /* Portada / Cierre — imagen contenida arriba, contenido debajo, sin superposición */
  .portada-caja, .cierre-caja {
    background: #fff; border-radius: 20px; padding: 20px;
    text-align: center; max-width: 520px; width: 100%;
    margin: 20px auto; box-shadow: 0 2px 12px rgba(0,0,0,0.1);
  }
  .portada-img {
    width: 100%; max-height: 260px; object-fit: cover;
    border-radius: 14px; display: block; margin-bottom: 16px;
  }
  .subtitulo { font-size: 1.15em; color: var(--azul); margin-top: 4px; }
  .cierre-stats {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    margin: 16px 0;
  }
  .cierre-stat {
    background: #f5f7fa; border-radius: 12px; padding: 10px;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .cierre-stat span { font-size: 0.8em; color: #607d8b; }
  .cierre-stat strong { font-size: 1.3em; color: var(--azul-osc); }

  .perfil-block { display: flex; align-items: center; gap: 10px; margin-top: 18px; justify-content: center; }
  .perfil-foto { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; cursor: pointer; border: 3px solid var(--azul); }
  .perfil-txt { font-size: 0.8em; text-align: left; }

  .lightbox-perfil {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    display: flex; align-items: center; justify-content: center; z-index: 999;
  }
  .lightbox-perfil-inner { text-align: center; color: #fff; }
  .lightbox-perfil-inner .lightbox-perfil-img {
    width: 160px; height: 160px; border-radius: 50%; object-fit: cover;
    cursor: zoom-in; transition: all 0.25s ease;
  }
  .lightbox-perfil-inner .lightbox-perfil-img.zoom-activo {
    width: min(90vw, 480px); height: min(90vw, 480px);
    border-radius: 16px; object-fit: contain; cursor: zoom-out;
    background: rgba(255,255,255,0.05);
  }
  .lightbox-zoom-hint { font-size: 0.75em; opacity: 0.75; margin-top: 8px; }
  .tagline { font-size: 1.3em; margin-top: 14px; }
  .btn-cerrar-lightbox {
    margin-top: 16px; background: var(--rojo); color: #fff; border: none;
    border-radius: 50%; width: 40px; height: 40px; font-size: 1.1em; cursor: pointer;
  }

  /* Clasificar */
  .clasificar-items { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
  .item-chip {
    border: 3px solid #90a4ae; border-radius: 12px; padding: 6px; cursor: pointer;
    text-align: center; width: 104px; background: #fff;
  }
  .item-chip img { width: 100%; height: 56px; object-fit: cover; border-radius: 8px; }
  .item-chip span { display: block; font-size: 0.78em; margin-top: 3px; line-height: 1.2; }
  .item-chip.seleccionado { border-color: var(--azul); box-shadow: 0 0 0 3px rgba(21,101,192,0.3); }
  .item-chip.asignado { opacity: 0.85; }
  .item-chip.correcto { background: #e8f5e9; }
  .item-chip.incorrecto { background: #ffebee; }
  .clasificar-categorias { display: flex; gap: 8px; margin: 8px 0; }
  .categoria-chip {
    flex: 1; text-align: center; padding: 10px 8px; border: 3px dashed #90a4ae;
    border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 0.9em;
  }
  .categoria-chip.seleccionado { border-style: solid; box-shadow: 0 0 0 3px rgba(21,101,192,0.3); background: #e3f2fd; }

  /* Ordenar */
  .ordenar-opciones { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
  .paso-chip {
    border: 3px solid var(--azul); border-radius: 12px; padding: 10px 14px;
    cursor: pointer; background: #fff;
  }
  .paso-chip.usado { opacity: 0.35; cursor: default; }
  .paso-chip.incorrecto { border-color: var(--rojo); background: #ffebee; animation: sacudir 0.3s; }
  @keyframes sacudir { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  .ordenar-resultado { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; }
  .paso-numerado { background: #e3f2fd; border-radius: 8px; padding: 8px 12px; }
  /* Rompecabezas de texto tipo "oración": las palabras se van agregando
     en una misma línea horizontal (con wrap solo si no entra en el ancho),
     leyéndose de corrido como una frase, no como lista apilada. */
  .ordenar-resultado-oracion {
    display: flex; flex-direction: row; flex-wrap: wrap; align-items: baseline;
    gap: 6px; background: #e3f2fd; border-radius: 10px; padding: 10px 14px;
    min-height: 1.6em; font-size: 1.05em; line-height: 1.5;
  }
  .paso-palabra { display: inline; }
  .paso-palabra:not(:last-child)::after { content: " "; }

  /* Trivia */
  .trivia-opciones { display: flex; flex-direction: column; gap: 10px; margin: 12px 0; }
  .opcion-btn {
    padding: 12px; border: 3px solid #90a4ae; border-radius: 12px; background: #fff;
    cursor: pointer; font-size: 1em; text-align: left;
  }
  .opcion-btn.seleccionada { border-color: var(--azul); background: #e3f2fd; }
  .opcion-btn.correcto { border-color: var(--verde); background: #e8f5e9; }
  .opcion-btn.incorrecto { border-color: var(--rojo); background: #ffebee; }
  .opcion-btn .opcion-icono { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; vertical-align: middle; margin-right: 8px; }
  .trivia-multi-contador { text-align: center; font-weight: bold; color: var(--azul-osc); margin: 4px 0; }
  .trivia-multi-activa { min-height: 1px; }

  /* Memojuego */
  .memo-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 14px 0; }
  .memo-carta { aspect-ratio: 3/4; perspective: 600px; border: none; background: none; padding: 0; cursor: pointer; }
  .memo-carta-inner {
    position: relative; width: 100%; height: 100%; transition: transform 0.4s;
    transform-style: preserve-3d;
  }
  .memo-carta.volteada .memo-carta-inner, .memo-carta.resuelta .memo-carta-inner { transform: rotateY(180deg); }
  .memo-carta-dorso, .memo-carta-frente {
    position: absolute; inset: 0; backface-visibility: hidden; border-radius: 10px;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .memo-carta-dorso { background: var(--azul); color: #fff; font-size: 1.8em; font-weight: bold; }
  .memo-carta-frente { background: #fff; border: 3px solid var(--verde); transform: rotateY(180deg); }
  .memo-carta-frente img { width: 100%; height: 100%; object-fit: cover; }
  .memo-carta.resuelta .memo-carta-frente { border-color: #ffb300; }

  /* Puzzle de imagen */
  .puzzle-grid { display: grid; gap: 4px; margin: 14px auto; max-width: 420px; }
  .puzzle-pieza {
    aspect-ratio: 1/1; border: 2px solid #90a4ae; border-radius: 4px; cursor: pointer; padding: 0;
    background-color: #eee;
  }
  .puzzle-pieza.seleccionada { border-color: var(--azul); border-width: 4px; }
  .puzzle-pieza.correcta { border-color: var(--verde); }

  /* Asociar */
  .asociar-columnas { display: flex; gap: 16px; }
  .asociar-col { flex: 1; display: flex; flex-direction: column; gap: 10px; }
  .asociar-chip {
    border: 3px solid #90a4ae; border-radius: 12px; padding: 10px; cursor: pointer;
    background: #fff; text-align: center;
  }
  .asociar-chip.seleccionado { border-color: var(--azul); background: #e3f2fd; }
  .asociar-chip.correcto { border-color: var(--verde); background: #e8f5e9; }
  .asociar-chip.resuelto { cursor: default; }
  .asociar-chip.incorrecto { border-color: var(--rojo); background: #ffebee; }
  .asociar-icono { width: 84px; height: 84px; object-fit: cover; border-radius: 10px; display: block; margin: 0 auto 6px; }

  /* Hotspot / Recorrido */
  .hotspot-wrap, .recorrido-wrap { position: relative; width: 100%; }
  .hotspot-img, .recorrido-img { width: 100%; border-radius: 14px; display: block; }
  .hotspot-descripcion {
    min-height: 1.4em; font-weight: bold; color: var(--azul-osc);
    text-align: center; margin-top: 8px;
  }
  .recorrido-descripcion {
    display: flex; align-items: center; gap: 10px; margin-top: 10px;
    min-height: 1.4em;
  }
  .recorrido-descripcion-img { width: 90px; height: 90px; object-fit: cover; border-radius: 10px; }
  .recorrido-descripcion-texto { font-weight: bold; color: var(--azul-osc); }

  /* Video complementario (YouTube embebido en la pantalla) */
  .video-wrap {
    position: relative; width: 100%; max-width: 480px;
    aspect-ratio: 16 / 9; margin: 14px auto;
    background: #0b1620; border-radius: 14px; overflow: hidden;
  }
  /* Los Shorts son verticales (9:16): achicamos el ancho y agrandamos
     el alto relativo para que no queden con franjas negras enormes
     ni desbordando la pantalla, tanto en celular como en PC/tablet. */
  .video-wrap.video-vertical {
    max-width: 300px; aspect-ratio: 9 / 16;
  }
  .video-iframe, .video-wrap iframe {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;
  }
  .video-play-overlay {
    position: absolute; inset: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; background: linear-gradient(180deg, #1c2b3a, #0b1620);
    border: none; cursor: pointer; color: #fff;
  }
  .video-play-icono {
    width: 62px; height: 62px; border-radius: 50%;
    background: var(--rojo, #c62828); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.6em; line-height: 1;
  }
  .video-play-texto { font-size: 0.95em; font-weight: bold; }
  .video-play-overlay:hover .video-play-icono { filter: brightness(1.1); }
  .video-fuente {
    text-align: center; font-size: 0.85em; color: #607d8b;
    font-style: italic; margin-top: 6px;
  }
  @media (max-width: 400px) {
    .video-wrap.video-vertical { max-width: 240px; }
  }

  /* Botón y lightbox para ampliar el plano */
  .btn-ampliar {
    position: absolute; top: 10px; right: 10px; background: rgba(255,255,255,0.9);
    border: 2px solid var(--azul); border-radius: 50%; width: 42px; height: 42px;
    font-size: 1.3em; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .lightbox-imagen {
    position: fixed; inset: 0; background: rgba(0,0,0,0.9);
    display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999;
    padding: 20px;
  }
  .lightbox-imagen img { max-width: 100%; max-height: 80vh; border-radius: 10px; }
  .lightbox-imagen .btn-cerrar-lightbox {
    margin-top: 16px; background: var(--rojo); color: #fff; border: none;
    border-radius: 50%; width: 44px; height: 44px; font-size: 1.2em; cursor: pointer;
  }
  .hotspot-zona {
    position: absolute; border: 3px dashed var(--naranja); border-radius: 10px;
    background: rgba(245,124,0,0.15); cursor: pointer;
  }
  .hotspot-zona.encontrada { background: rgba(46,125,50,0.35); border-color: var(--verde); }
  .recorrido-punto {
    position: absolute; width: 34px; height: 34px; border-radius: 50%;
    background: var(--naranja); color: #fff; border: 3px solid #fff; font-weight: bold;
    cursor: pointer; transform: translate(-50%, -50%);
  }
  .recorrido-punto.visitado { background: var(--verde); }

  /* Sopa de letras */
  .sopa-layout { display: flex; gap: 20px; flex-wrap: wrap; }
  .sopa-grid { display: grid; gap: 2px; max-width: 480px; }
  .sopa-celda {
    aspect-ratio: 1; border: 1px solid #cfd8dc; background: #fff; cursor: pointer;
    font-weight: bold; font-size: 0.85em;
  }
  .sopa-celda.sopa-sel-inicio { background: #fff9c4; }
  .sopa-celda.sopa-encontrada { background: #c8e6c9; }
  .sopa-lista { display: flex; flex-direction: column; gap: 6px; }
  .sopa-palabra { font-weight: bold; }
  .sopa-palabra.tachada { text-decoration: line-through; color: #9e9e9e; }

  @media (max-width: 480px) {
    .asociar-columnas { gap: 8px; }
    .sopa-celda { font-size: 0.7em; }
  }
  /* Titileo: feedback visual inmediato al tocar cualquier opción, para que
     se note el toque sin depender solo del audio. */
  @keyframes titilar {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); }
    25% { box-shadow: 0 0 0 5px rgba(255,213,79,0.9); }
    50% { box-shadow: 0 0 0 0 rgba(255,255,255,0); }
    75% { box-shadow: 0 0 0 5px rgba(255,213,79,0.9); }
  }
  .titilar { animation: titilar 0.4s ease-in-out; }
</style>
</head>
<body>
  <div id="app"></div>
  <script src="datos.js"></script>
  <script src="motor.js"></script>
</body>
</html>
