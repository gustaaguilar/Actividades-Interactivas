<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Manos que Cuidan — QueSepanTodos.com</title>
<style>
  :root{
    --azul:#1b6ea8;
    --azul-osc:#0e4a75;
    --verde:#2e9e5b;
    --rojo:#d64545;
    --amarillo:#f2b705;
    --fondo:#eaf6fb;
    --texto:#1c2b33;
    --blanco:#ffffff;
    --a:#ffd166; --b:#06d6a0; --c:#118ab2; --d:#ef476f; --e:#a685e2; --f:#ff9f68; --g:#8d6e63;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;height:100%;overflow:hidden;
    font-family:"Segoe UI",Verdana,Arial,sans-serif;
    background:var(--fondo);color:var(--texto);
  }
  #app{display:flex;flex-direction:column;height:100dvh;width:100vw;}
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:8px 14px;background:var(--azul-osc);color:#fff;flex:0 0 auto;
  }
  header .titulo-chico{font-weight:600;font-size:14px;flex:0 0 auto;}
  .progreso-wrap{display:flex;align-items:center;gap:8px;flex:1 1 auto;max-width:220px;margin-left:14px;}
  .progreso-barra{flex:1 1 auto;height:8px;background:#ffffff33;border-radius:6px;overflow:hidden;}
  .progreso-barra-interior{height:100%;background:var(--verde);border-radius:6px;transition:width .3s ease;}
  .progreso-texto{font-size:12px;font-weight:700;white-space:nowrap;}
  #pantalla{
    flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;
    align-items:center;justify-content:flex-start;padding:10px 14px;gap:8px;
    text-align:center;
  }
  footer{
    flex:0 0 auto;display:flex;justify-content:center;padding:8px 14px;
    background:#dceefa;
  }
  h1,h2{margin:4px 0;color:var(--azul-osc);}
  h1{font-size:clamp(20px,5vw,30px);}
  h2{font-size:clamp(17px,4vw,22px);}
  p{margin:2px 0;font-size:clamp(13px,3.4vw,16px);line-height:1.3;}
  .instruccion{color:#3a4c56;}

  .btn{
    border:none;border-radius:10px;padding:10px 18px;font-size:15px;font-weight:700;
    cursor:pointer;background:var(--azul);color:#fff;transition:transform .1s, opacity .15s;
  }
  .btn:active{transform:scale(.96);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn-primario{background:var(--verde);}

  /* ---- Portada ---- */
  .portada-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:8px;max-width:480px;margin:0 auto;}
  .portada-imagen{width:100%;max-width:340px;max-height:38vh;object-fit:cover;border-radius:16px;box-shadow:0 4px 14px rgba(0,0,0,.18);}
  .portada-titulo{font-size:clamp(24px,7vw,36px);}
  .portada-fila{display:flex;align-items:center;justify-content:space-between;width:100%;gap:10px;margin-top:14px;flex-wrap:wrap;}
  .firma-profe{display:flex;align-items:center;gap:8px;text-align:left;}
  .foto-profe{width:92px;height:92px;border-radius:50%;object-fit:cover;cursor:pointer;border:3px solid var(--azul);}
  .firma-texto{font-size:12px;color:#345;}

  /* ---- Lightbox ---- */
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:50;display:flex;align-items:center;justify-content:center;}
  .lightbox-img{max-width:90vw;max-height:75vh;border-radius:8px;transition:transform .25s ease;cursor:zoom-in;}
  .lightbox-cerrar{position:absolute;top:16px;right:16px;background:#fff2;color:#fff;border:1px solid #fff;border-radius:8px;padding:6px 12px;}
  .lightbox-frase{position:absolute;bottom:24px;color:#fff;font-size:16px;font-weight:600;}

  /* ---- Video ---- */
  .video-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;max-width:520px;margin:auto;}
  .video-botones{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;}
  .btn-ciclo{background:var(--azul);min-width:150px;}
  .btn-ciclo.seleccionado{background:var(--verde);}
  .video-embed{position:relative;width:100%;max-width:480px;padding-top:56.25%;border-radius:10px;overflow:hidden;margin:auto;background:#000;box-shadow:0 4px 14px rgba(0,0,0,.18);}
  .video-embed iframe,#ytPlayerVideo{position:absolute;top:0;left:0;width:100%;height:100%;}

  /* ---- Explicación / narración animada ---- */
  .explicacion-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;max-width:520px;margin:auto;width:100%;}
  .explicacion-escena{
    position:relative;width:100%;height:34vh;max-height:230px;background:var(--blanco);
    border-radius:14px;border:3px solid var(--azul);display:flex;align-items:flex-end;justify-content:center;
    overflow:hidden;
  }
  .explicacion-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .explicacion-escena::after{
    position:absolute;top:8px;right:8px;font-size:34px;
    background:rgba(255,255,255,.85);border-radius:50%;width:52px;height:52px;
    display:flex;align-items:center;justify-content:center;content:"🧫";
  }
  .explicacion-escena.marcador-panza::after{content:"🤢";}
  .explicacion-escena.marcador-virus::after{content:"🦠";}
  .explicacion-escena.marcador-gel::after{content:"🚫🧴";font-size:22px;}
  .explicacion-escena.marcador-jabon::after{content:"🧼";}
  .puntero-narracion{position:relative;z-index:2;font-size:40px;margin-bottom:6px;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.4));animation:mover 2.4s ease-in-out infinite;}
  @keyframes mover{0%,100%{transform:translateX(-14px) rotate(-8deg);}50%{transform:translateX(14px) rotate(8deg);}}
  .explicacion-texto{background:var(--blanco);border-radius:10px;padding:10px 14px;font-size:clamp(14px,3.6vw,17px);border:2px solid var(--azul);min-height:64px;}

  /* ---- Asociar ---- */
  .asociar-wrap{width:100%;max-width:620px;margin:auto;display:flex;flex-direction:column;gap:8px;}
  .asociar-columnas{display:flex;gap:10px;justify-content:center;align-items:flex-start;}
  .asociar-col{display:flex;gap:6px;}
  .asociar-col-texto{flex-direction:column;flex:0 1 140px;max-width:140px;}
  .asociar-col-img{flex:0 1 340px;max-width:340px;display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
  .asociar-item{background:var(--blanco);border:2px solid var(--azul);border-radius:10px;padding:6px;font-size:12px;cursor:pointer;}
  .asociar-item.activo{border-color:var(--amarillo);box-shadow:0 0 0 3px var(--amarillo);}
  .asociar-img{padding:5px;}
  .asociar-img img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:6px;display:block;}
  .asociar-item.error-flash{background:#ffd8d8;}
  .asociar-item.resuelto-a{background:var(--a);border-color:var(--a);}
  .asociar-item.resuelto-b{background:var(--b);border-color:var(--b);}
  .asociar-item.resuelto-c{background:var(--c);color:#fff;border-color:var(--c);}
  .asociar-item.resuelto-d{background:var(--d);color:#fff;border-color:var(--d);}
  .asociar-item.resuelto-e{background:var(--e);color:#fff;border-color:var(--e);}
  .asociar-item.resuelto-f{background:var(--f);border-color:var(--f);}
  .asociar-item.resuelto-g{background:var(--g);color:#fff;border-color:var(--g);}

  /* ---- Trivia ---- */
  .trivia-wrap{width:100%;max-width:520px;margin:auto;}
  .trivia-caja{display:flex;flex-direction:column;gap:10px;align-items:center;}
  .trivia-pregunta{font-size:clamp(15px,4vw,19px);font-weight:700;background:var(--blanco);padding:10px;border-radius:10px;width:100%;}
  .trivia-opciones{display:flex;gap:8px;width:100%;}
  .trivia-opciones.lista1{flex-direction:column;}
  .trivia-opciones.grilla2{flex-wrap:wrap;flex-direction:row;justify-content:center;}
  .trivia-opciones.grilla2 .btn-opcion{width:47%;}
  .btn-opcion{background:var(--blanco);color:var(--texto);border:2px solid var(--azul);}
  .btn-opcion.correcta{background:var(--verde);color:#fff;border-color:var(--verde);}
  .btn-opcion.incorrecta{background:var(--rojo);color:#fff;border-color:var(--rojo);}
  /* Opciones con imagen (trivia de técnica, primer ciclo) */
  .trivia-opciones.con-imagenes{flex-wrap:wrap;flex-direction:row;justify-content:center;}
  .trivia-opciones.con-imagenes .btn-opcion{width:30%;min-width:88px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 6px;}
  .btn-opcion.con-imagen img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px;pointer-events:none;}
  .btn-opcion.con-imagen span{font-size:12px;font-weight:700;line-height:1.15;pointer-events:none;}

  /* ---- Sopa de letras ---- */
  .sopa-wrap{width:100%;max-width:520px;margin:auto;display:flex;flex-direction:column;gap:8px;align-items:center;}
  .sopa-grid{display:grid;width:min(92vw,420px);aspect-ratio:1/1;gap:1px;background:var(--azul);border:2px solid var(--azul);border-radius:6px;overflow:hidden;font-size:clamp(14px,4vw,26px);}
  .sopa-celda{background:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;user-select:none;cursor:pointer;text-transform:lowercase;}
  .sopa-celda.seleccion-temp{background:#fff3b0;}
  .sopa-celda.encontrada{background:var(--verde);color:#fff;}
  .sopa-lista{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;}
  .sopa-chip{background:var(--blanco);border:2px solid var(--azul);border-radius:8px;padding:6px 14px;font-size:clamp(14px,3.6vw,20px);font-weight:700;text-transform:lowercase;}
  .sopa-chip.resuelta{background:var(--verde);color:#fff;border-color:var(--verde);text-decoration:line-through;}

  /* ---- Armar oración ---- */
  .armar-wrap{width:100%;max-width:560px;margin:auto;display:flex;flex-direction:column;gap:12px;}
  .armar-zona{min-height:64px;background:var(--blanco);border:3px dashed var(--azul);border-radius:10px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;}
  .armar-colocada{background:var(--azul);color:#fff;padding:6px 10px;border-radius:6px;font-weight:700;font-size:14px;}
  .armar-bandeja{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
  .armar-pieza{background:var(--amarillo);border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer;font-size:14px;transition:background .2s;}
  .armar-pieza.usada{opacity:0;pointer-events:none;}
  .armar-pieza.error-flash{background:#ff9d9d;}
  /* Piezas con imagen (ordenar pasos): mismo tamaño que las imágenes de "asociar" */
  .armar-pieza-img{width:150px;height:150px;object-fit:cover;border-radius:10px;border:3px solid var(--azul);cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.15);transition:opacity .2s,border-color .2s;}
  .armar-pieza-img.usada{opacity:0;pointer-events:none;}
  .armar-pieza-img.error-flash{border-color:var(--rojo);box-shadow:0 0 0 4px rgba(214,69,69,.35);}
  .armar-zona-img{gap:8px;}
  .armar-colocada-img{width:90px;height:90px;object-fit:cover;border-radius:8px;border:2px solid var(--azul);}
  /* Imagen que ilustra cada oración de "Armá el consejo" */
  .armar-oracion-img{width:150px;height:150px;object-fit:cover;border-radius:12px;border:3px solid var(--azul);box-shadow:0 2px 8px rgba(0,0,0,.15);margin:0 auto;display:block;}

  /* ---- Cronómetro ---- */
  .cronometro-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;max-width:420px;margin:auto;width:100%;}
  .cronometro-escena{position:relative;width:100%;height:30vh;max-height:210px;border-radius:14px;overflow:hidden;border:3px solid var(--azul);display:flex;align-items:center;justify-content:center;}
  .cronometro-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:center;}
  .cronometro-escena.activo .cronometro-img{animation:cronoFrotar .6s ease-in-out infinite;}
  .cronometro-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;}
  @keyframes cronoFrotar{0%,100%{transform:scale(1.02) rotate(-1deg);}50%{transform:scale(1.06) rotate(1deg);}}
  .cronometro-burbuja{position:absolute;bottom:30%;font-size:20px;opacity:0;pointer-events:none;z-index:3;}
  .cronometro-escena.activo .cronometro-burbuja{animation:cronoBurbuja 1.6s ease-in infinite;}
  @keyframes cronoBurbuja{0%{opacity:0;transform:translateY(0) scale(.5);}20%{opacity:.9;}100%{opacity:0;transform:translateY(-55px) scale(1.15);}}
  .cronometro-numero{position:relative;z-index:2;font-size:clamp(40px,12vw,64px);font-weight:800;color:#fff;background:rgba(14,74,117,.6);border-radius:50%;width:100px;height:100px;display:flex;align-items:center;justify-content:center;text-shadow:0 2px 6px rgba(0,0,0,.5);}
  .cronometro-barra{width:100%;height:14px;background:#dceefa;border-radius:8px;overflow:hidden;border:2px solid var(--azul);}
  .cronometro-barra-interior{height:100%;background:var(--verde);transition:width 1s linear;}

  /* Efecto de destaque/titileo */
  .destacado{animation:titileo 1.4s ease-in-out infinite;}
  @keyframes titileo{0%,100%{box-shadow:0 0 0 0 rgba(27,110,168,.5);}50%{box-shadow:0 0 0 6px rgba(27,110,168,0);}}

  /* ---- Cierre ---- */
  .cierre-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;max-width:460px;margin:auto;}
  .cierre-stats{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;}
  .stat{background:var(--blanco);border:2px solid var(--azul);border-radius:10px;padding:8px 14px;font-weight:700;}
  .cierre-frase{font-weight:700;color:var(--azul-osc);}
</style>
</head>
<body>
  <div id="app">
    <header>
      <span class="titulo-chico">🧼 Manos que Cuidan</span>
      <div class="progreso-wrap">
        <div class="progreso-barra"><div id="progresoBarraInterior" class="progreso-barra-interior"></div></div>
        <span id="progresoTexto" class="progreso-texto">1 / 1</span>
      </div>
    </header>
    <div id="pantalla" class="pantalla"></div>
    <footer id="footer">
      <button id="btnSiguiente" class="btn" disabled>Continuar ▶</button>
    </footer>
  </div>

  <script src="datos.js"></script>
  <script src="motor.js"></script>
</body>
</html>
