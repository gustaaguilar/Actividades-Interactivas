<meta charset="UTF-8">
<!-- QST: pantalla "Tocá para empezar" (destraba el sonido en celulares y tablets) -->
<style id="qst-arr-css">
.qst-arr{position:fixed;top:0;right:0;bottom:0;left:0;z-index:2147483000;background:rgba(29,53,87,.9);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 30px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:clamp(24px,7vw,36px);border:0;width:100%;height:100%;margin:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.qst-arr .qst-arr-ico{font-size:80px;font-size:clamp(60px,18vw,96px);margin-bottom:10px;-webkit-animation:qstLate 1.4s ease-in-out infinite;animation:qstLate 1.4s ease-in-out infinite}
@-webkit-keyframes qstLate{0%,100%{-webkit-transform:scale(1)}50%{-webkit-transform:scale(1.12)}}
@keyframes qstLate{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
</style>
<script id="qst-arr-js">
(function () {
  if (window.__QST_ARR) return; window.__QST_ARR = true;
  var listo = false, pend = null, pendVoz = [], ctxs = [];
  var MP = window.HTMLMediaElement && HTMLMediaElement.prototype, playOrig = MP && MP.play;
  /* antes del primer toque no suena nada: se guarda el último audio pedido y se reproduce al tocar */
  var pendOk = null, pendMal = null;
  function aborto() { try { return new DOMException("Reemplazado antes del primer toque", "AbortError"); } catch (e) { var x = new Error("AbortError"); x.name = "AbortError"; return x; } }
  if (MP && playOrig) MP.play = function () {
    if (listo) return playOrig.apply(this, arguments);
    if (pend && pend !== this) { var m = pendMal; pendOk = pendMal = null; if (m) m(aborto()); }
    pend = this;
    if (!window.Promise) return;
    return new Promise(function (ok, mal) { pendOk = ok; pendMal = mal; });
  };
  var ss = window.speechSynthesis, speakOrig = ss && ss.speak;
  if (ss && speakOrig) ss.speak = function (u) { if (listo) return speakOrig.call(ss, u); pendVoz.push(u); };
  ["AudioContext", "webkitAudioContext"].forEach(function (n) {
    var C = window[n]; if (!C) return;
    var N = function () { var c = new (Function.prototype.bind.apply(C, [null].concat([].slice.call(arguments))))(); ctxs.push(c); return c; };
    N.prototype = C.prototype; window[n] = N;
  });
  function arrancar() {
    if (listo) return; listo = true;
    var b = document.getElementById("qstArranque"); if (b && b.parentNode) b.parentNode.removeChild(b);
    ctxs.forEach(function (c) { try { if (c.resume) c.resume(); } catch (e) {} });
    if (pend) {
      var p = pend, ok = pendOk, mal = pendMal; pend = pendOk = pendMal = null;
      try { var r = playOrig.call(p); if (r && r.then) r.then(function () { if (ok) ok(); }, function (e) { if (mal) mal(e); }); else if (ok) ok(); }
      catch (e) { if (mal) mal(e); }
    }
    else { try { var s = new Audio(); s.muted = true; var r2 = playOrig.call(s); if (r2 && r2["catch"]) r2["catch"](function () {}); } catch (e) {} }
    if (ss && speakOrig) pendVoz.splice(0).forEach(function (u) { try { speakOrig.call(ss, u); } catch (e) {} });
  }
  window.QST_arrancar = arrancar;
  function poner() {
    if (listo || document.getElementById("qstArranque")) return;
    var b = document.createElement("button"); b.className = "qst-arr"; b.id = "qstArranque"; b.type = "button";
    b.setAttribute("aria-label", "Tocá para empezar");
    b.innerHTML = '<span class="qst-arr-ico">🔊</span><span>Tocá para empezar</span>';
    b.onclick = function (e) { if (e && e.stopPropagation) e.stopPropagation(); arrancar(); };
    document.body.appendChild(b);
  }
  if (document.body) poner(); else document.addEventListener("DOMContentLoaded", poner);
})();
</script>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Las tablas del 4, 5 y 6 — Coloreamos aprendiendo</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Comic Sans MS', 'Trebuchet MS', sans-serif;
    background: linear-gradient(180deg, #FFF7E6, #FFE9C7);
    min-height: 100vh;
    overflow-y: auto;
    overflow-x: hidden;
    display: flex;
    align-items: flex-start;
    justify-content: center;
  }
  #app { width: 100%; max-width: 900px; min-height: 100vh; display:flex; align-items:flex-start; justify-content:center; }
  .pantalla {
    width: 100%;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 16px;
    overflow: visible;
  }
  h1 { color: #E8622C; margin: 8px 0; text-align:center; font-size: 1.6em; }
  h2 { color: #4E9BE0; margin: 6px 0; text-align:center; font-size: 1.3em; }
  .subtitulo { color: #8E5FBF; font-weight: bold; margin-bottom: 10px; }
  .imagen-portada { max-width: 80%; max-height: 32vh; object-fit: contain; margin: 6px 0; border-radius: 12px; }
  .imagen-festejo { max-width: 70%; max-height: 24vh; object-fit: contain; margin: 4px 0; border-radius: 12px; }
  .instruccion { text-align:center; color:#555; margin: 4px 0 10px; font-size: 0.95em; }

  /* Botones */
  .btn-siguiente, .btn-verificar {
    background: #4CAF50;
    color: white;
    border: none;
    padding: 12px 28px;
    border-radius: 30px;
    font-size: 1.1em;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
    box-shadow: 0 4px 0 #388E3C;
  }
  .btn-siguiente:disabled { background: #B0BEC5; box-shadow: 0 4px 0 #78909C; cursor: not-allowed; }
  .btn-finalizar { background: #78909C; color: white; border: none; padding: 10px 24px; border-radius: 30px; font-size: 1em; font-weight: bold; cursor: pointer; margin-top: 8px; box-shadow: 0 4px 0 #546E7A; }
  .btn-verificar { background: #F5901E; box-shadow: 0 4px 0 #C96F0E; }
  .oculto { display: none !important; }

  /* Perfil */
  .perfil { display:flex; align-items:center; gap:10px; cursor:pointer; margin: 10px 0; }
  .perfil-foto { width:92px; height:92px; border-radius:50%; object-fit:cover; border:3px solid #F5901E; }
  .perfil-texto { font-size: 0.75em; color:#555; }

  .lightbox {
    position: fixed; inset:0; background: rgba(0,0,0,0.85);
    display:flex; align-items:center; justify-content:center; z-index: 100;
  }
  .lightbox.oculto { display:none; }
  .lightbox-contenido { position:relative; text-align:center; max-width:90%; }
  .lightbox-contenido img { max-width:100%; max-height:70vh; border-radius:10px; transition: transform 0.3s; cursor: zoom-in; }
  .lightbox-contenido img.zoom { transform: scale(2.2); cursor: zoom-out; }
  .frase-lightbox { color:white; margin-top:10px; font-size:1.1em; }
  .cerrar-lightbox { position:absolute; top:-10px; right:0; color:white; font-size:1.8em; cursor:pointer; }

  /* Tarjetas mini de referencia (arriba del dibujo) */
  .grid-tarjetas-mini {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
    gap: 5px;
    width: 100%;
    margin-bottom: 6px;
  }
  .tarjeta-mini { border: 3px solid rgba(0,0,0,0.25); border-radius: 10px; overflow:hidden; transition: transform 0.15s, box-shadow 0.15s; font-size: 0.8em; cursor: pointer; text-align: center; padding-bottom: 3px; }
  .tarjeta-mini:active { transform: scale(0.96); }
  .tarjeta-mini.activo { box-shadow: 0 0 0 4px #333; transform: scale(1.05); border-color: #333; }
  .tarjeta-mini-titulo { font-weight:bold; text-align:center; padding: 3px; font-size: 0.9em; }
  .cuenta-mini { text-align:center; padding: 1px 2px; }

  /* Colorear */
  .contenedor-colorear { display:flex; flex-direction: column; align-items:center; width:100%; flex:1; min-height:0; }
  .dibujo-svg { width: 100%; max-height: 46vh; background: #E3F2FD; border-radius: 10px; border: 3px solid #4E9BE0; }
  .dibujo-svg.fondo-blanco { background: #FFFFFF; }
  .aviso-terminaste { color: #4CAF50; font-weight: bold; font-size: 1.15em; margin: 6px 0 0; text-align: center; }
  .region { stroke: #333; stroke-width: 1; cursor: pointer; }
  .region-bajo-imagen { stroke: none; }
  .region.pintado { cursor: default; }
  .etiqueta-region { font-size: 22px; font-weight: bold; fill: #333; pointer-events: none; }
  .imagen-fondo-lineas { pointer-events: none; }
  .etiqueta-pista { font-size: 60px; font-weight: 900; fill: #1a1a1a; pointer-events: none; paint-order: stroke; stroke: white; stroke-width: 6px; }
  .etiqueta-pista-chica { font-size: 14px; stroke-width: 2px; }

  /* Cierre */
  .resultados { background:white; border-radius:16px; padding:16px 24px; font-size:1.15em; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
  .resultados p { margin: 6px 0; }
</style>
</head>

  <div id="app"></div>

  <script src="datos.js"></script>
