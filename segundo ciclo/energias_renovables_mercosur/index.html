<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Energías Renovables en el MERCOSUR</title>
<style>
  :root {
    --ocre: #1a5276;
    --ocre-claro: #5aa9e6;
    --rojo: #1a5276;
    --negro: #14232c;
    --marron: #37474f;
    --verde-ok: #2e7d32;
    --rojo-error: #c0392b;
    --fondo: #eaf4fb;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    background: var(--fondo);
    color: var(--negro);
  }

  #app {
    max-width: 900px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: #fffdf8;
    box-shadow: 0 0 30px rgba(0,0,0,0.15);
  }

  /* ---------- Barra de progreso ---------- */
  #barra-progreso-wrap {
    background: var(--negro);
    padding: 8px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  #barra-progreso-fondo {
    flex: 1;
    height: 8px;
    background: rgba(255,255,255,0.2);
    border-radius: 4px;
    overflow: hidden;
  }
  #barra-progreso-interna {
    height: 100%;
    background: var(--ocre);
    width: 5%;
    transition: width 0.3s ease;
  }
  #texto-progreso {
    color: var(--ocre-claro);
    font-size: 0.8rem;
    white-space: nowrap;
  }

  /* ---------- Contenedor de pantalla ---------- */
  #pantalla-contenedor {
    flex: 1;
    padding: 24px 20px 40px;
  }

  .titulo-pantalla {
    color: var(--rojo);
    font-size: 1.5rem;
    margin: 0 0 12px;
    border-bottom: 3px solid var(--ocre);
    padding-bottom: 8px;
  }

  .cabecera-pantalla { margin-bottom: 20px; }

  .fila-consigna {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--ocre-claro);
    padding: 12px 14px;
    border-radius: 10px;
  }
  .texto-consigna { margin: 0; flex: 1; font-size: 1rem; }

  .btn-audio-consigna {
    background: var(--rojo);
    color: white;
    border: none;
    border-radius: 50%;
    width: 44px;
    height: 44px;
    font-size: 1.2rem;
    cursor: pointer;
    flex-shrink: 0;
  }
  .btn-audio-narracion {
    border-radius: 24px;
    width: auto;
    padding: 10px 20px;
    margin-bottom: 16px;
  }

  .imagen-actividad {
    width: 100%;
    max-height: 320px;
    object-fit: cover;
    border-radius: 10px;
    margin: 16px 0;
    display: block;
  }

  .imagen-tras-acierto {
    width: 100%;
    max-width: 100%;
    max-height: 280px;
    object-fit: cover;
    border-radius: 10px;
    margin: 12px 0 0;
    display: block;
  }

  .subtitulo-zona {
    font-weight: bold;
    color: var(--marron);
    margin: 18px 0 8px;
  }

  /* ---------- Portada ---------- */
  .portada-wrap { display: flex; flex-direction: column; }
  .portada-imagen { width: 100%; border-radius: 0; display: block; }
  .portada-textos { text-align: center; padding: 24px 16px; }
  .portada-titulo { color: var(--rojo); font-size: 2rem; margin: 0 0 8px; }
  .portada-subtitulo { color: var(--marron); font-size: 1rem; margin: 0 0 4px; }
  .portada-nivel { color: #888; font-size: 0.85rem; margin: 0 0 20px; }
  .btn-comenzar {
    background: var(--rojo);
    color: white;
    border: none;
    padding: 14px 40px;
    font-size: 1.1rem;
    border-radius: 30px;
    cursor: pointer;
  }
  .btn-comenzar:hover { background: var(--ocre); }

  .fila-comenzar {
    display: flex; align-items: center; justify-content: center;
    gap: 16px; flex-wrap: wrap; margin-top: 8px;
  }
  .foto-thumb {
    width: 92px; height: 92px; border-radius: 50%;
    object-fit: cover; border: 3px solid var(--rojo);
    cursor: pointer;
  }
  .firma { font-size: 0.85rem; color: #777; margin-top: 10px; text-align: center; }

  /* ---------- Lightbox ---------- */
  #lightbox {
    display: none; position: fixed; top: 0; left: 0;
    width: 100%; height: 100%; background: rgba(0,0,0,0.85);
    z-index: 999; align-items: center; justify-content: center;
    flex-direction: column;
  }
  #lightbox.activo { display: flex; }
  #lightbox img { max-width: 85%; max-height: 70%; border-radius: 12px; }
  #lightbox p { color: #fff; font-size: 1.1rem; margin-top: 16px; }
  #lightbox-cerrar {
    margin-top: 20px; background: #fff; color: #000;
    padding: 10px 24px; border-radius: 20px; border: none;
    font-size: 1rem; cursor: pointer;
  }

  /* ---------- Narración / Cierre ---------- */
  .texto-narracion { font-size: 1.05rem; line-height: 1.7; }
  .cierre-imagen { width: 100%; max-height: 140px; object-fit: cover; border-radius: 10px; margin-bottom: 10px; }
  .cierre-textos .texto-narracion { font-size: 0.92rem; line-height: 1.4; margin: 6px 0; }
  .cierre-textos .titulo-pantalla { margin-bottom: 6px; padding-bottom: 4px; font-size: 1.25rem; }
  .cierre-textos .btn-audio-narracion { margin-bottom: 8px; padding: 8px 16px; }

  /* ---------- Flipcards ---------- */
  .grid-flipcards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 14px;
    margin-top: 16px;
  }
  .flipcard { perspective: 1000px; height: 150px; cursor: pointer; }
  .flipcard-inner {
    position: relative; width: 100%; height: 100%;
    transition: transform 0.5s; transform-style: preserve-3d;
  }
  .flipcard.volteada .flipcard-inner { transform: rotateY(180deg); }
  .flipcard-frente, .flipcard-reverso {
    position: absolute; width: 100%; height: 100%;
    backface-visibility: hidden;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    padding: 10px; text-align: center; font-size: 0.9rem;
  }
  .flipcard-frente { background: var(--rojo); color: white; font-weight: bold; font-size: 1.1rem; flex-direction: column; }
  .flipcard-reverso {
    background: var(--ocre-claro); color: var(--negro); transform: rotateY(180deg);
    flex-direction: row; align-items: stretch; text-align: left; padding: 0; gap: 10px; overflow: hidden;
  }
  .flipcard-reverso-img {
    width: 42%; height: 100%; object-fit: cover;
    border-radius: 10px 0 0 10px; flex-shrink: 0;
  }
  .flipcard-reverso span {
    display: block; padding: 10px 12px 10px 0; font-size: 0.85rem; align-self: center;
  }

  /* ---------- Ordenar ---------- */
  .zona-elegidos, .zona-opciones-ordenar { margin-bottom: 10px; }
  .slot-orden {
    display: flex; align-items: center; gap: 8px;
    background: #f0e6d2; border: 2px dashed #c9b489;
    border-radius: 8px; padding: 10px 12px; margin-bottom: 6px;
    cursor: pointer;
  }
  .slot-orden.slot-lleno { border-style: solid; background: white; }
  .slot-numero { font-weight: bold; color: var(--rojo); }
  .slot-vacio { color: #999; font-style: italic; }
  .slot-orden.correcto { border-color: var(--verde-ok); background: #e4f3e6; }
  .slot-orden.incorrecto { border-color: var(--rojo-error); background: #f8e5e2; }
  .slot-icono-revelado { width: 24px; height: 24px; object-fit: cover; border-radius: 4px; margin-right: 4px; }

  .btn-opcion-ordenar, .btn-item-clasificar, .btn-opcion-multiple,
  .btn-palabra-banco, .btn-asociar {
    background: white;
    border: 2px solid var(--ocre);
    color: var(--negro);
    padding: 10px 14px;
    border-radius: 8px;
    margin: 4px 6px 4px 0;
    cursor: pointer;
    font-size: 0.95rem;
    display: inline-block;
  }
  .btn-opcion-ordenar:hover, .btn-item-clasificar:hover { background: var(--ocre-claro); }

  .btn-verificar {
    background: var(--verde-ok);
    color: white; border: none;
    padding: 12px 24px; border-radius: 8px;
    font-size: 1rem; cursor: pointer; margin-top: 12px;
  }
  .resultado-verificacion { margin-top: 10px; min-height: 24px; }
  .feedback-correcto { color: var(--verde-ok); font-weight: bold; }
  .feedback-incorrecto { color: var(--rojo-error); font-weight: bold; }
  .aviso-incompleto { color: var(--marron); font-style: italic; }

  /* ---------- Mapa ---------- */
  .mapa-wrap {
    position: relative;
    width: 100%;
    padding-top: 66.18%; /* proporción real 900x595.6 del mapa geográfico */
    background: #eaf2f8;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 10px;
  }
  .mapa-imagen-base {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: fill;
  }
  .mapa-svg-ruta { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  .mapa-ruta-linea { fill: none; stroke: #c0392b; stroke-width: 0.6; stroke-dasharray: 1.5,1.2; }
  .mapa-marcador {
    position: absolute;
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--rojo);
    color: white;
    border: 3px solid white;
    font-weight: bold;
    cursor: pointer;
    transform: translate(-50%, -50%);
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }
  .mapa-marcador.activo { background: var(--verde-ok); }
  .mapa-panel-info {
    margin-top: 14px; background: var(--ocre-claro);
    border-radius: 10px; padding: 14px 16px; min-height: 50px;
  }
  .mapa-panel-info h3 { margin: 0 0 6px; color: var(--rojo); }
  .mapa-panel-info p { margin: 0; }
  .mapa-placeholder { color: #777; font-style: italic; margin: 0; }

  /* ---------- Clasificar ---------- */
  .zona-items-clasificar { margin-bottom: 14px; }
  .btn-item-clasificar.seleccionado { background: var(--rojo); color: white; border-color: var(--rojo); }
  .icono-item-clasificar { width: 44px; height: 44px; object-fit: contain; display: block; margin: 0 auto 6px; }
  .zona-categorias, .zona-2-columnas {
    display: grid; gap: 10px;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  }
  .caja-categoria {
    background: #f0e6d2; border: 2px solid var(--ocre);
    border-radius: 10px; padding: 12px; min-height: 90px; cursor: pointer;
  }
  .caja-categoria-titulo { margin: 0 0 8px; color: var(--rojo); text-align: center; }
  .caja-categoria-lista { display: flex; flex-wrap: wrap; gap: 6px; min-height: 30px; }
  .chip-asignado {
    background: white; border: 1px solid var(--marron);
    border-radius: 6px; padding: 6px 8px; font-size: 0.85rem;
  }
  .chip-asignado.correcto { background: #e4f3e6; border-color: var(--verde-ok); color: var(--negro); }

  /* ---------- V/F ---------- */
  .item-vf {
    background: #f7f0e0; border-radius: 10px; padding: 14px;
    margin-bottom: 14px;
  }
  .texto-afirmacion { margin: 0 0 10px; font-size: 1rem; }
  .botones-vf { display: flex; gap: 10px; }
  .btn-vf {
    flex: 1; padding: 10px; border-radius: 8px;
    border: 2px solid var(--marron); background: white; cursor: pointer;
    font-size: 0.95rem;
  }
  .btn-vf.correcto { background: var(--verde-ok); color: white; border-color: var(--verde-ok); }
  .btn-vf.incorrecto { background: var(--rojo-error); color: white; border-color: var(--rojo-error); }
  .justificacion-vf { margin-top: 10px; font-size: 0.9rem; color: var(--marron); font-style: italic; }

  /* ---------- Multiple choice ---------- */
  .bloque-pregunta { margin-bottom: 22px; }
  .texto-pregunta { font-weight: bold; margin-bottom: 10px; }
  .opciones-multiple { display: flex; flex-direction: column; gap: 8px; }
  .btn-opcion-multiple { text-align: left; width: 100%; }
  .btn-opcion-multiple.correcto { background: var(--verde-ok); color: white; border-color: var(--verde-ok); }
  .btn-opcion-multiple.incorrecto { background: var(--rojo-error); color: white; border-color: var(--rojo-error); }

  /* ---------- Completar ---------- */
  .parrafo-completar { font-size: 1.05rem; line-height: 2.2; }
  .hueco-completar {
    display: inline-block; min-width: 100px; text-align: center;
    border-bottom: 2px solid var(--rojo); padding: 2px 6px;
    cursor: pointer; font-weight: bold; color: var(--rojo);
  }
  .hueco-completar.hueco-activo { background: var(--ocre-claro); }
  .hueco-completar.hueco-lleno { color: var(--negro); }
  .hueco-completar.correcto { background: #e4f3e6; border-color: var(--verde-ok); color: var(--verde-ok); }
  .hueco-completar.incorrecto { background: #f8e5e2; border-color: var(--rojo-error); color: var(--rojo-error); }
  .banco-palabras { margin-top: 16px; }
  .btn-palabra-banco.seleccionada { background: var(--rojo); color: white; }
  .btn-palabra-banco.usada { opacity: 0.35; cursor: default; }

  /* ---------- Sopa de letras ---------- */
  .tablero-sopa {
    display: grid; gap: 2px; margin-top: 14px;
    background: var(--marron); padding: 4px; border-radius: 8px;
  }
  .celda-sopa {
    background: white; aspect-ratio: 1;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.7rem; font-weight: bold; cursor: pointer;
    user-select: none;
  }
  .celda-sopa.celda-sel-temp { background: var(--ocre-claro); }
  .celda-sopa.celda-encontrada { background: var(--verde-ok); color: white; }
  .panel-definiciones { margin-top: 16px; }
  .definicion-item {
    background: #f0e6d2; border-radius: 8px; padding: 8px 12px;
    margin-bottom: 6px; font-size: 0.85rem; color: #999;
  }
  .definicion-item.encontrada { background: #e4f3e6; color: var(--negro); }

  /* ---------- Asociar ---------- */
  .bloque-asociar { margin-top: 14px; }
  .asociar-titulo {
    color: var(--rojo); margin: 0 0 8px;
    border-bottom: 2px solid var(--ocre); padding-bottom: 4px;
  }
  .columna-asociar { display: flex; flex-direction: column; }
  .btn-asociar { width: 100%; margin: 4px 0; text-align: left; }
  .btn-asociar.seleccionado { background: var(--rojo); color: white; }
  .btn-asociar.correcto { background: var(--verde-ok); color: white; border-color: var(--verde-ok); opacity: 0.8; }

  /* ---------- V/F secuencial ---------- */
  .item-vf-oculto { display: none; }

  /* ---------- Resumen de puntaje (cierre) ---------- */
  .resumen-puntaje {
    background: #f0e6d2; border: 2px solid var(--ocre);
    border-radius: 10px; padding: 12px 18px; margin: 10px 0;
    text-align: left;
  }
  .resumen-puntaje h3 { margin: 0 0 6px; color: var(--rojo); text-align: center; font-size: 1.05rem; }
  .resumen-fila { display: flex; justify-content: space-between; padding: 2px 0; font-size: 0.95rem; }
  .resumen-etiqueta { color: var(--marron); }
  .resumen-valor { font-weight: bold; }
  .resumen-valor.ok { color: var(--verde-ok); }
  .resumen-valor.mal { color: var(--rojo-error); }
  .resumen-valor.pct { color: var(--rojo); }
  .btn-jugar-de-nuevo { margin-top: 4px; margin-bottom: 10px; }

  /* ---------- Navegación inferior ---------- */
  #nav-inferior {
    display: flex; justify-content: space-between; gap: 10px;
    padding: 14px 20px; background: var(--negro);
  }
  #nav-inferior button {
    flex: 1; padding: 14px; border-radius: 8px; border: none;
    font-size: 1rem; cursor: pointer; font-weight: bold;
  }
  #btn-anterior { background: #555; color: white; }
  #btn-anterior:disabled { opacity: 0.3; cursor: default; }
  #btn-siguiente { background: var(--ocre); color: #ffffff; }
  #btn-siguiente:disabled { background: #999; color: #eee; cursor: default; opacity: 0.6; }

  @media (max-width: 600px) {
    .celda-sopa { font-size: 0.6rem; }
  }

  /* ---------- Mapa SVG de países ---------- */
  .mapa-svg-wrap { max-width: 420px; margin: 0 auto 12px; }
  .mapa-svg-wrap svg { width: 100%; height: auto; }
  .pais-clickeable { fill: var(--ocre-claro); stroke: var(--ocre); stroke-width: 1; cursor: pointer; transition: fill .2s; }
  .pais-clickeable:hover { fill: #3d8bcc; }
  .pais-clickeable.seleccionado { fill: #f5b301; }
  .pais-clickeable.completado { fill: var(--verde-ok); }
  .pais-otro { fill: #cfd8dc; stroke: #90a4ae; stroke-width: 1; }
  #pais-FLK { fill: var(--ocre-claro); stroke: var(--ocre); stroke-width: 1; pointer-events: none; transition: fill .2s; }
  #pais-FLK.completado { fill: var(--verde-ok); }
  .mapa-panel-info {
    background: #fff; border-radius: 10px; padding: 14px; margin-top: 10px;
    border: 2px solid var(--ocre-claro); display: none;
  }
  .mapa-panel-info.visible { display: block; }
  .mapa-bandera { width: 48px; vertical-align: middle; margin-right: 8px; }
  .mapa-placeholder { color: var(--marron); font-style: italic; }
  .mapa-avance-texto { font-size: .85rem; color: var(--marron); text-align: center; }

  /* ---------- Rampa (potencial/cinética) ---------- */
  .rampa-escena {
    position: relative; width: 100%; max-width: 420px; height: 220px;
    background-size: cover; background-position: center; background-color: #cfe8f9;
    border-radius: 10px; overflow: hidden; margin: 12px auto;
  }
  .rampa-auto {
    position: absolute; width: 70px; height: auto;
    transition: all 1.2s ease-in-out;
    transform: scaleX(-1);
  }
  .rampa-auto.arriba { left: 250px; top: 20px; transform: scaleX(-1) rotate(0deg); }
  .rampa-auto.bajando { left: 140px; top: 95px; transform: scaleX(-1) rotate(18deg); }
  .rampa-auto.abajo { left: 20px; top: 165px; transform: scaleX(-1) rotate(0deg); }
  .rampa-texto-paso { text-align: center; min-height: 3em; }

  /* ---------- Reflexión abierta ---------- */
  .reflexion-textarea {
    width: 100%; min-height: 90px; border: 2px solid var(--ocre-claro); border-radius: 10px;
    padding: 10px; font-size: 1rem; font-family: inherit;
  }

  /* ---------- Narración: imagen secundaria, fuente, enlace ---------- */
  .imagen-secundaria { margin-top: 14px; }
  .imagen-compacta { max-height: 190px; }
  .titulo-secundario { font-size: 1rem; color: var(--rojo); margin: 14px 0 6px; font-weight: bold; }
  .fuente-imagen { font-size: 0.8rem; color: var(--marron); font-style: italic; margin-top: 4px; }
  .btn-enlace-externo {
    display: inline-block; margin-top: 10px; padding: 10px 20px;
    background: var(--ocre); color: #fff; border-radius: 20px;
    text-decoration: none; font-size: 0.9rem;
  }

  /* ---------- Clasificar uno a la vez ---------- */
  .clasificar-uno-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .clasificar-uno-imagen {
    width: 100%; max-width: 380px; height: 260px; object-fit: contain;
    background: #fff; border-radius: 12px; border: 2px solid var(--ocre-claro);
  }
  .clasificar-uno-nombre { font-size: 1.15rem; font-weight: bold; color: var(--rojo); text-align: center; margin: 4px 0; }
  .clasificar-uno-botones { display: flex; gap: 12px; width: 100%; max-width: 380px; }
  .btn-cat-a, .btn-cat-b {
    flex: 1; padding: 14px 8px; border-radius: 12px; border: none;
    font-size: 0.95rem; font-weight: bold; color: #fff; cursor: pointer;
  }
  .btn-cat-a { background: var(--verde-ok); }
  .btn-cat-b { background: var(--rojo-error); }
  .btn-cat-a:disabled, .btn-cat-b:disabled { opacity: 0.6; }
  .btn-cat-a.correcto, .btn-cat-b.correcto { outline: 3px solid #fff700; }
  .btn-cat-a.incorrecto, .btn-cat-b.incorrecto { filter: brightness(0.7); }
  .clasificar-uno-progreso { font-size: 0.85rem; color: var(--marron); }

  /* ---------- Infografía (marcadores sobre imagen) ---------- */
  .infografia-wrap { position: relative; width: 100%; max-width: 420px; margin: 0 auto; }
  .infografia-imagen { width: 100%; border-radius: 10px; display: block; }
  .infografia-marcador {
    position: absolute; transform: translate(-50%, -50%);
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--rojo); color: #fff; border: 2px solid #fff;
    font-weight: bold; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,.3);
  }
  .infografia-marcador.activo { background: var(--ocre); }
  .infografia-marcador.visitado { background: var(--verde-ok); }
  .infografia-panel {
    background: #fff; border-radius: 10px; padding: 14px; margin-top: 10px;
    border: 2px solid var(--ocre-claro); display: none;
  }
  .infografia-panel.visible { display: block; }
  .infografia-panel h3 { margin: 0 0 6px; color: var(--rojo); }

  /* ---------- Narración dividida (resaltado sincronizado) ---------- */
  .imagen-dividida-wrap { position: relative; width: 100%; }
  .mitad-overlay {
    position: absolute; top: 0; bottom: 0; width: 50%;
    background: rgba(20,35,44,0); transition: background .4s;
    pointer-events: none;
  }
  .mitad-izq { left: 0; }
  .mitad-der { right: 0; }
  .mitad-overlay.atenuado { background: rgba(20,35,44,0.55); }
  .texto-mitad-a, .texto-mitad-b { opacity: 0.5; transition: opacity .4s; padding: 4px 0; }
  .texto-mitad-a.activo, .texto-mitad-b.activo { opacity: 1; font-weight: bold; }

  /* ---------- Recorrido (infografía con línea de ruta) ---------- */

  }
  .recorrido-linea {
    fill: none; stroke: var(--ocre); stroke-width: 0.8;
    stroke-dasharray: 2, 1.5; opacity: 0.85;
  }
</style>
