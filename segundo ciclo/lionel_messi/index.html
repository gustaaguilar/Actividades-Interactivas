<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>La vida de Messi - Fluidez lectora</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="La vida de Messi - Fluidez lectora">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="icon" sizes="16x16" href="favicon.ico">
    <link rel="icon" sizes="72x72" href="icon-72.png">
    <link rel="icon" sizes="192x192" href="icon-192.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="text/javascript" src="https://clic.xtec.cat/dist/jclic.js/jclic.min.js"></script>
    <style>
      body {
        margin: 0;
        overflow-x: hidden;
        background: #fff;
      }
      #jclic-wrapper {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div id="jclic-wrapper">
      <div class="JClic" data-project="messi.jclic"></div>
    </div>

    <script>
    /*
      Al rotar el dispositivo, jclic.js agranda el contenedor pero a veces
      no recalcula el tamaño del texto de las celdas. En lugar de reconstruir
      el player (que reinicia la actividad), forzamos a la libreria a recalcular
      el render disparando varios eventos 'resize' espaciados, SIN tocar el DOM
      del player. Asi el texto se reajusta y la actividad sigue viva.
    */
    (function () {
      function forzarRecalculo() {
        // Varios resize escalonados: jclic.js recalcula el layout en cada uno,
        // re-renderizando el texto al nuevo tamaño del contenedor.
        var tiempos = [150, 400, 800, 1200];
        tiempos.forEach(function (t) {
          setTimeout(function () {
            window.dispatchEvent(new Event('resize'));
          }, t);
        });
      }

      window.addEventListener('orientationchange', forzarRecalculo);

      // Respaldo: algunos navegadores moviles no emiten 'orientationchange'
      // de forma fiable; tambien escuchamos el cambio via matchMedia.
      if (window.matchMedia) {
        var mq = window.matchMedia('(orientation: portrait)');
        if (mq.addEventListener) {
          mq.addEventListener('change', forzarRecalculo);
        } else if (mq.addListener) {
          mq.addListener(forzarRecalculo);
        }
      }
    })();
    </script>
  </body>
</html>
