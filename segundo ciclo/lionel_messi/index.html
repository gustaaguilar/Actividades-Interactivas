<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>La vida de Messi - Fluidez lectora</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="La vida de Messi - Fluidez lectora">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="icon" sizes="16x16" href="favicon.ico">
    <link rel="icon" sizes="72x72" href="icon-72.png">
    <link rel="icon" sizes="192x192" href="icon-192.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="text/javascript" src="https://clic.xtec.cat/dist/jclic.js/jclic.min.js"></script>
    <style>
      body {
        margin: 0;
        overflow-x: hidden;
        background: #fff;
      }
      #jclic-wrapper {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div id="jclic-wrapper">
      <div class="JClic" data-project="messi.jclic"></div>
    </div>

    <script>
    (function () {
      var PROJECT = "messi.jclic";
      var reloadTimer = null;

      function reconstruirJClic() {
        var wrapper = document.getElementById('jclic-wrapper');
        if (!wrapper) return;

        // Destruir el player actual borrando el contenedor y recreándolo
        wrapper.innerHTML = '<div class="JClic" data-project="' + PROJECT + '"></div>';

        // jclic.js escanea el DOM al cargar; hay que reiniciarlo manualmente
        // La forma más efectiva es recargar el script de jclic
        var viejoScript = document.querySelector('script[src*="jclic"]');
        if (viejoScript) {
          var nuevoScript = document.createElement('script');
          nuevoScript.type = 'text/javascript';
          nuevoScript.src = viejoScript.src + '?r=' + Date.now(); // cache-bust
          document.head.appendChild(nuevoScript);
        }
      }

      var anchoAnterior = window.innerWidth;

      function manejarCambio() {
        var anchoActual = window.innerWidth;
        // Solo reconstruir si el ancho cambió (rotación real, no scroll)
        if (anchoActual === anchoAnterior) return;
        anchoAnterior = anchoActual;

        clearTimeout(reloadTimer);
        reloadTimer = setTimeout(reconstruirJClic, 500);
      }

      window.addEventListener('orientationchange', function () {
        clearTimeout(reloadTimer);
        reloadTimer = setTimeout(function () {
          anchoAnterior = 0; // forzar detección de cambio
          manejarCambio();
        }, 500);
      });

      window.addEventListener('resize', manejarCambio);
    })();
    </script>
  </body>
</html>
