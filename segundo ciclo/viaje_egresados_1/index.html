<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El viaje de egresados 1 · QueSepanTodos.com</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧳</text></svg>">
<style>
:root{
  --tinta:#1e2a5a; --azul:#1d4ed8; --rojo:#dc2626; --verde:#15803d; --amarillo:#facc15;
  --papel:#fffdf7; --linea:#dbe7f7; --gris:#64748b; --ok:#16a34a; --mal:#dc2626;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{
  font-family:"Trebuchet MS","Segoe UI",Roboto,Verdana,sans-serif;color:var(--tinta);
  background-color:var(--papel);
  background-image:linear-gradient(var(--linea) 1px,transparent 1px),linear-gradient(90deg,var(--linea) 1px,transparent 1px);
  background-size:22px 22px;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
#app{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Cabecera */
#cab{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--tinta);color:#fff;flex:0 0 auto}
#cab .ctit{font-weight:bold;white-space:nowrap}
#cab .cpant{flex:1;font-size:.9rem;opacity:.9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#cab .cpts{font-weight:bold;background:rgba(255,255,255,.15);border-radius:12px;padding:2px 10px;white-space:nowrap}
#brep{background:none;border:2px solid rgba(255,255,255,.4);color:#fff;border-radius:50%;width:34px;height:34px;font-size:1rem;cursor:pointer}
#brep.sonando{animation:pulso 1s infinite}
@keyframes pulso{50%{transform:scale(1.15);border-color:var(--amarillo)}}
/* Escena */
#esc{flex:1 1 auto;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 10px;gap:6px;min-height:0}
#esc.bloq{cursor:progress}
/* Pie */
#pie{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;flex:0 0 auto;background:rgba(30,42,90,.06);border-top:2px solid var(--linea)}
#pie.oculto{display:none}
.bnav{border:none;border-radius:10px;padding:8px 12px;font:inherit;font-size:1rem;cursor:pointer;background:#e2e8f0;color:var(--tinta)}
#bsig{background:#cbd5e1;color:#fff;font-weight:bold;padding:10px 22px;font-size:1.05rem}
#bsig.listo{background:var(--verde);animation:latido 1.4s infinite}
@keyframes latido{50%{box-shadow:0 0 0 6px rgba(21,128,61,.25)}}
#bsig:disabled{cursor:not-allowed}
#ind{font-size:.85rem;color:var(--gris)}
.rev{background:#fde68a}
/* Comunes */
.btn{white-space:nowrap;border:none;border-radius:14px;background:var(--azul);color:#fff;font:inherit;font-weight:bold;padding:12px 26px;font-size:1.15rem;cursor:pointer;box-shadow:0 4px 0 #1e3a8a}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #1e3a8a}
.oculto{display:none!important}
.titila{animation:titila 1s infinite}
@keyframes titila{0%,100%{box-shadow:0 0 0 3px var(--amarillo)}50%{box-shadow:0 0 0 3px rgba(250,204,21,.15)}}
.brilla{animation:brilla .8s infinite alternate}
@keyframes brilla{to{opacity:.35}}
.sacude{animation:sacude .4s}
@keyframes sacude{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tpreg{font-size:1.15rem;font-weight:bold;text-align:center;max-width:640px;line-height:1.3;padding:6px 12px;border-radius:12px;background:#fff}
.tprog{font-size:.8rem;color:var(--gris)}
/* Portada */
.portada{display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;max-width:720px}
.portada .pimg{max-height:30vh;max-width:92vw;border-radius:18px;border:5px solid #fff;box-shadow:0 6px 18px rgba(30,42,90,.25)}
.portada h1{margin:0;font-size:2.1rem;letter-spacing:.5px;line-height:1.1}
.portada .sub{margin:0;font-size:1rem;color:#334155;max-width:520px}
.portada .parte{font-weight:bold;font-size:1.15rem;color:#b45309}
.portada .grado{display:inline-block;background:var(--amarillo);border-radius:10px;padding:2px 12px;font-weight:bold}
.pfila{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:nowrap}
.firma{display:flex;align-items:center;gap:8px;text-align:left;font-size:.78rem;line-height:1.3}
.firma div{max-width:190px}
.firma img{width:92px;height:92px;border-radius:50%;object-fit:cover;border:3px solid var(--tinta);cursor:zoom-in;background:#e2e8f0}
.fuente{font-size:.72rem;color:var(--gris);margin:0;max-width:560px}
/* Lightbox */
.lb{position:fixed;inset:0;background:rgba(15,23,42,.94);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;text-align:center;padding:16px}
.lbmarco{overflow:hidden;border-radius:16px;max-width:92vw;max-height:66vh}
.lbmarco img{display:block;max-width:92vw;max-height:66vh;transition:transform .35s;cursor:zoom-in}
.lbx{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;background:#fff;color:var(--tinta);border:none;border-radius:50%;width:42px;height:42px;font-size:1.3rem;cursor:pointer}
.lbfrase{font-size:1.4rem;font-weight:bold;margin:0}
.lbdatos{font-size:.9rem;margin:0;opacity:.85}
/* Narración */
.narr{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.nvis{display:flex;flex-direction:column;align-items:center;gap:6px}
.nvis .reloj{height:40vh;max-width:84vw}
.ncap{display:flex;flex-direction:column;gap:4px;align-items:center;min-height:2.6em}
.chip{background:#fff;border-radius:12px;padding:6px 14px;font-weight:bold;font-size:1.05rem;text-align:center;max-width:640px}
.chip.prev{opacity:.85;box-shadow:none}
.puntero{position:absolute;font-size:2.4rem;z-index:5;pointer-events:none;transition:left .6s,top .6s;display:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.fmt{display:flex;gap:14px;align-items:stretch;justify-content:center;flex-wrap:wrap}
.fcol{display:flex;flex-direction:column;align-items:center;gap:6px;background:#fff;border-radius:16px;padding:10px 12px;border:3px solid var(--linea);min-width:150px}
.flab{font-weight:bold;text-align:center;font-size:.95rem}
.fsol{font-size:3rem;line-height:1;padding:4px 12px;border-radius:14px}
/* Trivia */
.triv{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;max-width:680px}
.tvis{display:flex;justify-content:center;align-items:center}
.tvis .reloj{height:36vh;max-width:80vw}
.tvis img.decor{max-height:24vh;max-width:90vw;border-radius:14px;border:4px solid #fff;box-shadow:0 3px 10px rgba(30,42,90,.2)}
.topc{display:grid;gap:8px;width:100%;max-width:520px}
.topc.dos{grid-template-columns:1fr 1fr}
.topc.uno{grid-template-columns:1fr}
.opc{border:3px solid var(--tinta);background:#fff;border-radius:14px;padding:10px 8px;font:inherit;font-size:1.25rem;font-weight:bold;color:var(--tinta);cursor:pointer;min-height:52px}
.topc.uno .opc{font-size:1.05rem}
.topc.medio .opc{font-size:1rem;padding:8px 6px}
.opc.ok{background:var(--ok);border-color:var(--ok);color:#fff;opacity:1!important}
.opc.mal{background:#fee2e2;border-color:var(--mal);color:var(--mal);pointer-events:none}
.opc.atenuada{opacity:.35;pointer-events:none}
.xx{display:none;gap:10px;align-items:center;background:#fff;border:4px dashed #ec4899;border-radius:16px;padding:8px;max-width:560px}
.xx img{height:20vh;max-width:36vw;border-radius:10px;object-fit:cover}
.xx2{font-size:.95rem;line-height:1.45}
.xx3{font-weight:bold;color:#db2777;font-size:1.05rem}
/* Sopa */
.sopa{display:grid;width:min(94vw,50vh);gap:2px;touch-action:manipulation}
.cel{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--linea);font-weight:bold;font-size:min(4.6vw,2.6vh);border-radius:4px;color:var(--tinta)}
.cel.ini{background:var(--amarillo)}
.cel.hall{color:#fff}
.spal{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:560px}
.spal span{background:#fff;border:2px solid var(--tinta);border-radius:10px;padding:3px 10px;font-weight:bold}
.spal span.hall{text-decoration:line-through;color:#fff}
/* Cierre */
.cierre{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.cierre img.cimg{max-height:30vh;max-width:90vw;border-radius:18px;border:5px solid #fff;box-shadow:0 6px 18px rgba(30,42,90,.25)}
.cierre h2{margin:0;font-size:2rem}
.stats{display:grid;grid-template-columns:repeat(4,auto);gap:8px}
.stats div{background:#fff;border-radius:12px;padding:6px 12px;border:2px solid var(--linea);font-size:1.05rem}
.stats b{display:block;font-size:1.4rem}

/* ===== Escuela Abierta: componentes nuevos ===== */
.oc{opacity:0;visibility:hidden}
.vfila.tres{flex-wrap:nowrap;gap:5px}
.vfila.tres .vimg{max-width:28vw;height:auto}
.vfila.tres .vcaja{padding:3px}
.vfila.tres .barras{width:min(47vw,44vh);height:auto!important}
.vfila{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;max-width:96vw}
.vcol{display:flex;flex-direction:column;gap:6px;align-items:center}
.vimg{max-width:92vw;border-radius:14px;border:4px solid #fff;box-shadow:0 3px 10px rgba(30,42,90,.2);display:block}
.vimg.zoom{cursor:zoom-in}
.vcaja{background:#fff;border:3px solid var(--linea);border-radius:14px;padding:6px 8px;display:flex;flex-direction:column;align-items:center;gap:4px}
.vcaja.datos{border-color:var(--tinta)}
.vcajatit{font-weight:bold;font-size:.9rem}
.vtxt{text-align:center;font-size:.98rem;max-width:620px;line-height:1.35}
.vtxt.grande{font-size:1.2rem;line-height:1.5}
.vpre{font-family:"Courier New",monospace;font-weight:bold;font-size:min(3.6vw,1.9vh);background:#fff;border:3px solid var(--tinta);border-radius:12px;padding:4px 12px;margin:0;line-height:1.25;color:var(--tinta)}
.pizarra{background:#14324f;color:#fff;border:5px solid #8b5a2b;border-radius:12px;padding:6px 10px;min-width:240px;max-width:92vw;font-size:.95rem}
.pztit{text-align:center;font-weight:bold;color:var(--amarillo);margin-bottom:2px}
.pzfila{display:flex;justify-content:space-between;gap:12px;padding:3px 6px;border-radius:8px}
.pzfila b{color:var(--amarillo);white-space:nowrap}
.pzfila.titila{background:rgba(250,204,21,.18)}
.globos{display:flex;gap:10px;justify-content:center}
.globo{display:flex;flex-direction:column;align-items:center;font-weight:bold;border-radius:12px;padding:2px 4px}
.globo b{background:#fff;border:2px solid var(--tinta);border-radius:8px;padding:0 6px;font-size:.95rem}
.premios{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.premio{background:#fff;border:2px solid #ca8a04;border-radius:10px;padding:3px 8px;font-size:.85rem;display:flex;gap:6px;align-items:center}
.premio span{color:#334155}
.guarda{display:flex;flex-wrap:wrap;justify-content:center;row-gap:6px;align-items:flex-end;gap:0;background:#fff;border-radius:10px;padding:6px;max-width:96vw;overflow:hidden}
.gfig{display:flex;align-items:flex-end;padding:0 1px;border-radius:6px}
.gfig .fig{max-width:17vw}
.gfig.gmal{background:#fee2e2;box-shadow:0 0 0 3px var(--mal)}
.ghueco{display:flex;align-items:center;justify-content:center;width:8vh;height:8vh;border:3px dashed var(--tinta);border-radius:8px;font-weight:bold;font-size:1.6rem}
.gfig.escrito .fig{animation:aparece .5s}
@keyframes aparece{from{transform:scale(.2);opacity:0}}
.figw{position:relative;display:inline-flex;align-items:center;justify-content:center}
.fnum{position:absolute;font-weight:bold;color:#fff;text-shadow:0 0 3px #000}
.barras{display:block;max-width:92vw;background:#fff;border-radius:12px}
.btit{font:bold 11px "Trebuchet MS",sans-serif;fill:var(--tinta);text-anchor:middle}
.beje{font:8px Verdana,sans-serif;fill:#475569;text-anchor:end}
.bval{font:bold 8px Verdana,sans-serif;fill:#1e2a5a;text-anchor:middle}
.botellas{display:flex;flex-wrap:wrap;gap:4px;align-items:flex-end;justify-content:center;max-width:92vw}
.botlab{font:bold 8px Verdana,sans-serif;fill:#1e3a8a;text-anchor:middle}
.blab{font:bold 7.5px Verdana,sans-serif;fill:#334155;text-anchor:middle}
.bgrid{stroke:#e2e8f0;stroke-width:.8}
.bbase{stroke:#334155;stroke-width:1.2}
.barra{transform-box:fill-box;transform-origin:bottom;transition:transform .9s ease,opacity .3s}
.bval.oc{opacity:0}
.barra.oc{transform:scaleY(0);opacity:1;visibility:visible}
.vtabla{border-collapse:collapse;background:#fff;font-size:.95rem;max-width:94vw}
.vtabla th,.vtabla td{border:2px solid var(--tinta);padding:5px 8px;text-align:center}
.vtabla th.vac{background:#334155;color:#fde68a}
.vtabla th.escrito{background:#15803d!important;color:#fff!important}
.vtabla.vert th{font-size:.9em!important;padding:5px 10px!important}
.vtabla.vert td{font-size:1.1em;padding:5px 12px!important}
.vtabla.vert th:first-child{text-align:right}
.vtabla.vert td{min-width:5.5em}
.red{display:block;max-width:90vw}
.recta{display:block;max-width:94vw;background:#fff;border-radius:10px}
.rtit{font:bold 17px "Trebuchet MS",sans-serif;fill:#1e2a5a;text-anchor:middle}
.rlab{font:bold 22px "Trebuchet MS",sans-serif;fill:#1e2a5a;text-anchor:middle}
.rlab2{font:bold 15px "Trebuchet MS",sans-serif;fill:#475569;text-anchor:middle}
.rpt{font:bold 17px "Trebuchet MS",sans-serif;text-anchor:middle}
.recta .oc{opacity:0}
.recta g{transition:opacity .6s}
.tarjetas{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;background:#fff;border-radius:12px;padding:8px}
.tgrupo{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.85rem;border-radius:8px;padding:3px}
.tcartas{display:flex;flex-wrap:wrap;gap:2px;max-width:90px;justify-content:center}
.tcarta{width:14px;height:20px;border-radius:3px;border:1px solid #1e2a5a}
.plano{display:block;max-width:94vw;background:#fff;border-radius:10px}
.beje2{font:8px Verdana,sans-serif;fill:#475569;text-anchor:middle}
.plano circle.oc{opacity:0}
.plano circle{transition:opacity .5s}
.lista{text-align:left;line-height:1.6}
.vtabla th{background:var(--tinta);color:#fff;font-size:.85rem}
.vtabla td.vac{color:#94a3b8;font-weight:bold}
.vtabla td.escrito,.cres.escrito,.vac.escrito{color:var(--verde);font-weight:bold;background:#dcfce7;animation:aparece .5s}
.vtabla tr.titila td,.vtabla td.titila{background:#fef9c3}
.picto{background:#fff;border-radius:12px;padding:6px 8px;border:2px solid var(--linea)}
.pclave{font-size:.85rem;font-weight:bold;text-align:center;display:flex;align-items:center;justify-content:center;gap:4px}
.pclave .pers{height:3.2vh}
.pcols{display:flex;gap:3px;align-items:flex-end;justify-content:center}
.pcol{display:flex;flex-direction:column;align-items:center;min-width:31px}
.pstack{display:flex;flex-direction:column-reverse;align-items:center;min-height:6vh;border-radius:8px;padding:2px}
.pstack .pers{height:2.7vh;margin-top:1px}
.pstack.escrito .pers{animation:aparece .5s}
.plab{font-size:min(.75rem,3vw);font-weight:bold;border-top:2px solid #334155;padding-top:2px;text-align:center}
.pers{display:inline-block;height:3.6vh;width:auto}
.pictoH{background:#fffaf0;border-radius:12px;padding:6px;border:2px solid var(--linea)}
.pictoH table{border-collapse:collapse;background:#fff}
.pictoH th{background:#1e3a8a;color:#fff;font-size:.75rem;padding:2px 6px;border:2px solid #1e3a8a;text-align:right;white-space:nowrap}
.pictoH td{border:2px solid #1e3a8a;padding:1px 4px;white-space:nowrap}
.pictoH td .pers{height:3.6vh;margin:0 2px}
.pictoH tr.titila td{background:#fef9c3}
.cuenta{font-family:"Courier New",monospace;font-weight:bold;font-size:2rem;background:#fff;border:3px solid var(--tinta);border-radius:12px;padding:6px 18px;display:inline-block}
.cfila{display:flex;justify-content:space-between;gap:12px;text-align:right}
.cfila span:last-child{min-width:4ch;text-align:right}
.cfila.clin{border-bottom:3px solid var(--tinta)}
.cmal .cres:not(.escrito){color:var(--mal);text-decoration:line-through}
.cuenta .vac{color:#94a3b8}
.calcu{background:#334155;border-radius:14px;padding:8px;width:min(46vw,210px)}
.cdisp{background:#c7f9cc;font-family:"Courier New",monospace;font-weight:bold;font-size:1.15rem;text-align:right;padding:6px 8px;border-radius:8px;margin-bottom:6px;color:#14532d;white-space:nowrap;overflow:hidden}
.cteclas{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.cteclas span{background:#e2e8f0;border-radius:6px;text-align:center;font-weight:bold;font-size:.8rem;padding:3px 0}
.bandejas{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:92vw}
.bandeja{display:grid;grid-template-columns:repeat(3,1fr);background:#cbd5e1;border:3px solid #64748b;border-radius:10px;padding:4px;transition:opacity .5s,transform .5s}
.sueltos{display:flex;flex-wrap:wrap;gap:2px;max-width:120px;padding:4px;border:3px dashed var(--mal);border-radius:10px;transition:opacity .5s}
.vaso{font-size:min(6vw,4.4vh);line-height:1.1}
.bandejas.titila{border-radius:12px}
.distin{display:block}
.distin .oc{opacity:0}
.distin circle,.distin path{transition:opacity .6s}
.tarjeta{background:#fef3c7;border:3px solid #b45309;border-radius:12px;padding:8px 14px;font-weight:bold;max-width:360px;text-align:center;font-size:1.02rem;box-shadow:0 3px 0 #b45309}
.mpasos{font-family:"Courier New",monospace;font-weight:bold;font-size:.95rem;line-height:1.35}
.tris{display:grid;grid-template-columns:repeat(3,auto);gap:6px 14px;justify-content:center;background:#fff;border-radius:12px;padding:6px}
.trinum{font:bold 22px "Trebuchet MS",sans-serif;fill:var(--amarillo);stroke:#1e2a5a;stroke-width:.8}
.union{display:block}
.sillas{display:flex;flex-direction:column;gap:3px;background:#fff;border-radius:12px;padding:6px 10px;border:2px solid var(--linea)}
.sfila{display:flex;align-items:center;gap:8px;justify-content:space-between;font-size:min(3.8vw,2.3vh);transition:opacity .5s}
.sfila b{background:var(--tinta);color:#fff;border-radius:8px;padding:0 8px;font-size:.9rem}
.sfila.oc{display:none}
.sfila.nueva{background:#dcfce7;border-radius:8px}
.circs{display:block;max-width:90vw;background:#fff;border-radius:10px}
/* opciones con figuras */
.topc.cuatro{grid-template-columns:repeat(auto-fit,minmax(120px,1fr));max-width:640px}
.opc.fopc{display:flex;align-items:center;justify-content:center;padding:6px;min-height:auto}
.opc.fopc .barras{max-width:100%}
.opc.ok .mpasos,.opc.ok .btit,.opc.ok .blab{color:#fff}
/* pesca */
.pesca{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;max-width:640px}
.pdecor{max-height:20vh;border-radius:12px;border:3px solid #fff}
.estanque{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;background:linear-gradient(#7dd3fc,#0ea5e9);border:5px solid #1d4ed8;border-radius:18px;padding:8px}
.pez svg{max-width:100%}
.pez{min-width:0;background:none;border:none;cursor:pointer;display:flex;justify-content:center;align-items:center;animation:flota 2.4s ease-in-out infinite;padding:2px}
@keyframes flota{50%{transform:translateY(-6px) rotate(-3deg)}}
.pez.subiendo{animation:none;transform:translateY(-40px) scale(1.15);transition:transform .6s}
.pescadas{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:5vh}
.pescadas .pez{animation:none;cursor:default}
.pescadas .pez svg{height:5vh!important}
/* sopa */
.sdecor{max-height:9vh;border-radius:10px;border:3px solid #fff}
/* enviar resultados */
.benv{background:#16a34a;box-shadow:0 4px 0 #14532d;font-size:1rem;padding:10px 18px}
.envcaja{background:#fff;color:var(--tinta);border-radius:16px;padding:14px 18px;display:flex;flex-direction:column;gap:10px;align-items:center;max-width:92vw}
.envcaja h3{margin:0}
.envcaja label{display:flex;flex-direction:column;font-weight:bold;gap:3px;width:260px;max-width:80vw}
.envcaja input{font:inherit;padding:8px;border:2px solid var(--tinta);border-radius:10px;-webkit-user-select:text;user-select:text}
.envimg{max-width:86vw;max-height:52vh;border-radius:10px;border:2px solid var(--linea);-webkit-touch-callout:default}
.envmsg{margin:0;font-size:.9rem;text-align:center;color:#334155}
.envbot{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.envbot .btn{text-decoration:none}
.btn.wa{background:#22c55e;box-shadow:0 4px 0 #15803d}
@media (max-width:480px){.cuenta{font-size:1.6rem}.vtabla{font-size:.8rem}.vtabla th,.vtabla td{padding:3px 4px}.pizarra{font-size:.82rem}.cierre .stats{grid-template-columns:repeat(2,auto)}}
@media (min-width:700px){.topc.uno{grid-template-columns:1fr 1fr;max-width:780px}.triv{max-width:820px}}
@media (max-width:480px){.portada .pfila{flex-wrap:wrap}.cierre img.cimg{max-height:22vh}}
@media (max-height:600px){.portada .pimg{max-height:24vh}.portada{gap:4px}.portada .sub{font-size:.9rem}.cierre img.cimg{max-height:20vh}.cierre h2{font-size:1.5rem}.tpreg{padding:4px 10px}}
/* imágenes y visuales más grandes (revisión Escuela Abierta 1) */
.vfila.deco{gap:8px}
.vfila.deco{flex-direction:column}
@media (min-width:900px) and (min-aspect-ratio:3/2){.vfila.deco{flex-direction:row}}
.vtabla{font-size:1.15rem}
.vtabla th,.vtabla td{padding:6px 12px}
.vtabla th{font-size:.95rem}
.cuenta{font-size:2.5rem;padding:8px 22px}
.calcu{width:min(48vw,250px)}
@media (min-width:700px){.calcu{width:auto;min-width:230px}}
.cdisp{font-size:clamp(.8rem,3.4vw,1.3rem)}
.cteclas span{font-size:.95rem;padding:5px 0}
.sdecor{max-height:20vh}
.globo b{font-size:1.05rem}
.premio{font-size:.95rem}
@media (max-width:560px){.vtabla th,.vtabla td{padding:3px 4px}.vtabla th{font-size:.78rem;line-height:1.15}.vtabla{max-width:100%}}
.cfuente{font-size:.66rem;max-width:620px;text-align:center;line-height:1.25}
@media (max-height:600px){.cierre{gap:5px}.cierre img.cimg{max-height:15vh}.cfuente{font-size:.6rem;line-height:1.15}}
@media (max-width:480px){.cierre .stats{grid-template-columns:repeat(4,auto);gap:4px}.cierre .stats div{padding:4px 6px;font-size:.78rem}.cierre .stats b{font-size:1.15rem}.cierre .firma img{width:64px;height:64px}}
@media (prefers-reduced-motion:reduce){.titila,.brilla,#bsig.listo,#brep.sonando{animation:none}}
@media (max-width:480px){.cierre .pfila{flex-wrap:wrap}.pfila .btn{padding:12px 14px;font-size:1rem;white-space:nowrap;flex-shrink:0}.firma{font-size:.7rem}.firma div{max-width:150px}.portada h1{font-size:1.6rem}}
@media (max-height:620px){.tpreg{font-size:1rem}.opc{min-height:44px;padding:6px;font-size:1.1rem}.portada h1{font-size:1.5rem}}
</style>
</head>
<body>
<div id="app"></div>
<script src="../../recursos/enviar-tarea.js"></script>
<script src="datos.js"></script>
<script src="motor.js"></script>
</body>
