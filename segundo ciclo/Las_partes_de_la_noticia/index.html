<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Las partes de la noticia — 4to grado</title>
<style>
  :root {
    --ocre: #c98a3b;
    --ocre-claro: #e8c789;
    --rojo: #7a2418;
    --negro: #201510;
    --marron: #4a3222;
    --verde-ok: #3f7d4a;
    --rojo-error: #a13a2e;
    --fondo: #f3ead9;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Georgia', 'Times New Roman', serif;
    background: var(--fondo);
    color: var(--negro);
  }

  #app {
    max-width: 900px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: #fffdf8;
    box-shadow: 0 0 30px rgba(0,0,0,0.15);
  }

  /* ---------- Barra de progreso ---------- */
  #barra-progreso-wrap {
    background: var(--negro);
    padding: 8px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  #barra-progreso-fondo {
    flex: 1;
    height: 8px;
    background: rgba(255,255,255,0.2);
    border-radius: 4px;
    overflow: hidden;
  }
  #barra-progreso-interna {
    height: 100%;
    background: var(--ocre);
    width: 5%;
    transition: width 0.3s ease;
  }
  #texto-progreso {
    color: var(--ocre-claro);
    font-size: 0.8rem;
    white-space: nowrap;
  }

  /* ---------- Contenedor de pantalla ---------- */
  #pantalla-contenedor {
    flex: 1;
    padding: 24px 20px 40px;
  }

  .titulo-pantalla {
    color: var(--rojo);
    font-size: 1.5rem;
    margin: 0 0 12px;
    border-bottom: 3px solid var(--ocre);
    padding-bottom: 8px;
  }

  .cabecera-pantalla { margin-bottom: 20px; }

  .fila-consigna {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--ocre-claro);
    padding: 12px 14px;
    border-radius: 10px;
  }
  .texto-consigna { margin: 0; flex: 1; font-size: 1rem; }

  .btn-audio-consigna {
    background: var(--rojo);
    color: white;
    border: none;
    border-radius: 50%;
    width: 44px;
    height: 44px;
    font-size: 1.2rem;
    cursor: pointer;
    flex-shrink: 0;
  }
  .btn-audio-narracion {
    border-radius: 24px;
    width: auto;
    padding: 10px 20px;
    margin-bottom: 16px;
  }

  .imagen-actividad {
    width: 100%;
    max-height: 320px;
    object-fit: cover;
    border-radius: 10px;
    margin: 16px 0;
    display: block;
  }

  .subtitulo-zona {
    font-weight: bold;
    color: var(--marron);
    margin: 18px 0 8px;
  }

  /* ---------- Portada ---------- */
  .portada-wrap { display: flex; flex-direction: column; }
  .portada-imagen { width: 100%; border-radius: 0; display: block; }
  .portada-textos { text-align: center; padding: 24px 16px; }
  .portada-titulo { color: var(--rojo); font-size: 2rem; margin: 0 0 8px; }
  .portada-subtitulo { color: var(--marron); font-size: 1rem; margin: 0 0 4px; }
  .portada-nivel { color: #888; font-size: 0.85rem; margin: 0 0 20px; }
  .btn-comenzar {
    background: var(--rojo);
    color: white;
    border: none;
    padding: 14px 40px;
    font-size: 1.1rem;
    border-radius: 30px;
    cursor: pointer;
  }
  .btn-comenzar:hover { background: var(--ocre); }

  .fila-comenzar {
    display: flex; align-items: center; justify-content: center;
    gap: 16px; flex-wrap: wrap; margin-top: 8px;
  }
  .foto-thumb {
    width: 92px; height: 92px; border-radius: 50%;
    object-fit: cover; border: 3px solid var(--rojo);
    cursor: pointer;
  }
  .firma { font-size: 0.85rem; color: #777; margin-top: 10px; text-align: center; }
  .mail-contacto { font-size: 0.8rem; color: #888; margin-top: 2px; text-align: center; }

  /* ---------- Lightbox ---------- */
  #lightbox {
    display: none; position: fixed; top: 0; left: 0;
    width: 100%; height: 100%; background: rgba(0,0,0,0.85);
    z-index: 999; align-items: center; justify-content: center;
    flex-direction: column;
  }
  #lightbox.activo { display: flex; }
  #lightbox-img-wrap {
    max-width: 85%; max-height: 60%;
    overflow: auto; border-radius: 12px;
    -webkit-overflow-scrolling: touch;
  }
  #lightbox-img-wrap::-webkit-scrollbar { display: none; }
  #lightbox img {
    display: block; max-width: 100%; height: auto;
    border-radius: 12px; cursor: zoom-in;
    transition: transform 0.25s ease;
    transform-origin: 50% 50%;
  }
  #lightbox img.zoom { cursor: zoom-out; transform: scale(2.2); }
  #lightbox-zoom-hint { color: #ccc; font-size: 0.85rem; margin-top: 8px; }
  #lightbox p { color: #fff; font-size: 1.1rem; margin-top: 16px; }
  #lightbox-cerrar {
    margin-top: 20px; background: #fff; color: #000;
    padding: 10px 24px; border-radius: 20px; border: none;
    font-size: 1rem; cursor: pointer;
  }

  /* ---------- Narración / Cierre ---------- */
  .texto-narracion { font-size: 1.05rem; line-height: 1.7; }
  .cierre-imagen { width: 100%; max-height: 140px; object-fit: cover; border-radius: 10px; margin-bottom: 10px; }
  .cierre-textos .texto-narracion { font-size: 0.92rem; line-height: 1.4; margin: 6px 0; }
  .cierre-textos .titulo-pantalla { margin-bottom: 6px; padding-bottom: 4px; font-size: 1.25rem; }
  .cierre-textos .btn-audio-narracion { margin-bottom: 8px; padding: 8px 16px; }

  /* ---------- Flipcards ---------- */
  .grid-flipcards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 14px;
    margin-top: 16px;
  }
  .flipcard { perspective: 1000px; height: 170px; cursor: pointer; }
  .flipcard-inner {
    position: relative; width: 100%; height: 100%;
    transition: transform 0.5s; transform-style: preserve-3d;
  }
  .flipcard.volteada .flipcard-inner { transform: rotateY(180deg); }
  .flipcard-frente, .flipcard-reverso {
    position: absolute; width: 100%; height: 100%;
    backface-visibility: hidden;
    border-radius: 10px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 10px; text-align: center; font-size: 0.9rem;
  }
  .flipcard-frente { background: var(--rojo); color: white; font-weight: bold; font-size: 1.1rem; }
  .flipcard-reverso { background: var(--ocre-claro); color: var(--negro); transform: rotateY(180deg); }
  .flipcard-reverso-horizontal {
    flex-direction: row;
    align-items: stretch;
    justify-content: flex-start;
    padding: 0;
    gap: 0;
  }
  .flipcard-reverso-horizontal .flipcard-reverso-img {
    width: 42%; height: 100%;
    margin-bottom: 0;
    border-radius: 10px 0 0 10px;
    object-fit: cover;
    flex-shrink: 0;
  }
  .flipcard-reverso-texto {
    padding: 10px 12px;
    font-size: 0.85rem;
    text-align: left;
    display: flex;
    align-items: center;
  }
  .flipcard-reverso-img {
    width: 56px; height: 56px; object-fit: cover;
    border-radius: 8px; margin-bottom: 6px; flex-shrink: 0;
  }

  /* ---------- Ordenar ---------- */
  .zona-elegidos, .zona-opciones-ordenar { margin-bottom: 10px; }
  .zona-elegidos {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px;
    padding: 10px; background: #faf6ec; border-radius: 8px;
    min-height: 44px;
  }
  .slot-orden {
    display: inline-flex; align-items: center; justify-content: center;
    background: #f0e6d2; border: 2px dashed #c9b489;
    border-radius: 6px; padding: 5px 9px;
    min-width: 28px;
  }
  .slot-orden.slot-lleno { border-style: solid; background: white; font-size: 1rem; }
  .slot-vacio { color: #b8a67e; font-size: 0.9rem; }
  .slot-orden.correcto { border-color: var(--verde-ok); background: #e4f3e6; }
  .slot-orden.incorrecto { border-color: var(--rojo-error); background: #f8e5e2; }

  .btn-opcion-ordenar, .btn-item-clasificar, .btn-opcion-multiple,
  .btn-palabra-banco, .btn-asociar {
    background: white;
    border: 2px solid var(--ocre);
    color: var(--negro);
    padding: 10px 14px;
    border-radius: 8px;
    margin: 4px 6px 4px 0;
    cursor: pointer;
    font-size: 0.95rem;
    display: inline-block;
  }
  .btn-opcion-ordenar:hover, .btn-item-clasificar:hover { background: var(--ocre-claro); }

  .btn-verificar {
    background: var(--verde-ok);
    color: white; border: none;
    padding: 12px 24px; border-radius: 8px;
    font-size: 1rem; cursor: pointer; margin-top: 12px;
  }
  .resultado-verificacion { margin-top: 10px; min-height: 24px; }
  .feedback-correcto { color: var(--verde-ok); font-weight: bold; }
  .feedback-incorrecto { color: var(--rojo-error); font-weight: bold; }
  .aviso-incompleto { color: var(--marron); font-style: italic; }

  /* ---------- Mapa ---------- */
  .mapa-wrap {
    position: relative;
    width: 100%;
    padding-top: 66.18%; /* proporción real 900x595.6 del mapa geográfico */
    background: #eaf2f8;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 10px;
  }
  .mapa-imagen-base {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: fill;
  }
  .mapa-svg-ruta { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  .mapa-ruta-linea { fill: none; stroke: #c0392b; stroke-width: 0.6; stroke-dasharray: 1.5,1.2; }
  .mapa-marcador {
    position: absolute;
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--rojo);
    color: white;
    border: 3px solid white;
    font-weight: bold;
    cursor: pointer;
    transform: translate(-50%, -50%);
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }
  .mapa-marcador.activo { background: var(--verde-ok); }
  .mapa-panel-info {
    margin-top: 14px; background: var(--ocre-claro);
    border-radius: 10px; padding: 14px 16px; min-height: 50px;
  }
  .mapa-panel-info h3 { margin: 0 0 6px; color: var(--rojo); }
  .mapa-panel-info p { margin: 0; }
  .mapa-placeholder { color: #777; font-style: italic; margin: 0; }
  .mapa-panel-imagen { display: block; width: 100%; max-width: 320px; margin: 10px auto 0; border-radius: 8px; }

  /* ---------- Línea de tiempo interactiva ---------- */
  .linea-tiempo-wrap { position: relative; margin-top: 18px; padding: 0 4px; }
  .linea-tiempo-linea {
    position: absolute; top: 24px; left: 24px; right: 24px; height: 4px;
    background: var(--ocre); border-radius: 2px;
  }
  .linea-tiempo-marcadores {
    position: relative; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px 0;
  }
  .linea-tiempo-marcador {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    background: none; border: none; cursor: pointer; padding: 0; width: 48px;
  }
  .linea-tiempo-icono {
    width: 48px; height: 48px; border-radius: 50%;
    background: var(--rojo); color: white;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem; border: 3px solid white;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }
  .linea-tiempo-marcador.activo .linea-tiempo-icono { background: var(--verde-ok); }
  .linea-tiempo-numero { font-size: 0.75rem; font-weight: bold; color: var(--marron); }
  .linea-tiempo-panel {
    margin-top: 16px; background: var(--ocre-claro);
    border-radius: 10px; padding: 14px 16px; min-height: 50px;
  }
  .linea-tiempo-panel h3 { margin: 0 0 6px; color: var(--rojo); }
  .linea-tiempo-panel p { margin: 0; }
  @media (max-width: 480px) {
    .linea-tiempo-linea { left: 20px; right: 20px; }
    .linea-tiempo-marcador { width: 40px; }
    .linea-tiempo-icono { width: 40px; height: 40px; font-size: 1.15rem; }
  }

  /* ---------- Clasificar ---------- */
  .zona-items-clasificar { margin-bottom: 14px; }
  .btn-item-clasificar.seleccionado { background: var(--rojo); color: white; border-color: var(--rojo); }
  .zona-categorias, .zona-2-columnas {
    display: grid; gap: 10px;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  }
  .caja-categoria {
    background: #f0e6d2; border: 2px solid var(--ocre);
    border-radius: 10px; padding: 12px; min-height: 90px; cursor: pointer;
  }
  .caja-categoria-titulo { margin: 0 0 8px; color: var(--rojo); text-align: center; }
  .caja-categoria-lista { display: flex; flex-wrap: wrap; gap: 6px; min-height: 30px; }
  .chip-asignado {
    background: white; border: 1px solid var(--marron);
    border-radius: 6px; padding: 6px 8px; font-size: 0.85rem;
  }
  .chip-asignado.correcto { background: #e4f3e6; border-color: var(--verde-ok); color: var(--negro); }

  /* ---------- V/F ---------- */
  .item-vf {
    background: #f7f0e0; border-radius: 10px; padding: 14px;
    margin-bottom: 14px;
  }
  .item-vf.item-vf-activo { animation: titilar-item-vf 0.9s ease-in-out infinite; }
  @keyframes titilar-item-vf {
    0%, 100% { box-shadow: 0 0 0 2px var(--rojo); }
    50% { box-shadow: 0 0 0 5px var(--rojo); }
  }
  .texto-afirmacion { margin: 0 0 10px; font-size: 1rem; }
  .botones-vf { display: flex; gap: 10px; }
  .btn-vf {
    flex: 1; padding: 10px; border-radius: 8px;
    border: 2px solid var(--marron); background: white; cursor: pointer;
    font-size: 0.95rem;
  }
  .btn-vf.correcto { background: var(--verde-ok); color: white; border-color: var(--verde-ok); }
  .btn-vf.incorrecto { background: var(--rojo-error); color: white; border-color: var(--rojo-error); }
  .justificacion-vf { margin-top: 10px; font-size: 0.9rem; color: var(--marron); font-style: italic; }

  /* ---------- Multiple choice ---------- */
  .bloque-pregunta { margin-bottom: 22px; }
  .texto-pregunta { font-weight: bold; margin-bottom: 10px; }
  .opciones-multiple { display: flex; flex-direction: column; gap: 8px; }
  .btn-opcion-multiple { text-align: left; width: 100%; }
  .btn-opcion-multiple.correcto { background: var(--verde-ok); color: white; border-color: var(--verde-ok); }
  .btn-opcion-multiple.incorrecto { background: var(--rojo-error); color: white; border-color: var(--rojo-error); }

  /* ---------- Completar ---------- */
  .parrafo-completar { font-size: 1.05rem; line-height: 2.2; }
  .hueco-completar {
    display: inline-block; min-width: 100px; text-align: center;
    border-bottom: 2px solid var(--rojo); padding: 2px 6px;
    cursor: pointer; font-weight: bold; color: var(--rojo);
  }
  .hueco-completar.hueco-activo { background: var(--ocre-claro); }
  .hueco-completar.hueco-lleno { color: var(--negro); }
  .hueco-completar.correcto { background: #e4f3e6; border-color: var(--verde-ok); color: var(--verde-ok); }
  .hueco-completar.incorrecto { background: #f8e5e2; border-color: var(--rojo-error); color: var(--rojo-error); }
  .banco-palabras { margin-top: 16px; }
  .btn-palabra-banco.seleccionada { background: var(--rojo); color: white; }
  .btn-palabra-banco.usada { opacity: 0.35; cursor: default; }

  /* ---------- Sopa de letras ---------- */
  .tablero-sopa-wrap {
    margin-top: 14px;
  }
  .tablero-sopa {
    display: grid; gap: 2px;
    background: var(--marron); padding: 5px; border-radius: 8px;
    width: 100%;
  }
  .celda-sopa {
    background: white; aspect-ratio: 1;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.68rem; font-weight: bold; cursor: pointer;
    user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .celda-sopa.celda-sel-temp { background: var(--ocre-claro); }
  .celda-sopa.celda-encontrada { background: var(--verde-ok); color: white; }
  .panel-definiciones { margin-top: 16px; }
  .definicion-item {
    background: #f0e6d2; border-radius: 8px; padding: 8px 12px;
    margin-bottom: 6px; font-size: 0.85rem; color: #999;
  }
  .definicion-item.encontrada { background: #e4f3e6; color: var(--negro); }

  /* ---------- Asociar ---------- */
  .fila-asociar { display: flex; gap: 10px; margin-top: 14px; align-items: flex-start; }
  .bloque-asociar { flex: 1; min-width: 0; }
  .asociar-titulo {
    color: var(--rojo); margin: 0 0 8px; font-size: 0.95rem;
    border-bottom: 2px solid var(--ocre); padding-bottom: 4px;
  }
  .columna-asociar { display: flex; flex-direction: column; }
  .btn-asociar {
    width: 100%; margin: 4px 0; text-align: left;
    font-size: 0.82rem; line-height: 1.25; padding: 8px 10px;
    white-space: normal;
  }
  .btn-asociar.seleccionado { background: var(--rojo); color: white; }
  .btn-asociar.correcto { opacity: 1; border-width: 2px; }
  .tipo-asociar .imagen-actividad { max-height: 130px; margin: 8px 0; }

  /* ---------- V/F secuencial ---------- */
  .item-vf-oculto { display: none; }

  /* ---------- Resumen de puntaje (cierre) ---------- */
  .resumen-puntaje {
    background: #f0e6d2; border: 2px solid var(--ocre);
    border-radius: 10px; padding: 12px 18px; margin: 10px 0;
    text-align: left;
  }
  .resumen-puntaje h3 { margin: 0 0 6px; color: var(--rojo); text-align: center; font-size: 1.05rem; }
  .resumen-fila { display: flex; justify-content: space-between; padding: 2px 0; font-size: 0.95rem; }
  .resumen-etiqueta { color: var(--marron); }
  .resumen-valor { font-weight: bold; }
  .resumen-valor.ok { color: var(--verde-ok); }
  .resumen-valor.mal { color: var(--rojo-error); }
  .resumen-valor.pct { color: var(--rojo); }
  .btn-jugar-de-nuevo { margin-top: 4px; margin-bottom: 10px; }

  /* ---------- Navegación inferior ---------- */
  #nav-inferior {
    display: flex; justify-content: space-between; gap: 10px;
    padding: 14px 20px; background: var(--negro);
  }
  #nav-inferior button {
    flex: 1; padding: 14px; border-radius: 8px; border: none;
    font-size: 1rem; cursor: pointer; font-weight: bold;
  }
  #btn-anterior { background: #555; color: white; }
  #btn-anterior:disabled { opacity: 0.3; cursor: default; }
  #btn-siguiente { background: var(--ocre); color: var(--negro); }
  #btn-siguiente:disabled { background: #999; color: #ddd; cursor: default; opacity: 0.6; }

  @media (max-width: 600px) {
  }

  /* ---------- Narración animada (mano señaladora) ---------- */
  .escena-animada {
    position: relative;
    margin: 10px 0;
    padding: 4px 0;
  }
  .mano-indicadora {
    position: absolute;
    font-size: 2em;
    transform: translate(-100%, -50%);
    transition: left 0.6s ease, top 0.6s ease, opacity 0.3s ease;
    pointer-events: none;
    z-index: 5;
  }
  .mano-indicadora.oculto { opacity: 0; }
  .etiqueta-paso {
    position: absolute;
    background: var(--rojo);
    color: white;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.85em;
    font-weight: bold;
    transform: translate(-50%, -100%);
    transition: left 0.6s ease, top 0.6s ease, opacity 0.3s ease;
    white-space: nowrap;
    pointer-events: none;
    z-index: 5;
  }
  .etiqueta-paso.oculto { opacity: 0; }
  .texto-narracion-animada { margin-top: 10px; }

  /* ---------- Mini noticia (maqueta para narración animada) ---------- */
  .mini-noticia {
    background: #f7f2e4;
    border: 2px solid var(--ocre);
    border-radius: 10px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .zona-noticia {
    border-radius: 6px;
    padding: 4px 7px;
    transition: background 0.3s ease, box-shadow 0.3s ease;
  }
  .zona-noticia.zona-activa {
    background: var(--ocre-claro);
    animation: titilar-zona 0.9s ease-in-out infinite;
  }
  @keyframes titilar-zona {
    0%, 100% { box-shadow: 0 0 0 2px var(--rojo); }
    50% { box-shadow: 0 0 0 5px var(--rojo); }
  }
  .zn-volanta { font-size: 0.75rem; letter-spacing: 0.05em; color: var(--marron); font-weight: bold; }
  .zn-titulo { font-size: 1.05rem; font-weight: bold; color: var(--rojo); line-height: 1.2; }
  .zn-copete { font-size: 0.85rem; line-height: 1.25; }
  .zn-foto { text-align: center; padding: 0; overflow: hidden; border-radius: 8px; }
  .zn-foto-img { display: block; width: 100%; height: 90px; object-fit: cover; border-radius: 8px; }
  .zn-epigrafe { font-size: 0.75rem; font-style: italic; color: var(--marron); }
  .zn-cuerpo { font-size: 0.8rem; color: #555; line-height: 1.25; }

  /* ---------- Zonas info (números sobre imagen real) ---------- */
  .zonas-info-centro {
    display: flex; justify-content: center;
    width: 100%; margin-top: 10px;
  }
