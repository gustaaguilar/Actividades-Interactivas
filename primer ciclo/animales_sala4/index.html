<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sombras, sonidos y comidas de los animales · QueSepanTodos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff8e6;--pri:#2b8a3e;--azul:#3b5bdb;--ok:#2f9e44;--bad:#e03131;--txt:#2b2d42;--card:#fff;--bor:#c3e6cb}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:"Andika","Comic Sans MS","Segoe UI",sans-serif;background:var(--bg);color:var(--txt);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  background-image:radial-gradient(#ffe8a8 1.5px,transparent 1.5px);background-size:22px 22px}
button{font-family:inherit;cursor:pointer;color:inherit}
#app{display:flex;flex-direction:column;height:100vh;height:var(--vh,100vh);max-width:1000px;margin:0 auto}
.barra{display:flex;align-items:center;gap:6px;padding:4px 8px}
.nav{border:0;background:#fff;border-radius:50%;width:34px;height:34px;font-size:15px;box-shadow:0 2px 4px #0002;flex:none}
.btit{flex:1;font-size:13px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bpts{font-weight:700;background:#fff;border-radius:16px;padding:3px 10px;box-shadow:0 2px 4px #0002}
#escenario{flex:1;min-height:0;display:flex;flex-direction:column;padding:2px 10px;gap:5px}
#escenario.bloq .interact{pointer-events:none}
.pie{display:flex;align-items:center;justify-content:space-between;padding:6px 10px 8px}
.prog{font-size:14px;opacity:.6}
.btnSig{border:0;border-radius:30px;background:var(--azul);color:#fff;font-size:clamp(16px,4vw,20px);font-weight:700;padding:10px 24px;transition:.2s}
.btnSig:disabled{opacity:.35;filter:grayscale(1)}
.btnSig.listo{animation:latido 1.2s infinite}
@keyframes latido{50%{transform:scale(1.07)}}
.titulo{font-size:clamp(17px,4.6vw,26px);text-align:center;color:var(--pri)}
.consigna{text-align:center;font-weight:700;font-size:clamp(14px,3.8vw,19px);opacity:.85}
.cont{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.preg{text-align:center;font-weight:700;font-size:clamp(17px,4.8vw,26px)}
.cnt{font-size:.7em;background:#fff;border-radius:10px;padding:1px 8px;vertical-align:middle;opacity:.8}
.imgbox{display:flex;align-items:center;justify-content:center;width:100%;height:100%;min-height:0}
.imgbox img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.emo{font-size:clamp(48px,16vw,110px);line-height:1}
.timg{flex:1;min-height:0}
.timg .emo{font-size:clamp(30px,10vw,72px)}
/* sombra: misma imagen, toda negra */
.sil img,.sil .emo{-webkit-filter:brightness(0);filter:brightness(0)}
.revela .sil img,.revela .sil .emo{-webkit-filter:none;filter:none;transition:filter .8s}
/* opciones */
.opciones{flex:1;min-height:0;display:grid;gap:10px;grid-template-columns:1fr 1fr;grid-auto-rows:1fr}
.opciones.c3{grid-template-columns:1fr 1fr 1fr}
.opciones.c4{grid-template-columns:1fr 1fr}
@media (orientation:landscape){.opciones.c4{grid-template-columns:repeat(4,1fr)}}
.op,.utar,.tarj{border:4px solid var(--bor);border-radius:18px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:6px;min-height:0;overflow:hidden;transition:opacity .3s,transform .2s,background .3s;box-shadow:0 3px 6px #0001;position:relative}
.op:active,.utar:active,.tarj:active{transform:scale(.95)}
.op.ok{border-color:var(--ok);background:#ebfbee;box-shadow:0 0 0 5px #b2f2bb}
.op.dim{opacity:.3}
.mal{border-color:var(--bad)!important;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.titila{animation:tit 1s infinite}
@keyframes tit{50%{box-shadow:0 0 0 6px rgba(43,138,62,.55)}}
/* explorar */
.explora{flex:1;min-height:0;display:grid;gap:8px;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr}
@media (orientation:landscape){.explora{grid-template-columns:repeat(4,1fr)}}
.tarj .tilde{position:absolute;top:4px;right:6px;font-size:18px;color:var(--ok);opacity:0;font-weight:700}
.tarj.oido .tilde{opacity:1}
.tarj.oido{border-color:#8ce99a}
.suena{animation:tit .7s infinite;border-color:var(--pri)!important}
/* unir con línea */
.unir{flex:1;min-height:0;position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(40px,1.2fr) minmax(0,1fr);gap:0 4px}
.ucol{display:grid;grid-template-rows:repeat(var(--filas,5),1fr);gap:6px;min-height:0;grid-row:1}
.ucol:first-child{grid-column:1}.ucol.der{grid-column:3}
.utar{padding:3px;aspect-ratio:auto;max-width:100%}
.utar.sel{border-color:var(--azul);animation:titA 1s infinite}
@keyframes titA{50%{box-shadow:0 0 0 6px rgba(59,91,219,.5)}}
.utar.toque{border-color:var(--azul)}
.lineas{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.traza{stroke-dasharray:600;stroke-dashoffset:600;animation:traza .6s forwards}
@keyframes traza{to{stroke-dashoffset:0}}
/* sonidos */
.sonfila{display:flex;align-items:center;justify-content:center;gap:12px}
.parlante{font-size:clamp(40px,12vw,70px);border:4px solid #ffd43b;background:#fff3bf;border-radius:50%;width:clamp(80px,22vw,120px);height:clamp(80px,22vw,120px);box-shadow:0 4px 0 #f0c419}
.parlante.suena{animation:latido .6s infinite}
.sonfila .cnt{font-size:16px}
/* comida */
.animalq{flex:1.1;min-height:0;display:flex;justify-content:center}
.animalq .timg{background:#fff;border-radius:22px;border:4px solid var(--bor);max-width:60%;padding:6px}
.comida .opciones{flex:1.2}
/* narración */
.escena{position:relative;flex:1;min-height:0;background:#fff;border-radius:20px;box-shadow:0 3px 8px #0001;padding:8px;display:flex;flex-direction:column;gap:6px}
.nfila{flex:1;min-height:0;display:grid;grid-template-columns:1fr 50px 1fr;align-items:center;border-radius:16px;padding:2px}
.nfila.titila{background:#ebfbee}
.flecha{font-size:30px;text-align:center;color:var(--pri)}
.comidaN{transition:opacity .5s,transform .5s}
.comidaN.oculto{opacity:0;transform:scale(.4)}
.mano{position:absolute;font-size:38px;opacity:0;transition:left .6s,top .6s,opacity .3s;pointer-events:none;filter:drop-shadow(0 2px 2px #0004);z-index:3}
.cap{text-align:center;font-weight:700;font-size:clamp(18px,5vw,28px);min-height:1.4em}
.cap.aparece{animation:apa .5s}
@keyframes apa{from{opacity:0;transform:translateY(8px)}}
/* video */
.vidbox{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.vidwrap{background:#000;border-radius:16px;overflow:hidden;box-shadow:0 4px 12px #0003}
.vidwrap iframe{width:100%;height:100%;border:0;display:block}
/* memojuego */
.memo{align-items:center}
.memogrid{flex:1;min-height:0;width:100%;display:grid;gap:8px;justify-content:center;align-content:center;grid-template-columns:repeat(2,1fr)}
.mcarta{position:relative;border:4px solid #4dabf7;border-radius:16px;background:#74c0fc;display:flex;align-items:center;justify-content:center;padding:4px;box-shadow:0 3px 0 #0002;overflow:hidden;min-width:0;min-height:0}
.mcarta:active{transform:scale(.95)}
.mcarta .dorso{font-size:clamp(26px,9vw,52px);opacity:.85}
.mcarta .frente{display:none;width:100%;height:100%}
.mcarta.volt{background:#fff;border-color:var(--bor)}
.mcarta.volt .dorso{display:none}
.mcarta.volt .frente{display:flex;animation:volta .25s}
.mcarta.hecha{background:#fff}
@keyframes volta{0%{transform:scale(.6)}100%{transform:scale(1)}}
/* portada y cierre */
.btnGrande{border:0;border-radius:30px;background:var(--ok);color:#fff;font-size:clamp(18px,5vw,24px);font-weight:700;padding:12px 28px;box-shadow:0 4px 0 #237032}
.portada,.cierre{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
.portada h1{font-size:clamp(22px,6.5vw,40px);color:var(--pri)}
.portada h3{font-size:clamp(16px,4.5vw,24px)}
.badge{background:#ffd43b;border-radius:14px;padding:3px 14px;font-weight:700}
.pimg,.cimg{flex:1;min-height:0;max-height:36vh}
.pimg img,.cimg img{border-radius:18px}
.pfila{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px}
.lic{font-size:11px;opacity:.6}
.firma{display:flex;align-items:center;gap:8px;text-align:left}
.foto{width:92px;height:92px;border-radius:50%;overflow:hidden;border:3px solid #fff;box-shadow:0 2px 6px #0003;cursor:zoom-in;flex:none;background:#fff}
.foto img{width:100%;height:100%;object-fit:cover;max-width:none;max-height:none}
.foto .emo{font-size:48px}
.firmatxt{display:flex;flex-direction:column;font-size:13px;line-height:1.35}
.cierre h1{font-size:clamp(24px,7vw,40px);color:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:520px}
.stats div{background:#fff;border-radius:14px;padding:6px;box-shadow:0 2px 6px #0002;display:flex;flex-direction:column;font-size:22px}
.stats b{font-size:clamp(18px,5vw,26px)}
.stats span{font-size:12px}
.lb{position:fixed;inset:0;top:0;left:0;right:0;bottom:0;background:#000d;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
.lbimg{overflow:hidden;max-width:92vw;max-height:72vh;border-radius:14px}
.lbimg img{display:block;max-width:92vw;max-height:72vh;transition:transform .3s}
.lbfrase{color:#fff;font-size:22px;text-align:center}
.lbfrase small{display:block;font-size:13px;opacity:.8;margin-top:6px}
.lbx{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;border:0;background:#fff;font-size:20px}
@media (orientation:landscape) and (max-height:500px){
  .pimg,.cimg{max-height:28vh}.foto{width:72px;height:72px}.titulo{font-size:17px}.consigna{font-size:13px}
}
</style>
</head>
<body>
<div id="app"></div>
<script src="../../recursos/enviar-tarea.js"></script>
<script src="datos.js"></script>
<script src="motor.js"></script>
</body>
</html>
