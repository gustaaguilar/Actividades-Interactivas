<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulador 3.er grado</title>
<style>
:root{--azul:#1f4e9c;--azul2:#2f6bd1;--tinta:#1d2b45;--suave:#4a5a78;--fondo:#eef4ff;--panel:#ffffff;--borde:#c9d6ef;--ok:#1f9d55;--mal:#d6453d;--amar:#ffd36b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--fondo);color:var(--tinta);font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{overflow:hidden}
#app{height:100%;max-width:880px;margin:0 auto}
.pantalla{height:100%;display:flex;flex-direction:column;padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.barra{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0 8px;border-bottom:2px solid var(--borde)}
.chip{background:var(--azul);color:#fff;border-radius:20px;padding:5px 14px;font-weight:700;font-size:15px}
.contador{font-weight:700;color:var(--azul);font-size:16px}
.link{background:none;border:none;color:var(--azul);font-weight:700;font-size:15px;cursor:pointer;padding:6px}
.btn{background:var(--azul);color:#fff;border:none;border-radius:12px;padding:12px 20px;font-size:17px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 3px 0 #163a75}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #163a75}
.btn:disabled{background:#9aaccc;box-shadow:none;cursor:not-allowed}
.btn.sec{background:#fff;color:var(--azul);border:2px solid var(--azul);box-shadow:none}
.btn.grande{font-size:20px;padding:14px 28px}
.btn.enviar{background:#1f9d55;box-shadow:0 3px 0 #146b39}
.btn.wa{background:#25d366;box-shadow:0 3px 0 #179c49}
/* portada */
.portada{align-items:center;justify-content:center;text-align:center;gap:6px}
.portada-img{width:min(420px,90%);height:30vh;display:flex;align-items:center;justify-content:center}
.pimg{max-width:100%;max-height:30vh;border-radius:18px;box-shadow:0 6px 18px rgba(31,78,156,.25)}
.portada-img .emoji-fb{font-size:16vh;line-height:1}
h1{margin:4px 0 0;font-size:clamp(26px,6vw,40px);color:var(--azul)}
.sub{margin:0;font-weight:700;font-size:18px}
.desc{margin:2px 0 8px;color:var(--suave);font-size:16px}
.portada-pie{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:center}
.firma{display:flex;align-items:center;gap:10px;text-align:left;font-size:13px;color:var(--suave)}
.firma .mail{font-size:12px}
.foto-btn{border:none;background:none;padding:0;cursor:zoom-in}
.foto,.foto.emoji-fb{width:92px;height:92px;border-radius:50%;object-fit:cover;border:3px solid var(--azul);display:flex;align-items:center;justify-content:center;font-size:48px;background:#fff}
.lightbox{position:fixed;inset:0;background:rgba(10,20,40,.92);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.lb-zona{max-width:92vw;max-height:72vh;overflow:hidden;border-radius:12px}
.lb-img{max-width:92vw;max-height:72vh;transition:transform .3s;display:block}
.lb-zona .emoji-fb{font-size:30vh}
.lb-frase{color:#fff;font-size:22px;font-weight:700}
.lb-cerrar{position:absolute;top:10px;right:12px;background:#fff;color:var(--tinta);border:none;border-radius:50%;width:42px;height:42px;font-size:22px;cursor:pointer;z-index:2}
/* materias */
.materias h2,.instr h2{text-align:center;color:var(--azul);margin:18px 0 10px}
.tarjetas{flex:1;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:center}
.tarjeta{width:min(300px,100%);min-height:30vh;background:#fff;border:3px solid var(--borde);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;padding:16px;box-shadow:0 5px 0 var(--borde)}
.tarjeta:hover{border-color:var(--azul2)}
.t-emoji{font-size:64px}.t-nom{font-size:26px;font-weight:800;color:var(--azul)}.t-det{font-size:15px;color:var(--suave)}
.instr{align-items:center;text-align:center}
.instr-emoji{font-size:13vh;margin-top:2vh}
.lista-instr{text-align:left;max-width:560px;font-size:18px;line-height:1.45;flex:1;overflow:auto}
.lista-instr li{margin-bottom:8px}
/* prueba */
.prueba .cuerpo{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:10px 0}
.consigna{margin:0;font-weight:700;color:var(--azul);font-size:17px}
.lectura{background:var(--panel);border:2px solid var(--borde);border-radius:14px;padding:12px 16px;font-size:18px;line-height:1.5}
.lectura h3{margin:4px 0 8px;color:var(--azul);font-size:21px}
.lectura p{margin:0 0 10px}
.lect-img{float:right;margin:0 0 8px 12px;width:min(40%,240px)}
.timg{width:100%;border-radius:10px;display:block}
.lect-img .emoji-fb{font-size:80px;text-align:center}
.genero{display:inline-block;background:var(--amar);border-radius:10px;padding:2px 10px;font-size:13px;font-weight:700}
.fuente{font-size:13px;color:var(--suave);font-style:italic;clear:both}
.vis{display:flex;align-items:center;justify-content:center;background:#fff;border:2px solid var(--borde);border-radius:14px;padding:8px;min-height:0}
.vis-svg{width:100%;max-width:640px;max-height:32vh;height:auto}
.decor{font-size:min(14vh,90px);line-height:1.1;letter-spacing:4px;text-align:center}
.vis-texto{gap:14px;justify-content:flex-start}
.mini{width:110px;flex:none}
.mimg{width:110px;height:82px;object-fit:cover;border-radius:10px;display:block}
.mini .emoji-fb{font-size:60px;text-align:center}
.ver-texto-zona{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.btn-texto{background:var(--amar);border:2px solid #b8860b;border-radius:12px;padding:10px 16px;font-size:18px;font-weight:800;cursor:pointer;color:var(--tinta);animation:titilaBorde 1.4s infinite}
.flecha-lbl{font-size:14px;font-weight:700;color:var(--mal)}
.preg-fila{display:flex;align-items:flex-start;gap:10px}
.preg-fila .pregunta{flex:1;min-width:0}
.btn-oir{flex:none;width:46px;height:46px;border-radius:50%;border:2px solid var(--azul);background:#fff;font-size:22px;cursor:pointer}
.btn-oir.chico{width:36px;height:36px;font-size:17px;vertical-align:middle}
.pregunta{margin:0;font-size:20px;font-weight:700;line-height:1.35}
.ops{display:flex;flex-direction:column;gap:8px}
.ops.grid2{display:grid;grid-template-columns:1fr 1fr}
.op{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--borde);border-radius:12px;padding:10px 12px;font-size:18px;text-align:left;cursor:pointer;color:var(--tinta);font-family:inherit}
.op .letra{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid var(--azul);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--azul)}
.dib .op .op-txt{display:flex;flex-direction:column;align-items:center;flex:1;min-width:0}
.op .op-txt svg{width:100%;max-width:150px;height:auto;max-height:15vh}
.op-nom{font-size:15px;font-weight:700}
.op.sel{border-color:var(--azul2);background:#e3edff}
.op.sel .letra{background:var(--azul);color:#fff}
.op.ok{border-color:var(--ok);background:#dff6e8}
.op.ok .letra{background:var(--ok);border-color:var(--ok);color:#fff}
.op.mal{border-color:var(--mal);background:#fde3e1}
.op.mal .letra{background:var(--mal);border-color:var(--mal);color:#fff}
.op.apagada{opacity:.5}
.correccion{border-radius:12px;padding:10px 14px;font-size:17px;line-height:1.4}
.c-ok{background:#dff6e8;border:2px solid var(--ok)}
.c-mal{background:#fff1d6;border:2px solid #d99a00}
.nav{display:flex;justify-content:space-between;gap:10px;padding-top:8px;flex-wrap:wrap}
/* resultados */
.resultados .cuerpo{flex:1;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:10px;text-align:center}
.resultados h2{margin:4px 0;color:var(--azul)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:560px}
.stat{background:#fff;border:2px solid var(--borde);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column}
.stat b{font-size:24px}.stat span{font-size:14px;color:var(--suave)}
.desglose{width:100%;max-width:560px;background:#fff;border:2px solid var(--borde);border-radius:14px;padding:8px 14px;text-align:left}
.desglose h3{margin:4px 0 8px;font-size:17px;color:var(--azul)}
.fila{display:grid;grid-template-columns:1fr 90px 60px;align-items:center;gap:8px;margin-bottom:6px;font-size:15px}
.f-bar{height:12px;background:#e5ebf6;border-radius:6px;overflow:hidden}.f-bar i{display:block;height:100%;background:var(--ok)}
.f-num{font-weight:700;text-align:right}
.acciones{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
/* modales */
.modal{position:fixed;inset:0;background:rgba(10,20,40,.6);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-caja{position:relative;background:#fff;border-radius:18px;padding:18px;width:min(560px,100%);max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.modal-caja.chica{font-size:18px;text-align:center}
.modal-caja h3{margin:0 40px 4px 0;color:var(--azul)}
.modal-caja label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:15px}
.modal-caja input{font-size:18px;padding:10px;border:2px solid var(--borde);border-radius:10px;font-family:inherit}
.aviso{color:var(--mal);font-weight:700;margin:0;min-height:1em}
.texto-modal .lectura{border:none;padding:0}
.tarjeta-img{width:100%;border-radius:10px;border:2px solid var(--borde)}
.tarjeta-txt{white-space:pre-wrap;font-size:15px}
.tip{font-size:14px;color:var(--suave);margin:0}
.titila{animation:titila 1.2s infinite}
@keyframes titila{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes titilaBorde{0%,100%{box-shadow:0 0 0 0 rgba(214,69,61,.0)}50%{box-shadow:0 0 0 4px rgba(214,69,61,.55)}}
@media (max-width:520px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .pregunta{font-size:18px}.op{font-size:16px;padding:8px 10px}
  .lect-img{float:none;width:100%;margin:0 0 8px}.timg{max-height:22vh;object-fit:cover}
  .lectura{font-size:17px}
  .chip{font-size:13px;padding:4px 10px}.link,.contador{font-size:14px}
}
</style>
</head>
<body>
<div id="app"></div>
<script src="datos.js"></script>
<script src="motor.js"></script>
</body>
</html>
