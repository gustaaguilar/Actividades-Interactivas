<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Detectives de las figuritas · QueSepanTodos</title>
<meta name="description" content="Matemática · 2.º grado: Detectives de las figuritas. Ficha 2, continuidad pedagógica en la modalidad no presencial, DGE Mendoza. QueSepanTodos.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --papel:#fff9ef; --tinta:#2b2118; --suave:#7a6a5a; --borde:#eadcc6;
  --rojo:#e63946; --naranja:#fb8500; --amarillo:#ffb703; --verde:#2a9d8f; --azul:#3a86ff; --violeta:#8338ec;
  --ok:#2ecc71; --mal:#e63946; --radio:18px;
}
[hidden]{display:none!important}
body:not(.revision) .nav,body:not(.revision) #navRev{display:none!important}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Baloo 2',system-ui,sans-serif;color:var(--tinta);display:flex;flex-direction:column;height:100dvh;
  background:var(--papel);
  background-image:radial-gradient(circle at 8% 12%,#ffd6a533 0 60px,transparent 61px),radial-gradient(circle at 92% 88%,#a0c4ff33 0 80px,transparent 81px),radial-gradient(circle at 90% 10%,#caffbf33 0 50px,transparent 51px);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
/* barra superior */
header{display:flex;align-items:center;gap:6px;padding:6px 8px;background:#fff;border-bottom:3px solid transparent;
  border-image:linear-gradient(90deg,var(--rojo),var(--naranja),var(--amarillo),var(--verde),var(--azul),var(--violeta)) 1;flex:0 0 auto}
#titulo{flex:1;font-weight:800;font-size:clamp(15px,4.2vw,22px);line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#prog,#puntos{font-size:13px;color:var(--suave);font-weight:700;white-space:nowrap}
.nav{border:0;background:var(--naranja);color:#fff;width:38px;height:38px;box-shadow:0 3px 0 #b35c00;border-radius:50%;font-size:20px;font-weight:800;cursor:pointer;flex:0 0 auto}
.nav:disabled{opacity:.3}
main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden}
footer{flex:0 0 auto;padding:6px 10px 10px;display:flex;justify-content:center}
body.sin-barras header,body.sin-barras footer{display:none}
#navRev{display:none;position:fixed;bottom:10px;left:10px;right:10px;justify-content:space-between;pointer-events:none;z-index:40}
body.sin-barras #navRev{display:flex}
#navRev .nav{pointer-events:auto;width:44px;height:44px;font-size:24px}
/* botones */
.btn{font-family:inherit;font-weight:800;font-size:clamp(15px,4.2vw,20px);border:0;border-radius:999px;padding:9px 20px;cursor:pointer;
  background:var(--azul);color:#fff;box-shadow:0 4px 0 #1f5fcc;transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1f5fcc}
.btn.sec{background:#fff;color:var(--tinta);box-shadow:0 4px 0 var(--borde);border:2px solid var(--borde)}
.btn.chico{font-size:14px;padding:5px 14px;background:#fff;color:var(--suave);box-shadow:none;border:2px solid var(--borde)}
.btn.grande{font-size:clamp(20px,5.5vw,28px);padding:12px 30px;background:var(--rojo);box-shadow:0 5px 0 #9d0208}
#btnSig{background:var(--verde);box-shadow:0 4px 0 #1d6f65;min-width:200px}
#btnSig:disabled{background:#c9c1b6;box-shadow:0 4px 0 #a79e92;cursor:not-allowed}
.espera{pointer-events:none}
.espera .btn,.espera .hb,.espera.btn{opacity:.55}
.enunciado{font-size:clamp(16px,4.4vw,22px);font-weight:700;text-align:center;line-height:1.2}
.cont{display:inline-block;font-size:13px;color:var(--suave);background:#f1e7d8;border-radius:99px;padding:0 8px;vertical-align:middle}
.caption{min-height:3.2em;max-width:680px;text-align:center;font-size:clamp(16px,4.4vw,22px);font-weight:600;line-height:1.25;
  background:#fff;border:3px solid var(--amarillo);border-radius:var(--radio);padding:8px 14px;display:block;width:100%}
.caption.grande{font-size:clamp(17px,4.8vw,24px)}
.entra{animation:entra .45s ease}
@keyframes entra{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
.titila{animation:titila 1.2s ease-in-out infinite}
@keyframes titila{0%,100%{box-shadow:0 0 0 0 #ffb70300;border-color:var(--amarillo)}50%{box-shadow:0 0 0 6px #ffb70355;border-color:var(--naranja)}}
.bien{border-color:var(--ok)!important;box-shadow:0 0 0 5px #2ecc7144!important}
.mal{animation:sacude .4s}
@keyframes sacude{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.neutro{border-color:#a0c4ff!important}
/* portada / cierre */
.portada,.cierre{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;width:100%;max-width:760px}
.port-area{font-weight:800;color:#fff;background:linear-gradient(90deg,var(--rojo),var(--naranja));padding:2px 14px;border-radius:99px;font-size:clamp(13px,3.6vw,17px)}
.portada h1,.cierre h1{font-size:clamp(28px,8.5vw,50px);line-height:1;font-weight:800;
  background:linear-gradient(90deg,var(--rojo),var(--naranja),var(--violeta),var(--azul));-webkit-background-clip:text;background-clip:text;color:transparent}
.port-sub{font-size:clamp(16px,4.5vw,22px);color:var(--suave);font-weight:700;margin-top:-6px}
.port-img,.cie-img{max-height:38vh;max-width:92vw;border-radius:var(--radio);border:5px solid #fff;box-shadow:0 6px 18px #0002;object-fit:cover}
.port-fila,.cie-fila{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
.port-fuente{font-size:12px;color:var(--suave)}
.profe{display:flex;align-items:center;gap:8px;text-align:left}
.profe img,.profe-emoji{width:92px;height:92px;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 3px 10px #0003;cursor:zoom-in;flex:0 0 auto}
.profe-emoji{display:flex;align-items:center;justify-content:center;font-size:46px;background:#fff}
.profe-txt{font-size:13px;font-weight:700;line-height:1.3}
.profe-txt .mail{color:var(--suave);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.stats div{background:#fff;border:3px solid var(--borde);border-radius:14px;padding:6px 4px;font-size:13px;font-weight:700;display:flex;flex-direction:column}
.stats b{font-size:clamp(20px,6vw,30px)}
/* lightbox */
#lightbox{position:fixed;inset:0;background:#000d;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:50;gap:12px;overflow:hidden}
#lightbox.ver{display:flex}
#lbImg{max-width:92vw;max-height:74vh;border-radius:14px;transition:transform .3s;cursor:zoom-in}
#lbImg.zoom{transform:scale(2.5);cursor:zoom-out}
#lbFrase{color:#fff;font-size:clamp(18px,5vw,26px);font-weight:700;z-index:2;text-shadow:0 2px 6px #000}
#lbCerrar{position:absolute;top:12px;right:14px;width:44px;height:44px;border-radius:50%;border:0;font-size:22px;background:#fff;cursor:pointer;z-index:3}
/* escenas */
.lienzo{position:relative;display:inline-block;line-height:0;border-radius:var(--radio);overflow:hidden;border:4px solid #fff;box-shadow:0 5px 16px #0002;background:#fff}
.lienzo svg.escena{width:100%;height:auto;display:block}
svg .oculto{display:none}
svg .capa{transition:opacity .5s}
svg .atenua{opacity:.18}
svg .resalta{animation:resalta 1s ease-in-out infinite}
@keyframes resalta{0%,100%{filter:none}50%{filter:drop-shadow(0 0 6px #fff) drop-shadow(0 0 10px #ffb703)}}
.mano{position:absolute;font-size:clamp(34px,9vw,52px);line-height:1;transform:translate(-30%,-8%);opacity:0;transition:left .7s ease,top .7s ease,opacity .3s;pointer-events:none;filter:drop-shadow(0 3px 3px #0006);animation:toque 1s ease-in-out infinite}
.mano.ver{opacity:1}
@keyframes toque{0%,100%{margin-top:0}50%{margin-top:8px}}
.narra,.pasos,.buscar,.cual,.clasi,.vf,.auto,.foto{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;max-height:100%}
.pas-img{max-height:36vh;max-width:92vw;border-radius:var(--radio);border:4px solid #fff;box-shadow:0 5px 16px #0002;object-fit:cover}
.puntitos{display:flex;gap:6px}
.puntitos i{width:12px;height:12px;border-radius:50%;background:#e3d6c2;transition:.3s}
.puntitos i.hecho{background:var(--verde)}
.puntitos i.on{background:var(--naranja);transform:scale(1.35)}
/* ===== numeración (cuadro, pistas, opciones, completar) ===== */
.adivina,.opcion,.completar{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;max-height:100%}
.cuadro-wrap{position:relative;width:min(94vw,calc(46vh * 10 / 6));flex:0 0 auto}
.cuadro{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:3px;background:#fff;padding:5px;border-radius:14px;box-shadow:0 5px 16px #0002;border:3px solid var(--borde)}
.celda{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(12px,min(3.6vw,4.4vh),24px);background:#fdf6ea;border:2px solid #efe2cc;border-radius:7px;transition:background .3s,transform .2s;line-height:1}
.cuadro.activo .celda{cursor:pointer}
.celda.luz{background:#ffe08a;border-color:var(--amarillo)}
.celda.titila{animation:titila 1.2s ease-in-out infinite;border-color:var(--naranja);transform:scale(1.08)}
.celda.bien{background:var(--ok);color:#fff;border-color:#1f9d55;transform:scale(1.15)}
.celda.mal-luz{background:#ffc9ce}
.col-izq{display:flex;flex-direction:column;align-items:center;gap:6px}
.masc{max-height:16vh;max-width:40vw;object-fit:contain}
.masc.grande{max-height:30vh;max-width:70vw;border-radius:var(--radio)}
.pistas{list-style:none;counter-reset:p;display:flex;flex-direction:column;gap:4px;width:100%;max-width:520px}
.pistas li{counter-increment:p;background:#fff;border:3px solid var(--borde);border-radius:12px;padding:3px 10px 3px 6px;font-weight:700;font-size:clamp(14px,min(4vw,3.2vh),22px);line-height:1.2;display:flex;gap:8px;align-items:center}
.pistas li::before{content:counter(p);background:var(--violeta);color:#fff;border-radius:50%;min-width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:15px}
.pistas li.oculta{visibility:hidden}
.pistas li.titila{border-color:var(--amarillo)}
.col-der{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;max-width:560px}
.serie{display:flex;gap:8px;justify-content:center}
.tarjeta{font-family:inherit;min-width:clamp(54px,15vw,84px);height:clamp(54px,min(15vw,11vh),84px);display:flex;align-items:center;justify-content:center;font-size:clamp(24px,min(7vw,6vh),42px);font-weight:800;background:#fff;border:4px solid var(--tinta);border-radius:14px;box-shadow:0 4px 0 #0002;color:var(--tinta);padding:0 6px}
.tarjeta.hueco{border-style:dashed;color:var(--naranja)}
.tarjeta.bien{border-color:var(--ok);color:#1f9d55}
.palabra{font-family:inherit;font-weight:800;font-size:clamp(20px,min(6vw,5vh),34px);background:#fff;border:4px solid var(--amarillo);border-radius:var(--radio);padding:6px 18px;cursor:pointer;color:var(--tinta)}
.ops{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%;max-width:420px}
.btn.op{font-size:clamp(22px,min(6.5vw,5.5vh),34px);padding:6px 10px;background:var(--azul)}
.btn.op.bien{background:var(--ok);box-shadow:0 4px 0 #1f9d55}
.tabla{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:4px;width:min(94vw,calc(30vh * var(--cols) / 3));background:#fff;padding:6px;border-radius:14px;box-shadow:0 5px 16px #0002;border:3px solid var(--borde)}
.casi{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(20px,min(6vw,5vh),36px);border-radius:10px;border:3px solid #efe2cc;background:#fdf6ea}
.casi.vacio{border-style:dashed;border-color:var(--azul);background:#eef4ff;cursor:pointer}
.casi.vacio.bien{border-style:solid;border-color:var(--ok);background:#d9f7e6;color:#1f9d55}
.tarjetas{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tarjeta.mov{cursor:pointer;border-color:var(--violeta);color:var(--violeta)}
.tarjeta.mov.sel{background:var(--violeta);color:#fff;transform:translateY(-4px);animation:titila 1.2s ease-in-out infinite}
.tarjeta.mov.usada{visibility:hidden}
/* horizontal: visual a la izquierda, pregunta a la derecha */
@media (min-aspect-ratio:5/4){
  .adivina,.opcion{flex-direction:row;justify-content:center;gap:18px}
  .adivina .cuadro-wrap{width:min(58vw,calc(64vh * 10 / 6))}
  .adivina .col-izq{max-width:36vw}
  .opcion.con-cuadro .cuadro-wrap{width:min(48vw,calc(56vh * 10 / 6))}
  .opcion .col-der{max-width:44vw}
  .masc.grande{max-height:52vh;max-width:40vw}
  .narra .cuadro-wrap{width:min(80vw,calc(56vh * 10 / 6))}
}
@media (orientation:portrait){
  .opcion.con-cuadro .cuadro-wrap{width:min(94vw,calc(30vh * 10 / 6))}
  .opcion .masc.grande{max-height:22vh}
  .adivina .masc{max-height:10vh}
  .adivina .cuadro-wrap{width:min(94vw,calc(44vh * 10 / 6))}
}
@media (max-height:560px){.btn{padding:6px 16px}.pas-img{max-height:30vh}.marco img{max-height:34vh}.foto .enunciado{font-size:15px}}
@media (min-aspect-ratio:5/4){.tabla{width:min(70vw,calc(44vh * var(--cols) / 3))}}
@media (min-aspect-ratio:5/4) and (max-height:480px){
  .narra{flex-direction:row;flex-wrap:wrap;justify-content:center;align-content:center;gap:10px}
  .narra .cuadro-wrap{width:calc(62vh * 10 / 6)}
  .narra .caption{width:34vw;min-height:0}
  .opcion.con-cuadro .cuadro-wrap{width:calc(58vh * 10 / 6)}
  .pistas li{font-size:13px;padding:1px 8px 1px 4px}
  .pistas li::before{min-width:20px;height:20px;font-size:12px}
  .btn.op{font-size:20px;padding:3px 8px}
  .ops{gap:5px}
  .portada,.cierre{gap:4px}
  .portada h1,.cierre h1{font-size:26px}
  .port-img{max-height:26vh}.cie-img{max-height:20vh}
  .profe img,.profe-emoji{width:60px;height:60px}
  .port-fuente{display:none}
  .stats div{padding:2px}
}
.afirma{background:#fff;border:4px solid var(--amarillo);border-radius:var(--radio);padding:12px 16px;font-size:clamp(18px,5vw,26px);font-weight:700;text-align:center;line-height:1.2;max-width:680px;width:100%;display:block}
.vf-bots{display:flex;gap:12px;justify-content:center}
.btn.v{background:var(--verde);box-shadow:0 4px 0 #1d6f65}
.btn.f{background:var(--rojo);box-shadow:0 4px 0 #9d0208}
/* ===== v2: visuales y mecánicas de matemática ===== */
.vis{display:flex;flex-direction:column;justify-content:center;align-items:center;max-width:94vw}
.vis .masc.grande,.pasos .masc.grande{max-height:34vh}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;margin:0 2px;font-size:.92em}
.frac span:first-child{border-bottom:2px solid currentColor;padding:0 3px 1px}
.frac span:last-child{padding-top:1px}
.fila-num{display:grid;grid-template-columns:repeat(var(--c),1fr);width:min(94vw,640px);border:3px solid var(--tinta);border-radius:8px;overflow:hidden;background:#fff}
.fc{border-right:2px solid var(--tinta);height:clamp(34px,7vh,52px);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(12px,3.4vw,20px)}
.fc:last-child{border-right:0}.fc.bien{background:#d9f7e6;color:#1f9d55;animation:entra .45s ease}.ticket.bien{border-color:var(--ok);color:#1f9d55}.recta-svg .rt.q.ok{fill:#1f9d55}.fc.luz{background:#ffe08a}.fc.vacia{background:#fdfaf3}
.personas{display:flex;gap:clamp(6px,2vw,16px);align-items:flex-end;justify-content:center}
.persona{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;border-radius:14px;border:3px solid transparent}
.persona .cara{font-size:clamp(40px,11vw,70px);line-height:1}
.persona .pn{font-weight:800;font-size:14px;color:var(--violeta)}
.ticket{background:#fff;border:3px solid var(--tinta);border-radius:6px;padding:0 8px;font-weight:800;font-size:clamp(16px,4.4vw,24px);min-width:52px;text-align:center}
.persona.dest{border-color:var(--amarillo);background:#fff8dc}
.autos{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.auto-c{display:flex;flex-direction:column;align-items:center;background:#fff;border:3px solid var(--borde);border-radius:14px;padding:4px 8px}
.auto-svg{width:clamp(80px,24vw,130px);height:auto}
.cont-v{font-size:clamp(22px,6vw,34px);font-weight:800;font-family:'Courier New',monospace;background:#1b1b1b;color:#ffd166;border-radius:6px;padding:0 10px;letter-spacing:2px}
.recta-wrap{width:min(96vw,760px);background:#fff;border-radius:14px;border:3px solid var(--borde);padding:4px 2px}
.recta-svg{width:100%;height:auto;display:block}
.recta-svg .rt{font:800 23px 'Baloo 2',sans-serif;fill:#3b2a6b}.recta-svg .rt.q{fill:#e63946;font-size:20px}.recta-svg .rt.x{fill:#e63946;font-size:22px}.recta-svg .rt.nm{font-size:15px}
.recta-wrap.tocable svg{cursor:pointer}
.fr-wrap{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap}
.fr-circ{width:clamp(110px,min(34vw,30vh),200px);height:auto}
.fr-grid{display:grid;grid-template-columns:repeat(var(--c),1fr);gap:0;border:3px solid #1b1b1b;width:clamp(90px,min(28vw,24vh),150px)}
.fr-grid i{aspect-ratio:1/1;border:1.5px solid #1b1b1b;background:#fff}.fr-grid i.p{background:#22c55e}
.fr-wrap.barras .barra{font-size:clamp(34px,9vw,56px);line-height:1}
.fr-nota{width:100%;text-align:center;font-weight:800;font-size:clamp(15px,4vw,20px)}
.tabla-datos{border-collapse:collapse;background:#fff;font-size:clamp(13px,min(3.6vw,3.2vh),19px);font-weight:700;box-shadow:0 5px 16px #0002;border-radius:10px;overflow:hidden}
.tabla-datos th{background:var(--verde);color:#fff;padding:4px 10px}.tabla-datos td{padding:3px 10px;border-top:1px solid var(--borde)}
.tabla-datos td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.tabla-datos.pos td{text-align:center;font-size:1.4em}.tabla-datos td.luz{background:#ffe08a}
.fuente-t{font-size:11px;color:var(--suave);margin-top:3px;max-width:420px;text-align:center}
.v-tabla{flex-direction:column}
.puntajes{display:flex;flex-direction:column;align-items:center;gap:6px}
.pt-val{font-weight:800;font-size:clamp(13px,3.6vw,17px);text-align:center}
.pt-fila{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pt-caja{background:#fff;border:3px solid var(--rojo);border-radius:14px;padding:4px 10px;font-weight:700;font-size:clamp(12px,3.4vw,16px);line-height:1.25}
.pt-nom{color:var(--rojo);font-weight:800;text-align:right;font-style:italic}
.vis-texto{background:#fff;border:3px solid var(--borde);border-radius:var(--radio);padding:10px 18px;font-size:clamp(20px,min(6vw,5vh),34px);font-weight:700;text-align:center;max-width:600px;line-height:1.3}
.preg-txt{max-width:560px}
.ops.una-col{grid-template-columns:1fr;max-width:560px}
.ops.una-col .btn.op{font-size:clamp(14px,min(3.8vw,3vh),19px);text-align:left;padding:6px 14px;border-radius:14px}
.btn.op.sel{background:var(--violeta);box-shadow:0 4px 0 #5a189a}
.btn.verif{background:var(--naranja);box-shadow:0 4px 0 #b35c00}
.vf{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;max-height:100%}
.asociar{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.as-cab{display:grid;grid-template-columns:1fr 1fr;width:min(94vw,520px);text-align:center;font-weight:800;color:var(--suave)}
