<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Campo y ciudad · QueSepanTodos</title>
<meta name="description" content="Ambiente, Cultura y Tecnología 2.º grado: campo y ciudad. Paquete interactivo de QueSepanTodos.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --cielo:#e8f6ff; --pasto:#6ab04c; --pasto-o:#3d7a26; --tierra:#c98b4f; --ciudad:#5b6c8f; --ciudad-o:#38466a;
  --amarillo:#ffc93c; --naranja:#f58b3a; --rojo:#e5534b; --tinta:#2b2b2b; --suave:#6b6b6b; --borde:#d9e3ea;
  --ok:#27ae60; --okf:#d4f5df; --mal:#e5534b; --malf:#ffd9d6; --radio:18px;
}
[hidden]{display:none!important}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Baloo 2',system-ui,sans-serif;color:var(--tinta);display:flex;flex-direction:column;height:100dvh;
  background:linear-gradient(180deg,var(--cielo) 0%,#f7fbff 60%,#eef7e6 100%);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
/* barra superior: mitad campo, mitad ciudad */
header{display:flex;align-items:center;gap:6px;padding:6px 8px;flex:0 0 auto;color:#fff;
  background:linear-gradient(90deg,var(--pasto-o) 0%,var(--pasto) 45%,var(--ciudad) 55%,var(--ciudad-o) 100%)}
#titulo{flex:1;font-weight:800;font-size:clamp(15px,4.2vw,22px);line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #0005}
#marcador{display:flex;gap:8px;font-weight:700;font-size:clamp(12px,3.2vw,16px);white-space:nowrap}
.nav{border:0;background:#fff;color:var(--ciudad-o);width:36px;height:36px;border-radius:50%;font-size:20px;font-weight:800;cursor:pointer;flex:0 0 auto;box-shadow:0 2px 0 #0003}
.nav:disabled{opacity:.35}
body:not(.revision) .nav{display:none}
#libro{position:relative;border:0;background:#8e44ad;color:#fff;width:40px;height:40px;border-radius:12px;font-size:22px;cursor:pointer;flex:0 0 auto;box-shadow:0 3px 0 #5e2d73}
#libroAviso{position:fixed;z-index:30;background:#fff;color:#5e2d73;border:3px solid #8e44ad;border-radius:12px;padding:2px 10px;font-weight:800;font-size:clamp(13px,3.5vw,16px);white-space:nowrap;pointer-events:none;animation:flota 1.2s ease-in-out infinite;box-shadow:0 3px 8px #0003}
#libroAviso:before{content:'';position:absolute;top:-11px;right:14px;border:8px solid transparent;border-bottom-color:#8e44ad;border-top:0}
@keyframes flota{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px 10px;overflow:hidden}
footer{flex:0 0 auto;padding:4px 10px 10px;display:flex;justify-content:center;gap:10px}
/* botones */
.btn{font-family:inherit;font-weight:800;font-size:clamp(15px,4.2vw,20px);border:0;border-radius:999px;padding:9px 22px;cursor:pointer;
  background:var(--pasto);color:#fff;box-shadow:0 4px 0 var(--pasto-o);transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pasto-o)}
.btn:disabled{background:#c4c4c4;box-shadow:0 4px 0 #9a9a9a;cursor:not-allowed}
.btn.grande{font-size:clamp(20px,5.5vw,28px);padding:12px 30px;background:var(--naranja);box-shadow:0 5px 0 #b35c1e}
.btn.sec{background:#fff;color:var(--tinta);border:3px solid var(--borde);box-shadow:0 3px 0 var(--borde)}
#btnSig{min-width:190px}
.bloq{pointer-events:none}
.bloq .op,.bloq .carta,.bloq .tarjeta,.bloq .cat,.bloq .palabra,.bloq .celda,.bloq .opg{opacity:.75}
/* comunes */
.col{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;max-width:820px;max-height:100%}
.enunciado{font-size:clamp(16px,4.4vw,23px);font-weight:700;text-align:center;line-height:1.2;background:#fffffff0;border-radius:14px;padding:6px 14px;max-width:100%}
.foto{max-height:30vh;max-width:90vw;border-radius:var(--radio);border:4px solid #fff;box-shadow:0 5px 16px #0002;object-fit:cover;display:block}
.puntitos{display:flex;gap:6px;justify-content:center}
.puntitos i{width:11px;height:11px;border-radius:50%;background:#d5dde3;transition:.3s}
.puntitos i.hecho{background:var(--ok)}
.puntitos i.on{background:var(--naranja);transform:scale(1.35)}
.titila{animation:titila 1.1s ease-in-out infinite}
@keyframes titila{0%,100%{box-shadow:0 0 0 0 #ffc93c00}50%{box-shadow:0 0 0 7px #ffc93c88}}
.sacude{animation:sacude .4s}
@keyframes sacude{0%,100%{transform:none}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.entra{animation:entra .4s ease}
@keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* portada / cierre */
.portada h1,.cierre h1{font-size:clamp(32px,9vw,56px);line-height:1;font-weight:800;color:var(--pasto-o);text-shadow:0 3px 0 #fff}
.portada h1 span,.cierre h1 span{color:var(--ciudad-o)}
.chip{font-weight:800;color:#fff;background:linear-gradient(90deg,var(--pasto),var(--ciudad));padding:2px 14px;border-radius:99px;font-size:clamp(12px,3.4vw,16px)}
.sub{font-size:clamp(16px,4.5vw,22px);color:var(--suave);font-weight:700;margin-top:-6px}
.port-img{max-height:40vh}
.fila{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.profe{display:flex;align-items:center;gap:8px;text-align:left}
.profe img{width:92px;height:92px;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 3px 10px #0003;cursor:zoom-in;flex:0 0 auto}
.profe div{font-size:13px;font-weight:700;line-height:1.3}
.profe small{color:var(--suave);font-weight:600;font-size:12.5px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:520px}
.stats div{background:#fff;border:3px solid var(--borde);border-radius:14px;padding:6px 4px;font-size:13px;font-weight:700;display:flex;flex-direction:column;align-items:center}
.stats b{font-size:clamp(20px,6vw,30px)}
.yt{display:inline-flex;align-items:center;gap:6px;text-decoration:none;background:#ff0000;color:#fff;font-weight:800;border-radius:999px;padding:6px 14px;font-size:clamp(13px,3.6vw,16px);box-shadow:0 3px 0 #a00}
/* lightbox */
#lightbox{position:fixed;inset:0;background:#000d;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:60;gap:12px;overflow:hidden}
#lightbox.ver{display:flex}
#lbImg{max-width:92vw;max-height:72vh;border-radius:14px;transition:transform .3s;cursor:zoom-in}
#lbFrase{color:#fff;font-size:clamp(18px,5vw,26px);font-weight:700;text-shadow:0 2px 6px #000}
.cerrarX{position:absolute;top:12px;right:14px;width:44px;height:44px;border-radius:50%;border:0;font-size:22px;background:#fff;cursor:pointer;z-index:3}
/* modal del cuento */
#modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:50;padding:12px}
#modal.ver{display:flex}
#modal .hoja{background:#fffdf6;border-radius:18px;max-width:640px;width:100%;max-height:92vh;overflow:auto;padding:18px 16px 16px;position:relative;box-shadow:0 10px 30px #0006;-webkit-user-select:text;user-select:text}
#modal h2{color:var(--pasto-o);font-size:clamp(20px,5.5vw,28px);text-align:center;margin-bottom:6px;padding:0 40px}
#modal p{font-size:clamp(16px,4.4vw,21px);line-height:1.35;margin:6px 0}
#modal img{width:100%;max-height:28vh;object-fit:cover;border-radius:12px;margin:6px 0}
#modal .ens{background:#fff3cd;border-left:6px solid var(--amarillo);padding:6px 10px;border-radius:8px;font-weight:700}
/* lectura */
.lect-img{max-height:36vh}
.parrafo{background:#fff;border:4px solid var(--amarillo);border-radius:var(--radio);padding:10px 16px;font-size:clamp(17px,4.8vw,25px);font-weight:600;line-height:1.35;text-align:center;max-width:720px;width:100%;min-height:4.2em;display:block}
.parrafo.leyendo{background:#fffbe6}
.parrafo mark{background:#ffe27a;border-radius:6px;padding:0 3px;color:inherit;transition:background .2s}
.parrafo .w{transition:background .15s;border-radius:6px;padding:0 1px}
/* opciones */
.ops{display:grid;gap:8px;width:100%;max-width:620px}
.ops.g2{grid-template-columns:1fr 1fr}
.op{font-family:inherit;font-weight:700;font-size:clamp(15px,4.2vw,20px);padding:9px 12px;border-radius:14px;border:3px solid var(--borde);background:#fff;cursor:pointer;color:var(--tinta);line-height:1.15;transition:opacity .3s}
.op.bien{border-color:var(--ok);background:var(--okf);opacity:1!important}
.op.mal{border-color:var(--mal);background:var(--malf)}
.op.apagada{opacity:.35}
.trivia-img{max-height:26vh}
/* ordenar escenas */
.escenas{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:min(94vw,calc(58vh*1.333))}
.carta{position:relative;border:4px solid #fff;border-radius:14px;overflow:hidden;cursor:pointer;background:#fff;box-shadow:0 4px 12px #0002;line-height:0;padding:0;font-family:inherit}
.carta img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.carta .num{position:absolute;top:6px;left:6px;width:38px;height:38px;border-radius:50%;background:var(--ok);color:#fff;font-weight:800;font-size:22px;line-height:38px;text-align:center;display:none;box-shadow:0 2px 6px #0005}
.carta.bien{border-color:var(--ok)}
.carta.bien .num{display:block}
.carta.mal{border-color:var(--mal)}
.carta .cap{position:absolute;left:0;right:0;bottom:0;background:#000a;color:#fff;font-size:clamp(12px,3.2vw,15px);font-weight:700;line-height:1.2;padding:3px 6px;display:none}
.carta.bien .cap{display:block}
/* armar oración */
.armado{min-height:3.2em;width:100%;max-width:700px;background:#fff;border:4px dashed var(--borde);border-radius:var(--radio);padding:8px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;font-size:clamp(18px,5vw,26px);font-weight:700}
.armado.lista{border-style:solid;border-color:var(--ok);background:var(--okf)}
.banco{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:700px}
.palabra{font-family:inherit;font-weight:700;font-size:clamp(18px,5vw,25px);padding:4px 14px;border-radius:12px;border:3px solid #9fc5e8;background:#eef6ff;cursor:pointer;color:var(--tinta)}
.palabra.usada{visibility:hidden}
.ok-palabra{color:var(--pasto-o)}
/* dos opciones */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:560px}
.opg{font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;border-radius:16px;border:4px solid var(--borde);background:#fff;cursor:pointer;font-weight:800;font-size:clamp(18px,5vw,24px);color:var(--tinta);transition:opacity .3s}
.opg img{width:100%;max-height:18vh;object-fit:cover;border-radius:10px}
.opg small{font-size:clamp(12px,3.4vw,15px);color:var(--suave);font-weight:700}
.opg.campo{border-color:#a8d58f;background:#f1fbe9}
.opg.ciudad{border-color:#aab6d3;background:#eef1fa}
.opg.bien{border-color:var(--ok)!important;background:var(--okf)!important;opacity:1!important}
.opg.mal{border-color:var(--mal)!important;background:var(--malf)!important}
.opg.apagada{opacity:.35}
.item-frase{font-size:clamp(19px,5.4vw,28px);font-weight:800;text-align:center;background:#fff;border:4px solid var(--amarillo);border-radius:var(--radio);padding:8px 16px;max-width:680px;width:100%;line-height:1.2}
.item-img{max-height:32vh}
.conf{font-size:clamp(14px,3.8vw,18px);font-weight:700;color:var(--pasto-o);text-align:center;min-height:1.3em;max-width:680px}
/* narración */
.escena{position:relative;display:inline-block;line-height:0}
.escena img{max-height:46vh;max-width:94vw;border-radius:var(--radio);border:4px solid #fff;box-shadow:0 5px 16px #0002;display:block;transition:opacity .4s}
.mano{position:absolute;font-size:clamp(34px,9vw,50px);line-height:1;transform:translate(-20%,-10%);transition:left .7s ease,top .7s ease,opacity .3s;opacity:0;pointer-events:none;filter:drop-shadow(0 3px 3px #0006);animation:toque 1s ease-in-out infinite}
.mano.ver{opacity:1}
@keyframes toque{0%,100%{margin-top:0}50%{margin-top:8px}}
.etiq{position:absolute;transform:translate(-50%,-135%);background:#fff;border:3px solid var(--amarillo);border-radius:12px;padding:3px 10px;font-weight:800;font-size:clamp(13px,3.6vw,18px);white-space:nowrap;line-height:1.3;opacity:0;transition:opacity .3s,left .7s,top .7s;animation:titila 1.1s infinite}
.etiq.ver{opacity:1}
.caption{min-height:3em;max-width:720px;width:100%;text-align:center;font-size:clamp(16px,4.4vw,22px);font-weight:600;line-height:1.25;background:#fff;border:3px solid var(--amarillo);border-radius:var(--radio);padding:8px 14px}
/* clasificar */
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:640px}
.cat{font-family:inherit;border:4px dashed;border-radius:16px;padding:6px;min-height:22vh;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;background:#fff}
.cat.campo{border-color:var(--pasto);background:#f1fbe9}
.cat.ciudad{border-color:var(--ciudad);background:#eef1fa}
.cat img{width:100%;max-height:10vh;object-fit:cover;border-radius:10px}
.cat b{font-size:clamp(17px,4.6vw,22px)}
.cat .dentro{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.cat.lista-para{animation:titila 1.1s infinite}
.bandeja{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:640px;min-height:48px}
.tarjeta{font-family:inherit;display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:12px;border:3px solid var(--borde);background:#fff;font-weight:700;font-size:clamp(14px,3.8vw,18px);cursor:pointer;color:var(--tinta)}
.tarjeta .e{font-size:1.4em}
.tarjeta.sel{border-color:#2d8cf0;background:#e3f0ff;transform:scale(1.06)}
.tarjeta.bien{border-color:var(--ok);background:var(--okf);cursor:default;font-size:clamp(12px,3.2vw,15px);padding:2px 6px}
.tarjeta.mal{border-color:var(--mal);background:var(--malf);cursor:default;font-size:clamp(12px,3.2vw,15px);padding:2px 6px}
/* multi */
.multi-img{max-height:24vh}
/* opinión */
.ens{background:#fff3cd;border:3px solid var(--amarillo);border-radius:14px;padding:8px 14px;font-weight:700;font-size:clamp(16px,4.4vw,21px);text-align:center;max-width:680px}
/* sopa */
.sopa-wrap{display:flex;gap:10px;align-items:center;justify-content:center;width:100%;flex-wrap:wrap}
.grilla{display:grid;gap:2px;background:#fff;border:4px solid var(--ciudad);border-radius:14px;padding:4px;width:min(94vw,52vh);touch-action:none}
.celda{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(16px,4.6vw,26px);border-radius:6px;background:#f3f6fb;cursor:pointer;color:var(--ciudad-o)}
.celda.ini{background:#ffe27a}
.celda.hall{color:#fff}
.lista-sopa{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:300px}
.lista-sopa span{background:#fff;border:3px solid var(--borde);border-radius:10px;padding:2px 10px;font-weight:800;font-size:clamp(15px,4vw,19px)}
.lista-sopa span.ok{text-decoration:line-through;border-color:var(--ok);background:var(--okf);color:var(--pasto-o)}
.sopa-mini{max-height:14vh;border-radius:12px}
/* dos columnas (imagen | actividad) en pantallas apaisadas: netbooks y tablets acostadas */
.panel{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
@media (orientation:portrait){.foto.trivia-img,.foto.item-img,.foto.multi-img{max-height:30vh}.foto.lect-img{max-height:38vh}}
@media (min-aspect-ratio:5/4){
  .dosCol{flex-direction:row;justify-content:center;gap:18px;max-width:1100px}
  .dosCol>.foto{max-height:70vh!important;max-width:46vw;flex:0 1 auto;min-width:0}
  .dosCol>.panel{flex:1 1 0;max-width:540px;min-width:0}
  .escena img{max-height:58vh}
  .port-img{max-height:44vh}
  .grilla{width:min(60vw,68vh)}
}
@media (min-aspect-ratio:5/4) and (max-height:620px){.escenas{width:min(70vw,calc(60vh*1.333))}}
@media (orientation:portrait){.duo .opg img{max-height:14vh}}
</style>
</head>
<body>
<header>
  <button class="nav" id="navPrev" aria-label="Pantalla anterior">‹</button>
  <div id="titulo"></div>
  <button id="libro" hidden aria-label="Leer el cuento">📖</button>
  <div id="marcador"><span id="mAc">✅ 0</span><span id="mEr">❌ 0</span><span id="mPt">⭐ 0</span></div>
  <button class="nav" id="navNext" aria-label="Pantalla siguiente">›</button>
</header>
<main id="pantalla"></main>
<footer id="pie"><button class="btn" id="btnSig" disabled>Siguiente ➜</button></footer>
<div id="libroAviso" hidden>Tocá para leer el cuento 👆</div>
<div id="modal"><div class="hoja"><button class="cerrarX" id="modalCerrar" aria-label="Cerrar">✕</button><div id="modalCuerpo"></div></div></div>
<div id="lightbox"><button class="cerrarX" id="lbCerrar" aria-label="Cerrar">✕</button><img id="lbImg" alt="Profe Gustavo Aguilar"><div id="lbFrase"></div></div>
<script src="../../recursos/enviar-tarea.js"></script>
<script src="datos.js"></script>
<script src="motor.js"></script>
</body>
</html>
