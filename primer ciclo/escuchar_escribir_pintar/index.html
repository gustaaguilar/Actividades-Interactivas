<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escuchar, escribir y pintar — Primer ciclo, Alfabetización inicial</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --ocre: #c98a3b;
    --ocre-claro: #e8c789;
    --rojo: #7a2418;
    --negro: #201510;
    --marron: #4a3222;
    --verde-ok: #3f7d4a;
    --rojo-error: #a13a2e;
    --fondo: #f3ead9;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Georgia', 'Times New Roman', serif;
    background: var(--fondo);
    color: var(--negro);
  }

  #app {
    max-width: 900px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: #fffdf8;
    box-shadow: 0 0 30px rgba(0,0,0,0.15);
  }

  /* ---------- Barra de progreso ---------- */
  #barra-progreso-wrap {
    background: var(--negro);
    padding: 8px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  #barra-progreso-fondo {
    flex: 1;
    height: 8px;
    background: rgba(255,255,255,0.2);
    border-radius: 4px;
    overflow: hidden;
  }
  #barra-progreso-interna {
    height: 100%;
    background: var(--ocre);
    width: 5%;
    transition: width 0.3s ease;
  }
  #texto-progreso {
    color: var(--ocre-claro);
    font-size: 0.8rem;
    white-space: nowrap;
  }

  /* ---------- Contenedor de pantalla ---------- */
  #pantalla-contenedor {
    flex: 1;
    padding: 24px 20px 40px;
  }

  .titulo-pantalla {
    color: var(--rojo);
    font-size: 1.5rem;
    margin: 0 0 12px;
    border-bottom: 3px solid var(--ocre);
    padding-bottom: 8px;
  }

  .cabecera-pantalla { margin-bottom: 20px; }

  .fila-consigna {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--ocre-claro);
    padding: 12px 14px;
    border-radius: 10px;
  }
  .texto-consigna { margin: 0; flex: 1; font-size: 1rem; }

  .btn-audio-consigna {
    background: var(--rojo);
    color: white;
    border: none;
    border-radius: 50%;
    width: 44px;
    height: 44px;
    font-size: 1.2rem;
    cursor: pointer;
    flex-shrink: 0;
  }
  .btn-audio-narracion {
    border-radius: 24px;
    width: auto;
    padding: 10px 20px;
    margin-bottom: 16px;
  }

  .imagen-actividad {
    width: 100%;
    max-height: 320px;
    object-fit: cover;
    border-radius: 10px;
    margin: 16px 0;
    display: block;
  }

  .subtitulo-zona {
    font-weight: bold;
    color: var(--marron);
    margin: 18px 0 8px;
  }

  /* ---------- Portada ---------- */
  .portada-wrap { display: flex; flex-direction: column; }
  .portada-imagen { width: 100%; border-radius: 0; display: block; }
  .portada-textos { text-align: center; padding: 24px 16px; }
  .portada-titulo { color: var(--rojo); font-size: 2rem; margin: 0 0 8px; }
  .portada-subtitulo { color: var(--marron); font-size: 1rem; margin: 0 0 4px; }
  .portada-nivel { color: #888; font-size: 0.85rem; margin: 0 0 20px; }
  .btn-comenzar {
    background: var(--rojo);
    color: white;
    border: none;
    padding: 14px 40px;
    font-size: 1.1rem;
    border-radius: 30px;
    cursor: pointer;
  }
  .btn-comenzar:hover { background: var(--ocre); }

  .fila-comenzar {
    display: flex; align-items: center; justify-content: center;
    gap: 16px; flex-wrap: wrap; margin-top: 8px;
  }
  .foto-thumb {
    width: 92px; height: 92px; border-radius: 50%;
    object-fit: cover; border: 3px solid var(--rojo);
    cursor: pointer;
  }
  .firma { font-size: 0.85rem; color: #777; margin-top: 10px; text-align: center; }
  .mail-contacto { font-size: 0.8rem; color: #888; margin-top: 2px; text-align: center; }

  /* ---------- Lightbox ---------- */
  #lightbox {
    display: none; position: fixed; top: 0; left: 0;
    width: 100%; height: 100%; background: rgba(0,0,0,0.85);
    z-index: 999; align-items: center; justify-content: center;
    flex-direction: column;
  }
  #lightbox.activo { display: flex; }
  #lightbox-img-wrap {
    max-width: 85%; max-height: 60%;
    overflow: auto; border-radius: 12px;
    -webkit-overflow-scrolling: touch;
  }
  #lightbox-img-wrap::-webkit-scrollbar { display: none; }
  #lightbox img {
    display: block; max-width: 100%; height: auto;
    border-radius: 12px; cursor: zoom-in;
    transition: transform 0.25s ease;
    transform-origin: 50% 50%;
  }
  #lightbox img.zoom { cursor: zoom-out; transform: scale(2.2); }
  #lightbox-zoom-hint { color: #ccc; font-size: 0.85rem; margin-top: 8px; }
  #lightbox p { color: #fff; font-size: 1.1rem; margin-top: 16px; }
  #lightbox-cerrar {
    margin-top: 20px; background: #fff; color: #000;
    padding: 10px 24px; border-radius: 20px; border: none;
    font-size: 1rem; cursor: pointer;
  }

  /* ---------- Narración / Cierre ---------- */
  .texto-narracion { font-size: 1.05rem; line-height: 1.7; }
  .cierre-imagen { width: 100%; max-height: 140px; object-fit: cover; border-radius: 10px; margin-bottom: 10px; }
  .cierre-textos .texto-narracion { font-size: 0.92rem; line-height: 1.4; margin: 6px 0; }
  .cierre-textos .titulo-pantalla { margin-bottom: 6px; padding-bottom: 4px; font-size: 1.25rem; }
  .cierre-textos .btn-audio-narracion { margin-bottom: 8px; padding: 8px 16px; }

  /* Imagen que representa la oración del dictado, recién visible al
     terminar de armarla y escucharla completa (premio final, no
     pista previa). */
  .dictado-imagen-wrap { margin-top: 6px; }

  /* ---------- Ordenar / Dictado ---------- */
  .zona-elegidos, .zona-opciones-ordenar { margin-bottom: 10px; }
  .zona-elegidos {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px;
    padding: 10px; background: #faf6ec; border-radius: 8px;
    min-height: 44px;
  }
  .slot-orden {
    display: inline-flex; align-items: center; justify-content: center;
    background: #f0e6d2; border: 2px dashed #c9b489;
    border-radius: 6px; padding: 5px 9px;
    min-width: 28px;
  }
  .slot-orden.slot-lleno { border-style: solid; background: white; font-size: 1rem; }
  .slot-vacio { color: #b8a67e; font-size: 0.9rem; }
  .slot-orden.correcto { border-color: var(--verde-ok); background: #e4f3e6; }
  .slot-orden.incorrecto { border-color: var(--rojo-error); background: #f8e5e2; }

  .btn-opcion-ordenar, .btn-item-clasificar, .btn-opcion-multiple,
  .btn-palabra-banco, .btn-asociar {
    background: white;
    border: 2px solid var(--ocre);
    color: var(--negro);
    padding: 10px 14px;
    border-radius: 8px;
    margin: 4px 6px 4px 0;
    cursor: pointer;
    font-size: 0.95rem;
    display: inline-block;
  }
  .btn-opcion-ordenar:hover, .btn-item-clasificar:hover { background: var(--ocre-claro); }

  .btn-verificar {
    background: var(--verde-ok);
    color: white; border: none;
    padding: 12px 24px; border-radius: 8px;
    font-size: 1rem; cursor: pointer; margin-top: 12px;
  }
  .resultado-verificacion { margin-top: 10px; min-height: 24px; }
  .feedback-correcto { color: var(--verde-ok); font-weight: bold; }
  .feedback-incorrecto { color: var(--rojo-error); font-weight: bold; }
  .aviso-incompleto { color: var(--marron); font-style: italic; }

  /* Historial de la oración (crece de a una palabra) — usado por
     "ordenar" y "dictado" */
  .historial-oracion {
    background: #faf6ec; border: 1px dashed #c9b489;
    border-radius: 8px; padding: 8px 12px; margin-top: 4px;
  }
  .historial-linea {
    font-size: 0.9rem; color: var(--marron);
    padding: 3px 0; border-bottom: 1px dotted #e0d3b0;
  }
  .historial-linea:last-child { border-bottom: none; color: var(--negro); font-weight: bold; }
  .fila-dictado-actual { margin-bottom: 10px; }

  /* ---------- Resumen de puntaje (cierre) ---------- */
  .resumen-puntaje {
    background: #f0e6d2; border: 2px solid var(--ocre);
    border-radius: 10px; padding: 12px 18px; margin: 10px 0;
    text-align: left;
  }
  .resumen-puntaje h3 { margin: 0 0 6px; color: var(--rojo); text-align: center; font-size: 1.05rem; }
  .resumen-fila { display: flex; justify-content: space-between; align-items: baseline; padding: 5px 0; font-size: 1.05rem; }
  .resumen-etiqueta { color: var(--marron); }
  .resumen-valor { font-weight: bold; font-size: 1.6rem; }
  .resumen-valor.ok { color: var(--verde-ok); }
  .resumen-valor.mal { color: var(--rojo-error); }
  .resumen-valor.pct { color: var(--rojo); }
  .btn-jugar-de-nuevo { margin-top: 4px; margin-bottom: 10px; }

  /* ---------- Navegación inferior ---------- */
  #nav-inferior {
    display: flex; justify-content: space-between; gap: 10px;
    padding: 14px 20px; background: var(--negro);
  }
  #nav-inferior button {
    flex: 1; padding: 14px; border-radius: 8px; border: none;
    font-size: 1rem; cursor: pointer; font-weight: bold;
  }
  #btn-anterior { background: #555; color: white; }
  #btn-anterior:disabled { opacity: 0.3; cursor: default; }
  #btn-siguiente { background: var(--ocre); color: var(--negro); }
  #btn-siguiente:disabled { background: #999; color: #ddd; cursor: default; opacity: 0.6; }

  /* ============================================================
     TIPOS NUEVOS DE ESTE PAQUETE
     ============================================================ */

  /* ---------- Pintar (escuchar y pintar del color correcto) ---------- */
  /* En pantallas angostas (celular) se apila todo en una columna,
     igual que antes. En pantallas más anchas (notebook) la paleta de
     colores pasa a un costado de la oración, para aprovechar el
     espacio y evitar el scroll vertical. */
  .pintar-layout { display: flex; flex-direction: column; gap: 4px; }
  .pintar-col-principal { min-width: 0; }
  .pintar-col-paleta { min-width: 0; }
  @media (min-width: 720px) {
    .pintar-layout { flex-direction: row; align-items: flex-start; gap: 24px; }
    .pintar-col-principal { flex: 1 1 58%; }
    .pintar-col-paleta {
      flex: 1 1 38%; position: sticky; top: 12px;
      background: #faf6ec; border: 2px solid var(--ocre-claro);
      border-radius: 12px; padding: 14px;
    }
  }
  .pintar-imagen-wrap { display: flex; justify-content: center; }
  .imagen-pintar {
    max-width: 320px; width: 100%; max-height: 280px;
    object-fit: contain; background: white;
    border: 2px solid var(--ocre-claro);
  }
  .paleta-colores { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; }
  .swatch-color {
    width: 56px; height: 56px; border-radius: 50%;
    border: 3px solid white; box-shadow: 0 0 0 2px var(--marron);
    cursor: pointer;
  }
  .swatch-color.correcto { box-shadow: 0 0 0 4px var(--verde-ok); }
  .swatch-color.incorrecto { animation: sacudir-swatch 0.4s ease; }
  @keyframes sacudir-swatch {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
  .btn-opcion-ordenar.incorrecto { animation: sacudir-swatch 0.4s ease; border-color: var(--rojo-error); background: #f8e5e2; }

  /* ---------- Sopa de letras ---------- */
  /* Grilla 10×10 (antes 14×14): celdas más grandes, letras más
     nítidas, aprovechando el espacio de cada celda. En pantallas
     anchas (notebook) el panel de palabras a buscar pasa al costado
     de la grilla en vez de abajo, para no tener que scrollear tanto
     para verlas. */
  .sopa-layout { display: flex; flex-direction: column; gap: 4px; }
  @media (min-width: 720px) {
    .sopa-layout { flex-direction: row; align-items: flex-start; gap: 24px; }
    .tablero-sopa-wrap { flex: 1 1 55%; max-width: 480px; }
    .panel-definiciones { flex: 1 1 40%; margin-top: 0 !important; }
  }
  .tablero-sopa-wrap { margin-top: 14px; }
  .tablero-sopa {
    display: grid; gap: 2px;
    background: var(--marron); padding: 5px; border-radius: 8px;
    width: 100%;
  }
  .celda-sopa {
    background: white; aspect-ratio: 1;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(1rem, 3.2vw, 1.5rem); font-weight: bold; cursor: pointer;
    user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .celda-sopa.celda-sel-temp { background: var(--ocre-claro); }
  .celda-sopa.celda-encontrada { background: var(--verde-ok); color: white; }
  .panel-definiciones { margin-top: 16px; }
  .definicion-item {
    background: #f0e6d2; border-radius: 8px; padding: 8px 12px;
    margin-bottom: 6px; font-size: 0.85rem; color: #999;
  }
  .definicion-item.encontrada { background: #e4f3e6; color: var(--negro); }

  .oculto { display: none !important; }

  /* ---------- Concordancia (unir con flecha) ---------- */
  .concordancia-wrap { position: relative; margin-top: 10px; }
  .concordancia-lineas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none; overflow: visible;
    z-index: 2;
  }
  /* Color por defecto (si por algún motivo no hay color de oración
     asignado a ese tramo); en uso normal cada línea trae su propio
     color inline, uno distinto por oración, para poder distinguirlas. */
  .concordancia-linea { stroke: var(--rojo); stroke-width: 3; }
  /* Más separación entre columnas que antes, para que las líneas
     tengan recorrido visible en vez de quedar como un tramo cortito. */
  .concordancia-columnas { display: flex; justify-content: space-between; gap: 26px; position: relative; z-index: 1; }
  .concordancia-columna { display: flex; flex-direction: column; gap: 10px; flex: 1; align-items: stretch; }
  /* Recuadros más chicos que antes (menos padding, texto más chico),
     para dejar más lugar visible a las líneas de unión. */
  .concordancia-nodo {
    background: white; border: 2px solid var(--ocre);
    border-radius: 8px; padding: 5px 4px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-size: 0.78rem;
  }
  /* Tamaño fijo (no solo max-width): así la caja del nodo no cambia
     de alto cuando la imagen termina de cargar, que era lo que podía
     dejar mal alineadas (o directamente invisibles) las líneas entre
     la columna del sustantivo y la del verbo. */
  .concordancia-nodo-img {
    width: 52px; height: 52px; object-fit: contain;
    border-radius: 6px; background: white;
  }
  .concordancia-nodo-texto { text-align: center; }
  .concordancia-nodo.seleccionado { border-color: var(--rojo); box-shadow: 0 0 0 3px rgba(161,58,46,0.25); }
  .concordancia-nodo.conectado { background: #e4f3e6; border-color: var(--verde-ok); }
  .concordancia-nodo.incorrecto { animation: sacudir-swatch 0.4s ease; border-color: var(--rojo-error); background: #f8e5e2; }
  .concordancia-resueltas { margin-top: 14px; }

  /* ---------- Discriminar (colorear solo el elemento correcto) ---------- */
  .consigna-visual {
    display: flex; align-items: center; gap: 12px;
    background: var(--ocre-claro); padding: 12px 16px;
    border-radius: 10px; margin-bottom: 14px;
  }
  .texto-consigna-visual { font-size: 1.15rem; font-weight: bold; color: var(--rojo); flex: 1; }
  .circulo-color-indicador {
    width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid white; box-shadow: 0 0 0 2px var(--marron);
    flex-shrink: 0;
  }
  .discriminar-wrap { width: 100%; }
  .discriminar-wrap .zonas-info-imagen { width: 100%; }
  .zona-discriminar {
    position: absolute;
    width: 15%; height: 20%;
    border-radius: 50%;
    background: transparent;
    border: none;
    cursor: pointer;
    transform: translate(-50%, -50%);
  }
  .zona-discriminar.acertada { cursor: default; }
  .zona-discriminar.error-temp {
    background: rgba(161, 58, 46, 0.35);
    border: 3px solid var(--rojo-error);
  }
  .manzana-pintada-overlay {
    position: absolute;
    width: 17.8%; height: auto;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  /* ---------- Billetes (decenas y centenas) ---------- */
  .fila-contexto-billetes { margin: 0 0 12px; }
  .contexto-billetes { font-style: italic; color: var(--marron); margin: 0; }
  .objetivo-billetes { font-size: 1.15rem; margin: 0 0 14px; }
  .objetivo-billetes strong { color: var(--rojo); }
  .banco-billetes { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
  /* Billetes más grandes, con forma rectangular (como un billete
     real) en vez de cuadrada, para que se vean con claridad. */
  .btn-billete {
    background: white; border: 2px solid var(--ocre); border-radius: 10px;
    padding: 10px; cursor: pointer; display: flex; flex-direction: column;
    align-items: center; gap: 6px;
  }
  .btn-billete:hover { background: var(--ocre-claro); }
  .img-billete-banco {
    width: 168px; max-width: 40vw; height: auto; aspect-ratio: 2.2 / 1;
    object-fit: cover; border-radius: 5px;
  }
  .etiqueta-billete { font-weight: bold; color: var(--marron); font-size: 1.05rem; }
  .bandeja-total {
    display: flex; flex-wrap: wrap; gap: 8px; min-height: 70px;
    background: #faf6ec; border: 2px dashed #c9b489; border-radius: 8px;
    padding: 10px; margin-bottom: 8px;
  }
  .chip-billete {
    width: 100px; height: auto; aspect-ratio: 2.2 / 1;
    object-fit: cover; border-radius: 4px;
  }
  .total-billetes-texto { font-size: 1.1rem; margin: 4px 0; }
  .total-billetes-texto strong { color: var(--rojo); }
  .desglose-valor { color: var(--marron); margin: 0 0 10px; }
  .fila-botones-billetes { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .btn-quitar-billete {
    background: white; border: 2px solid var(--marron); color: var(--marron);
    padding: 10px 16px; border-radius: 8px; cursor: pointer; font-size: 0.95rem;
  }

  /* ---------- Zonas info (reutilizado por "discriminar") ---------- */
  .zonas-info-centro {
    display: flex; justify-content: center;
    width: 100%; margin-top: 10px;
  }
  .zonas-info-wrap {
    position: relative;
    display: inline-block;
    max-width: 100%;
    line-height: 0;
  }
  .zonas-info-imagen {
    display: block;
    width: auto; height: auto;
    max-width: 100%; max-height: 50vh;
    border-radius: 10px;
  }

</style>
</head>
<body>

<div id="app">
  <div id="barra-progreso-wrap">
    <div id="barra-progreso-fondo"><div id="barra-progreso-interna"></div></div>
    <span id="texto-progreso">Pantalla 1 de 22</span>
  </div>

  <div id="pantalla-contenedor"></div>

  <div id="nav-inferior">
    <button id="btn-anterior" onclick="anterior()">← Anterior</button>
    <button id="btn-siguiente" onclick="siguiente()">Siguiente →</button>
  </div>
</div>

<div id="lightbox">
  <div id="lightbox-img-wrap">
    <img id="lightbox-img" src="assets/img/profe.jpg" alt="Foto">
  </div>
  <p id="lightbox-zoom-hint">🔍 Tocá la foto para hacer zoom</p>
  <p>Menos prisa, más vida 🧉🫂</p>
  <button id="lightbox-cerrar">Cerrar</button>
</div>

<script src="datos.js"></script>
<script src="motor.js"></script>
<script>iniciarApp();</script>
</body>
</html>
