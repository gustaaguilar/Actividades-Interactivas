<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Integrador de 3.er grado · QueSepanTodos</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Baloo 2',system-ui,sans-serif;background:linear-gradient(160deg,#dbeafe,#fef3c7);color:#1f2937;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-size:clamp(17px,3.2vh,24px)}
header{padding:4px 12px;display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.75);font-weight:700;font-size:clamp(15px,2.4vh,20px);border-bottom:2px solid rgba(30,58,138,.1);flex:0 0 auto}
header .marca{color:#1e3a8a} header .stats{display:flex;gap:12px}
main#pantalla{flex:1;display:flex;flex-direction:column;padding:1.5vh 3vw;overflow:hidden;min-height:0}
.pantalla{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:1.2vh;min-height:0;width:100%;max-width:820px;margin:0 auto}
.btn-principal,.btn-sec,.btn-siguiente{font-family:inherit;font-weight:700;font-size:clamp(18px,3.4vh,26px);padding:1.4vh 5vw;border:none;border-radius:14px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.15);text-decoration:none;text-align:center}
.btn-principal{background:#1e3a8a;color:#fff} .btn-sec{background:#f1f5f9;color:#1e3a8a}
.btn-siguiente{background:#16a34a;color:#fff;margin-top:auto;flex:0 0 auto}
.btn-siguiente:disabled{background:#94a3b8;opacity:.7;cursor:not-allowed}
.btn-principal:active,.btn-sec:active,.btn-siguiente:active:not(:disabled){transform:translateY(2px)}
.bloqueado .pantalla > *:not(.consigna){pointer-events:none}
.bloqueado .grilla,.bloqueado .pool,.bloqueado .opciones,.bloqueado .columnas,.bloqueado .tablero,.bloqueado .puzzle,.bloqueado .sopa-grilla{opacity:.55}

/* portada y cierre */
.portada{justify-content:space-between;padding:1vh 0}
.portada-img{max-height:36vh;max-width:90%;border-radius:18px;object-fit:contain}
.portada-txt{text-align:center}
.portada-txt h1{font-size:clamp(26px,5.2vh,40px);color:#1e3a8a;line-height:1.1}
.meta-linea{font-size:clamp(17px,3vh,24px);color:#475569;margin-top:4px;font-weight:600}
.portada-pie{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;padding-bottom:1vh}
.foto-firma{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.75);padding:6px 10px;border-radius:14px}
.foto-mini{width:clamp(48px,8vh,70px);height:clamp(48px,8vh,70px);border-radius:50%;object-fit:cover;object-position:50% 25%;cursor:pointer;border:2px solid #1e3a8a}
.firma{font-size:clamp(12px,1.9vh,16px);color:#334155;line-height:1.3;font-weight:600}
.cierre{justify-content:center;gap:1.6vh}
.cierre .portada-img{max-height:26vh}
.cierre h2{font-size:clamp(26px,5.5vh,40px);color:#1e3a8a}
.resultados{display:grid;grid-template-columns:1fr 1fr;gap:1vh 4vw;font-size:clamp(18px,3.4vh,26px);background:#fff;padding:2vh 4vw;border-radius:14px;box-shadow:0 6px 14px rgba(0,0,0,.08)}
.resultados b{color:#1e3a8a}
.cierre-botones{display:flex;flex-direction:column;gap:1.4vh;width:100%;max-width:420px}

/* comunes */
.consigna{font-size:clamp(18px,3.4vh,26px);font-weight:800;text-align:center;color:#1e3a8a;line-height:1.2;flex:0 0 auto}
.escena{max-height:28vh;max-width:100%;border-radius:14px;object-fit:contain;box-shadow:0 6px 14px rgba(0,0,0,.1);background:#fff;padding:6px;flex:0 1 auto;min-height:0}
.escena.chica{max-height:18vh}
.final{min-height:0;font-weight:800;color:#166534;font-size:clamp(18px,3.4vh,26px);opacity:0;transition:.2s;flex:0 0 auto;text-align:center}
.final.visible{opacity:1;animation:pop .35s}
@keyframes pop{0%{transform:scale(.7)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes titilar{50%{box-shadow:0 0 0 6px rgba(245,158,11,.35)}}

/* celdas (identificar / asociar) */
.grilla{display:grid;gap:1.2vh;width:100%;max-width:640px;flex:0 0 auto}
.celda{font-family:inherit;font-weight:800;font-size:clamp(24px,6vh,52px);color:#1e3a8a;background:#fff;border:3px solid #cbd5e1;border-radius:14px;padding:1vh 1vw;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:8vh;transition:.12s}
.celda img{max-width:100%;max-height:14vh;object-fit:contain}
.grilla.con-img .celda{font-size:clamp(16px,3vh,24px)}
.grilla.muchas .celda{font-size:clamp(16px,min(5.2vw,5vh),44px);padding:1vh 2px}
.grilla.muchas{gap:1vh 1.5vw}
.celda.ok{background:#dcfce7;border-color:#16a34a;color:#166534}
.celda.err{background:#fee2e2;border-color:#dc2626;animation:shake .35s}
.celda.apagada{opacity:.35}
.celda.tachada{opacity:.45;text-decoration:line-through;text-decoration-thickness:5px;text-decoration-color:#dc2626;background:#f1f5f9}
.celda.sel{border-color:#f59e0b;animation:titilar 1s infinite}
.celda.pista{border-color:#60a5fa}
.celda.hecho{border-color:#16a34a;color:#14532d}
.columnas{display:grid;grid-template-columns:1fr 1fr;gap:3vw;width:100%;flex:1 1 auto;min-height:0}
.columnas .col{display:flex;flex-direction:column;gap:1vh;justify-content:center;min-height:0}
.columnas .celda{font-size:clamp(17px,3.2vh,26px);flex:1 1 0;min-height:0;max-height:16vh}
.columnas.con-img .celda img{max-height:100%}

/* ordenar */
.zona-armado{width:100%;max-width:680px;min-height:9vh;background:#fff;border:3px dashed #94a3b8;border-radius:12px;padding:1vh 2vw;font-size:clamp(22px,4.5vh,36px);font-weight:800;color:#1e3a8a;text-align:center;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;flex:0 0 auto}
.zona-armado .ph{color:#94a3b8;font-weight:500;font-size:clamp(15px,2.6vh,20px)}
.zona-armado.ok{border-style:solid;border-color:#16a34a;background:#f0fdf4;color:#166534}
.pool{display:flex;flex-wrap:wrap;gap:1.2vh;justify-content:center;width:100%;max-width:680px;flex:0 0 auto}
.pieza{font-family:inherit;font-weight:800;font-size:clamp(20px,4.2vh,34px);padding:1vh 3vw;border-radius:12px;background:#fef3c7;border:3px solid #f59e0b;color:#78350f;cursor:pointer}
.pieza.usada{opacity:.2} .pieza.err{background:#fee2e2;border-color:#dc2626;animation:shake .35s}

/* completar */
.texto-completar{background:#fff;border-radius:14px;padding:1.5vh 3vw;font-size:clamp(22px,4.4vh,36px);font-weight:700;color:#1f2937;text-align:center;line-height:1.5;box-shadow:0 4px 10px rgba(0,0,0,.06);flex:0 0 auto;max-width:100%}
.texto-completar.grande{font-size:clamp(40px,10vh,90px);font-weight:800;letter-spacing:2px;line-height:1.1}
.hueco{color:#94a3b8;border-bottom:4px solid #94a3b8;padding:0 4px;margin:0 2px;display:inline-block;min-width:1.4em}
.hueco.activo{color:#f59e0b;border-color:#f59e0b;animation:titilar 1s infinite;border-radius:6px}
.hueco.ok{color:#2563eb;border-color:#16a34a}
.opciones{display:grid;gap:1.2vh;width:100%;max-width:600px;flex:0 0 auto}
.opciones.cortas{grid-template-columns:1fr 1fr} .opciones.largas{grid-template-columns:1fr}
.opcion{font-family:inherit;font-weight:800;font-size:clamp(20px,4.2vh,34px);padding:1.2vh 2vw;border-radius:12px;background:#fff;border:3px solid #cbd5e1;color:#1e3a8a;cursor:pointer}
.opcion.err{background:#fee2e2;border-color:#dc2626;color:#991b1b;animation:shake .35s}
.opcion:disabled{cursor:default}

/* rompecabezas */
.puzzle-wrap{flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.puzzle{display:grid;gap:2px;background:#334155;border-radius:8px;overflow:hidden;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.pz{background-repeat:no-repeat;cursor:pointer;transition:outline .1s}
.pz.sel{outline:4px solid #f59e0b;outline-offset:-4px;filter:brightness(1.12)}
.puzzle.resuelto{gap:0;background:transparent}
.ayuda-puzzle{font-size:clamp(14px,2.3vh,18px);color:#475569;font-weight:600;flex:0 0 auto;text-align:center}

/* memoria */
.tablero{display:grid;gap:1vh;width:100%;max-width:640px;flex:1 1 auto;min-height:0;align-content:center}
.carta{font-family:inherit;border:none;background:transparent;cursor:pointer;aspect-ratio:1/1;max-height:17vh;width:100%;position:relative;justify-self:center;max-width:17vh}
.carta .dorso,.carta .frente{position:absolute;inset:0;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-direction:column;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .35s}
.carta .dorso{background:linear-gradient(135deg,#1e3a8a,#3b82f6);color:#fff;font-size:5vh;font-weight:800}
.carta .frente{background:#fff;border:3px solid #cbd5e1;transform:rotateY(180deg);font-weight:800;color:#1e3a8a;font-size:clamp(11px,min(3.4vw,2.6vh),22px);padding:3px;overflow:hidden;word-break:break-word;line-height:1.05;text-align:center}
.carta .frente img{max-width:100%;max-height:75%;object-fit:contain}
.carta.abierta .dorso{transform:rotateY(180deg)} .carta.abierta .frente{transform:rotateY(0)}
.carta.par .frente{border-color:#16a34a}

/* sopa */
.sopa-pistas{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;flex:0 0 auto}
.pista-sopa{display:flex;align-items:center;gap:4px;background:#fff;border:2px solid #cbd5e1;border-radius:10px;padding:1px 6px;font-weight:700;font-size:clamp(13px,2.1vh,18px)}
.pista-sopa img{height:4vh;width:auto}
.pista-sopa.hallada{border-color:#16a34a;text-decoration:line-through}
.sopa-grilla{display:grid;gap:2px;width:100%;max-width:min(96vw,40vh);flex:0 0 auto;touch-action:manipulation}
.ls{aspect-ratio:1/1;min-width:0;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:4px;font-weight:800;font-size:clamp(12px,min(3vh,5.5vw),24px);color:#1e3a8a;cursor:pointer}
.ls.sel{background:#fde68a;outline:3px solid #f59e0b}
.sopa-grilla.err{animation:shake .35s}

/* revisión, lightbox, envío */
#navRev{position:fixed;bottom:8px;left:8px;display:flex;gap:8px;align-items:center;background:rgba(30,58,138,.9);color:#fff;padding:6px 12px;border-radius:20px;font-weight:700;font-size:16px;z-index:50}
#navRev:empty{display:none}
body.revision main#pantalla{padding-bottom:56px}
#navRev button{background:transparent;border:none;color:#fff;font-size:20px;cursor:pointer;padding:4px 8px}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:100;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:10px}
#lightbox[hidden],#modalEnvio[hidden]{display:none}
.lb-close{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.2);color:#fff;border:none;font-size:28px;width:50px;height:50px;border-radius:50%;cursor:pointer}
#lbImg{max-width:95vw;max-height:80vh;border-radius:8px;object-fit:contain;transition:transform .3s;cursor:zoom-in}
#lbImg.zoom{transform:scale(1.8);cursor:zoom-out}
.lb-frase{color:#fff;font-size:20px;margin-top:16px;font-weight:600}
#modalEnvio{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:110;display:flex;align-items:center;justify-content:center;padding:16px}
.envio-card{background:#fff;border-radius:16px;padding:20px;max-width:400px;width:100%;display:flex;flex-direction:column;gap:10px;max-height:92vh;overflow-y:auto}
.envio-card h3{color:#1e3a8a;font-size:22px;text-align:center}
.envio-card label{font-weight:600;font-size:16px;color:#334155}
.envio-card input{font-family:inherit;font-size:18px;padding:10px;border:2px solid #cbd5e1;border-radius:10px;width:100%}
.envio-card .row{display:flex;gap:8px;justify-content:flex-end}
.envio-msg{color:#dc2626;font-size:15px;min-height:16px;text-align:center}
.tarjeta-wrap img{max-width:100%;border-radius:10px;border:1px solid #e2e8f0}
.nota{font-size:13px;color:#475569;text-align:center}
.tarjeta-botones{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.tarjeta-botones a{font-size:18px;padding:10px 18px}
.grilla:not(.con-img):not(.muchas) .celda{font-size:clamp(18px,min(6vh,7.5vw),52px);min-width:0}
.texto-completar .pal{white-space:nowrap;display:inline-block}
.columnas .celda.largo{font-size:clamp(13px,min(4.3vw,3.2vh),28px)!important;line-height:1.2}
.grilla.con-img[style*="repeat(1,"] .celda{flex-direction:row;gap:3vw;text-align:left;min-height:0}.grilla.con-img[style*="repeat(1,"] .celda img{max-height:11vh;max-width:30%}
.ordenar.frases .pieza,.ordenar.frases .zona-armado{font-size:clamp(13px,min(4vw,2.3vh),20px)!important;line-height:1.2}.ordenar.frases .pieza{padding:.6vh 2vw}
.columnas.texto-img{grid-template-columns:3fr 2fr;max-width:1000px;margin:0 auto}
.columnas.img-texto{grid-template-columns:2fr 3fr;max-width:1000px;margin:0 auto}
.grilla.en-texto{display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-start;gap:.7vh 1vw;max-width:900px;background:#fff;border-radius:14px;padding:1.2vh 2vw;box-shadow:0 4px 10px rgba(0,0,0,.06)}.grilla.en-texto .celda{width:auto;min-width:0;min-height:0;padding:.2vh 1vw;border-width:2px;border-radius:9px;font-size:clamp(14px,min(4vw,2.6vh),26px)!important}.grilla.en-texto .salto{flex-basis:100%;height:0}
.columnas .celda{overflow:hidden;min-height:0}.columnas.con-img .celda{padding:2px}.columnas .celda img{height:100%;min-height:0;max-height:100%;width:auto;max-width:100%;object-fit:contain}
.columnas.dos .col{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(0,1fr);gap:1vh 1.5vw;align-content:stretch}.columnas.dos .celda{max-height:none;height:100%;font-size:clamp(13px,min(4vw,3vh),24px);padding:2px}
</style>
</head>
<body>
<header><div class="marca">💻 QueSepanTodos</div><div class="stats"><span>✅ <b id="sA">0</b></span><span>❌ <b id="sE">0</b></span><span>⭐ <b id="sP">0</b></span></div></header>
<main id="pantalla"></main><div id="navRev"></div>
<div id="lightbox" hidden><button class="lb-close" id="lbClose">✕</button><img id="lbImg" src="" alt="Zoom"><div class="lb-frase">Menos prisa, más vida 🧉🫂</div></div>
<div id="modalEnvio" hidden></div>
<script src="datos.js"></script><script src="motor.js"></script>
</body>
</html>
