<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
<title>La Panadería de Mateo - Aventureros de la Matemática</title>
<style>
  :root {
    --azul: #1e5b8f;
    --azul-claro: #4a9fd8;
    --naranja: #e8963c;
    --verde: #4caf50;
    --rojo: #e05a5a;
    --fondo: #fdf6ec;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
    background: linear-gradient(160deg, #fdf6ec 0%, #e8f0f7 100%);
    color: #2b2b2b;
    min-height: 100vh;
  }
  #app { max-width: 720px; margin: 0 auto; padding: 12px 16px 32px; }

  /* Progreso */
  .progreso-wrap { display: flex; align-items: center; gap: 8px; margin: 10px 0 16px; }
  .progreso { background: #ddd; border-radius: 10px; height: 8px; flex: 1; overflow: hidden; }
  .progreso-barra { background: var(--naranja); height: 100%; transition: width .3s; }
  .progreso-contador { font-size: .78rem; color: #888; white-space: nowrap; }

  /* Pantalla genérica */
  .pantalla { background: #fff; border-radius: 18px; box-shadow: 0 4px 14px rgba(0,0,0,.08); padding: 16px; }
  .img-pantalla { width: 100%; border-radius: 14px; display: block; margin-bottom: 12px; max-height: 260px; object-fit: cover; }
  .img-zoomable-wrap { position: relative; }
  .img-zoomable-wrap .img-pantalla { cursor: zoom-in; }
  .badge-zoom { position: absolute; bottom: 20px; right: 10px; background: rgba(0,0,0,.6); color: #fff;
    border-radius: 20px; padding: 6px 12px; font-size: .78rem; pointer-events: none; }
  .btn-ampliar { background: #eef4f9; color: var(--azul); border: 2px solid var(--azul-claro); border-radius: 10px;
    padding: 8px 14px; font-size: .85rem; cursor: pointer; margin-bottom: 12px; display: inline-block; }
  .img-lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.9); z-index: 1000;
    overflow: auto; }
  .img-lightbox.visible { display: block; }
  .img-lightbox img { display: block; margin: 40px auto; max-width: none; width: 95vw; }
  .img-lightbox-cerrar { position: fixed; top: 14px; right: 14px; background: #fff; color: #333; border: none;
    border-radius: 50%; width: 40px; height: 40px; font-size: 1.2rem; z-index: 1001; }
  .contenido { padding: 4px 2px; }
  .pregunta { font-size: 1.1rem; font-weight: 600; color: var(--azul); margin: 6px 0 14px; }
  .texto-narrativo { font-size: 1.05rem; line-height: 1.5; }
  .pista { font-size: .9rem; color: #777; font-style: italic; }
  .nota-verificar { font-size: .85rem; font-weight: 400; color: #888; display: block; margin-top: 4px; }

  /* Botones */
  .btn { background: var(--azul); color: #fff; border: none; border-radius: 12px; padding: 12px 20px;
    font-size: 1rem; cursor: pointer; margin: 8px 4px 0 0; transition: transform .1s, opacity .2s; }
  .btn:active { transform: scale(0.96); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-siguiente { background: var(--naranja); display: block; width: 100%; margin-top: 18px; font-weight: 700; }
  .btn-comenzar { background: var(--naranja); font-size: 1.1rem; padding: 14px 28px; margin-top: 20px; }

  /* Portada / cierre */
  .portada, .cierre { text-align: center; background: #fff; border-radius: 20px; padding: 24px 16px; box-shadow: 0 4px 14px rgba(0,0,0,.08); }
  .img-portada { width: 100%; border-radius: 16px; max-height: 320px; object-fit: cover; }
  .portada h1, .cierre h1 { color: var(--azul); margin: 14px 0 4px; }
  .resultados { background: var(--fondo); border-radius: 14px; padding: 14px; margin: 16px 0; }
  .resultados p { margin: 6px 0; font-size: 1.05rem; }
  .estrellas { font-size: 1.6rem; }
  .cita { font-size: .72rem; color: #999; margin-top: 18px; line-height: 1.35; padding: 0 6px; }

  /* Perfil / lightbox */
  .perfil-mini { display: flex; flex-direction: column; align-items: center; gap: 4px; margin-top: 14px; cursor: pointer; font-size: .85rem; color: #555; text-align: center; }
  .perfil-mini img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; border: 2px solid var(--naranja); }
  .perfil-mail { font-size: .78rem; color: #888; }
  .lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.75); align-items: center; justify-content: center; z-index: 999; }
  .lightbox.visible { display: flex; }
  .lightbox-contenido { text-align: center; color: #fff; }
  .lightbox-contenido img { width: 140px; height: 140px; border-radius: 50%; object-fit: cover; border: 4px solid #fff; }
  .lightbox-contenido p { margin-top: 10px; font-size: 1.1rem; }

  /* Opciones */
  .opciones { display: flex; flex-direction: column; gap: 10px; }
  .btn-opcion { background: var(--fondo); border: 2px solid #ddd; border-radius: 12px; padding: 12px 14px;
    font-size: 1rem; text-align: left; cursor: pointer; }
  .btn-opcion.correcta { background: #d7f5d7; border-color: var(--verde); }
  .btn-opcion.incorrecta { background: #fbdada; border-color: var(--rojo); }
  .check-opcion { display: flex; align-items: center; gap: 8px; background: var(--fondo); border-radius: 10px; padding: 10px; }

  .feedback-ok { color: var(--verde); font-weight: 700; }
  .feedback-no { color: var(--rojo); font-weight: 700; }

  /* Hotspot */
  .hotspot-wrap { position: relative; }
  .hotspot-punto { position: absolute; transform: translate(-50%, -50%); width: 38px; height: 38px;
    border-radius: 50%; background: var(--naranja); color: #fff; border: 3px solid #fff; font-size: 1rem;
    box-shadow: 0 2px 6px rgba(0,0,0,.3); animation: pulso 1.5s infinite; }
  .hotspot-punto.resuelto { background: var(--verde); animation: none; }
  @keyframes pulso { 0%,100% { box-shadow: 0 0 0 0 rgba(232,150,60,.5);} 50% { box-shadow: 0 0 0 10px rgba(232,150,60,0);} }
  .mini-pregunta { background: var(--fondo); border-radius: 12px; padding: 12px; margin-top: 10px; }
  .hotspot-opciones-oculto { display: none; }
  .trivia-opciones-oculto { display: none; }

  /* Reloj */
  .reloj-armar { display: flex; align-items: center; gap: 8px; font-size: 1.3rem; }
  .reloj-armar select { font-size: 1.2rem; padding: 6px; border-radius: 8px; }

  /* Clasificar */
  .fichas { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .ficha { background: var(--azul-claro); color: #fff; border: none; border-radius: 10px; padding: 10px 14px; font-size: 1rem; cursor: pointer; }
  .ficha.seleccionada { outline: 3px solid var(--naranja); }
  .ficha.usada { opacity: .4; }
  .ficha.correcta { background: var(--verde); }
  .ficha.incorrecta { background: var(--rojo); }
  .categorias { display: flex; gap: 10px; }
  .categoria { flex: 1; background: var(--fondo); border: 2px dashed #bbb; border-radius: 12px; padding: 10px; min-height: 90px; cursor: pointer; text-align: center; font-weight: 600; }
  .cat-lista { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin-top: 8px; }
  .cat-lista span { background: #fff; border-radius: 6px; padding: 3px 6px; font-size: .85rem; font-weight: 400; }

  /* Input numero */
  .input-numero-wrap { display: flex; gap: 8px; }
  .input-numero-wrap input { flex: 1; padding: 10px; font-size: 1rem; border-radius: 10px; border: 2px solid #ccc; }

  /* Secuencia / ordenar */
  .secuencia { min-height: 40px; background: var(--fondo); border-radius: 10px; padding: 10px; margin: 8px 0; }
  .chip { background: #fff; border-radius: 8px; padding: 4px 8px; }

  /* Tabla */
  .tabla-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; justify-content: center; }
  .celda, .celda-input { text-align: center; padding: 8px 4px; border-radius: 8px; font-size: .95rem;
    width: 56px; box-sizing: border-box; }
  .celda.dada { background: var(--azul-claro); color: #fff; font-weight: 700; }
  .celda-input { border: 2px solid #ccc; }
  .celda-input.ok { border-color: var(--verde); background: #e8f9e8; }
  .celda-input.error { border-color: var(--rojo); background: #fbe9e9; }
  .tabla-filas .fila-header, .tabla-filas .fila { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid #eee; }
  .tabla-filas .fila-header { font-weight: 700; color: var(--azul); }
  .tabla-filas .celda-input { width: 90px; }

  /* Unir */
  .unir-wrap { display: flex; gap: 14px; }
  .col-izq, .col-der { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .btn-unir { background: var(--fondo); border: 2px solid #ddd; border-radius: 10px; padding: 10px; cursor: pointer; font-size: .95rem; }
  .btn-unir.seleccionada { border-color: var(--naranja); }
  .btn-unir.unida { background: #d7f5d7; border-color: var(--verde); opacity: .7; }
  .shake { animation: shake .4s; }
  @keyframes shake { 0%,100% { transform: translateX(0);} 25% { transform: translateX(-6px);} 75% { transform: translateX(6px);} }

  /* Armar numero */
  .objetivo { font-size: 1.2rem; }
  .total-actual { font-size: 1.05rem; color: var(--azul); }

  /* Jarra */
  .jarra-wrap { text-align: center; }
  .jarra-indicador-grande { font-size: 1.8rem; font-weight: 800; color: var(--azul); background: var(--fondo);
    border-radius: 12px; padding: 6px 16px; display: inline-block; margin-bottom: 10px; border: 2px solid var(--azul-claro); }
  .jarra { width: 100px; height: 160px; border: 4px solid var(--azul); border-radius: 0 0 14px 14px; margin: 0 auto 10px; position: relative; overflow: hidden; background: #fff; }
  .jarra-nivel { position: absolute; bottom: 0; width: 100%; background: var(--azul-claro); transition: height .1s; }
  input[type="range"] { width: 100%; margin: 10px 0; }

  @media (max-width: 420px) {
    .unir-wrap { gap: 8px; }
  }
</style>
</head>
<body>
  <div id="app">Cargando...</div>
  <div id="img-lightbox" class="img-lightbox" onclick="cerrarImagenZoom()">
    <button class="img-lightbox-cerrar" onclick="event.stopPropagation(); cerrarImagenZoom()">✕</button>
    <img id="img-lightbox-contenido" src="" alt="" onclick="event.stopPropagation()" />
  </div>
  <script src="datos.js"></script>
  <script src="motor.js"></script>
</body>
</html>
