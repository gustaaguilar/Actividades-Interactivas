<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Fortalecimiento de Trayectorias - Profe Gustavo Aguilar</title>
<style>
  :root{
    --azul:#3b6fd6; --azul-osc:#274b96; --naranja:#ff7a3d; --verde:#3fb46a;
    --rojo:#e0503c; --fondo:#eef3fc; --tarjeta:#ffffff; --texto:#233046;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;font-family:'Trebuchet MS', Verdana, sans-serif;background:var(--fondo);color:var(--texto);}
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;}

  header{background:var(--azul);color:#fff;padding:8px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0;}
  header .titulo-app{font-weight:bold;font-size:1.05em;flex:1;}
  .barra-progreso-cont{flex:2;background:rgba(255,255,255,.3);border-radius:20px;height:10px;overflow:hidden;}
  #progresoBarra{height:100%;background:var(--naranja);width:0%;transition:width .3s;}
  #progresoTexto{font-size:.85em;min-width:52px;text-align:right;}

  #contenido{flex:1;padding:16px 16px 10px;max-width:1000px;margin:0 auto;width:100%;position:relative;overflow-y:auto;min-height:0;}
  #contenido.bloqueado{pointer-events:none;opacity:.85;}
  #contenido.bloqueado::after{content:"🔊";position:absolute;top:6px;right:6px;font-size:1.4em;animation:pulso 1s infinite;}

  .icono-wrap{display:contents;}

  h1{color:var(--azul-osc);text-align:center;margin:8px 0;}
  h2{color:var(--azul-osc);margin:0 0 4px;}
  .instruccion{color:#555;margin-top:0;margin-bottom:12px;}
  .bajada{text-align:center;color:#666;margin-top:-8px;}

  footer{padding:10px 16px;display:flex;justify-content:flex-end;background:#fff;border-top:1px solid #ddd;flex-shrink:0;}
  #btnSiguiente{background:var(--azul);color:#fff;border:none;padding:12px 26px;border-radius:30px;font-size:1em;cursor:pointer;font-weight:bold;}
  #btnSiguiente:disabled{background:#b6c3dd;cursor:not-allowed;}
  #btnSiguiente.oculto{visibility:hidden;}

  .btn-comenzar{background:var(--naranja);color:#fff;border:none;padding:14px 34px;border-radius:30px;font-size:1.15em;cursor:pointer;display:block;margin:22px auto;font-weight:bold;}

  /* ---- thumb profe ---- */
  .thumb-profe{display:flex;flex-direction:column;align-items:center;gap:4px;margin:26px auto 6px;max-width:260px;text-align:center;cursor:pointer;}
  .thumb-profe img,.thumb-fallback{width:92px;height:92px;border-radius:50%;object-fit:cover;border:3px solid var(--azul);}
  .thumb-fallback{display:none;align-items:center;justify-content:center;font-size:2.4em;background:#dce6fb;}
  .thumb-texto{font-size:.8em;color:#555;line-height:1.5;}

  /* ---- lightbox ---- */
  #lightbox{position:fixed;inset:0;background:rgba(20,25,40,.92);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:999;}
  #lightbox.visible{display:flex;}
  #lightboxImg{max-width:80vw;max-height:70vh;border-radius:12px;cursor:zoom-in;transition:transform .25s;}
  #lightbox .tagline{color:#fff;margin-top:14px;font-size:1.1em;}
  #btnCerrarLightbox{position:absolute;top:18px;right:24px;background:none;border:none;color:#fff;font-size:2em;cursor:pointer;}

  /* ---- trazo ---- */
  .fila-trazos{display:flex;flex-direction:column;gap:34px;}
  .grid-trazos{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;}
  .caja-trazo{position:relative;background:var(--tarjeta);border-radius:14px;box-shadow:0 2px 6px rgba(0,0,0,.08);overflow:visible;width:100%;min-height:100px;touch-action:none;}
  .grid-trazos .caja-trazo{width:260px;height:260px;}
  .grid-trazos-repaso{display:grid;grid-template-columns:repeat(var(--n-cols,5),1fr);gap:8px;align-items:start;}
  .grid-trazos-repaso .caja-trazo{width:100%;height:auto;aspect-ratio:1/1;min-height:0;max-width:130px;justify-self:center;}
  .guia-svg{position:absolute;inset:0;width:100%;height:100%;}
  .guia-banda{fill:none;stroke:#dce8ff;stroke-width:15;stroke-linecap:round;stroke-linejoin:round;}
  .guia-linea{fill:none;stroke:#8ca3d6;stroke-width:2.5;stroke-dasharray:2.5 4;stroke-linecap:round;}
  .guia-punto-extra{fill:#dce8ff;stroke:#8ca3d6;stroke-width:2;stroke-dasharray:2.5 3;}
  .guia-punto-extra.pintado{fill:#ff7a3d;stroke:#c85a1e;stroke-dasharray:none;}
  .letra-fondo{font-size:70px;fill:#eef1f9;font-weight:bold;font-family:Georgia,serif;}
  .icono-camino{font-size:8px;}
  .icono-trazo-overlay{position:absolute;transform:translate(-50%,-50%);pointer-events:none;z-index:3;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25));max-width:none;overflow:visible;}
  .icono-trazo-img{width:68px;height:68px;object-fit:contain;font-size:3.1em;line-height:1;display:flex;align-items:center;justify-content:center;overflow:visible;}
  .grid-trazos .icono-trazo-img{width:84px;height:84px;font-size:3.8em;}
  .trazo-canvas{position:absolute;inset:0;width:100%;height:100%;cursor:none;}
  .trazo-check{position:absolute;top:8px;right:8px;background:var(--verde);color:#fff;border-radius:50%;width:34px;height:34px;display:none;align-items:center;justify-content:center;font-size:1.1em;z-index:4;}
  .trazo-check.visible{display:flex;}
  .caja-trazo.completo{box-shadow:0 0 0 3px var(--verde);}
  .btn-listo-trazo{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:var(--azul);color:#fff;border:none;padding:8px 16px;border-radius:20px;cursor:pointer;z-index:4;}

  /* ---- manito señaladora (reemplaza la cruz invisible) ---- */
  .puntero-lapiz{position:absolute;width:38px;height:38px;transform:translate(-100%,-100%);pointer-events:none;opacity:0;z-index:5;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35));transition:left .05s linear,top .05s linear;}
  .puntero-lapiz svg{width:100%;height:100%;display:block;}
  .puntero-lapiz.visible{opacity:1;}
  .caja-trazo-demo{background:#fbfcff;border:2px dashed var(--azul);}
  .puntero-lapiz-demo{transition:none;}
  .aviso-siguiente{display:none;text-align:center;color:var(--verde);font-weight:bold;font-size:1.1em;margin-top:14px;animation:pulso 1.3s infinite;}
  .progreso-secuencial{text-align:center;font-weight:bold;color:var(--azul-osc);font-size:1.1em;margin:4px 0 10px;}
  .aviso-siguiente.visible{display:block;}

  /* ---- clasificar ---- */
  .fila-chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:24px;}
  .chip{background:#fff;border:2px solid var(--azul);color:var(--azul-osc);padding:10px 18px;border-radius:20px;font-weight:bold;cursor:pointer;font-size:1em;}
  .chip.seleccionado{background:var(--azul);color:#fff;}
  .chip.resuelto{opacity:.35;border-color:#ccc;color:#999;cursor:default;}
  .dos-cajas{display:flex;gap:16px;justify-content:center;}
  .caja-clasif{flex:1;max-width:260px;background:#fff;border:3px dashed var(--azul);border-radius:16px;padding:22px 10px;text-align:center;cursor:pointer;font-weight:bold;color:var(--azul-osc);}
  .caja-icono{font-size:2.2em;margin-bottom:6px;display:flex;justify-content:center;}
  .caja-icono-img{width:160px;height:160px;object-fit:contain;font-size:2.2em;}
  .opciones-tipo-letra{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:20px;}
  .opcion-tipo-letra-btn{display:flex;flex-direction:column;align-items:center;gap:8px;background:#fff;border:3px solid var(--azul);border-radius:16px;padding:20px 24px;cursor:pointer;font-weight:bold;color:var(--azul-osc);min-width:150px;}
  .opcion-tipo-letra-btn:active{background:#eaf1ff;}
  .opcion-tipo-letra-ejemplo{font-size:3em;font-family:Georgia,serif;font-weight:bold;}
  .opcion-tipo-letra-ejemplo.tipo-cursiva,.opcion-tipo-letra-ejemplo.tipo-cursivaMayuscula{font-family:'Segoe Script','Comic Sans MS',cursive;font-style:italic;}
  #app.tipo-minuscula .opcion-vocal,#app.tipo-cursiva .opcion-vocal,
  #app.tipo-minuscula .palabra-armada,#app.tipo-cursiva .palabra-armada,
  #app.tipo-minuscula .carta-asociar,#app.tipo-cursiva .carta-asociar{text-transform:lowercase;}
  #app.tipo-cursiva .opcion-vocal,#app.tipo-cursiva .carta-asociar,#app.tipo-cursiva .letra-fondo,
  #app.tipo-cursiva h1,#app.tipo-cursiva h2,
  #app.tipo-cursiva .instruccion,#app.tipo-cursiva .gesto,
  #app.tipo-cursiva .texto-fragmento,#app.tipo-cursiva .palabra-armada,
  #app.tipo-cursiva .oracion-armada,#app.tipo-cursiva .chip,
  #app.tipo-cursiva .letra-dispersa,
  #app.tipo-cursivaMayuscula .opcion-vocal,#app.tipo-cursivaMayuscula .carta-asociar,#app.tipo-cursivaMayuscula .letra-fondo,
  #app.tipo-cursivaMayuscula h1,#app.tipo-cursivaMayuscula h2,
  #app.tipo-cursivaMayuscula .instruccion,#app.tipo-cursivaMayuscula .gesto,
  #app.tipo-cursivaMayuscula .texto-fragmento,#app.tipo-cursivaMayuscula .palabra-armada,
  #app.tipo-cursivaMayuscula .oracion-armada,#app.tipo-cursivaMayuscula .chip,
  #app.tipo-cursivaMayuscula .letra-dispersa{font-family:'Segoe Script','Comic Sans MS',cursive;}
  #app.tipo-minuscula .letra-dispersa{font-family:'Trebuchet MS',Verdana,sans-serif;}
  .lista-clasificados{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px;min-height:1.4em;}
  .palabra-clasificada{background:#eafbf0;border:1px solid var(--verde);color:#227a45;border-radius:12px;padding:3px 10px;font-size:.85em;font-weight:bold;}
  .shake{animation:shake .4s;}

  /* ---- seleccionar / opciones cortas ---- */
  .grid-opciones-cortas{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;}
  .opcion-card{background:#fff;border:2px solid #dbe3f5;border-radius:14px;padding:16px 8px;cursor:pointer;font-weight:bold;color:var(--texto);font-size:1em;}
  .opcion-icono{font-size:2.2em;margin-bottom:6px;display:flex;justify-content:center;}
  .opcion-icono-img{width:120px;height:120px;object-fit:contain;font-size:4.4em;}
  .opcion-card.resuelto{border-color:var(--verde);background:#eafbf0;}
  .opcion-card.incorrecto-fijo{opacity:.4;}

  .campo-disperso{position:relative;min-height:340px;background:#fff;border-radius:16px;box-shadow:0 2px 6px rgba(0,0,0,.06);}
  .letra-dispersa{position:absolute;background:none;border:none;font-size:2.6em;font-weight:bold;color:var(--texto);cursor:pointer;padding:4px 10px;line-height:1;font-family:Georgia,serif;transition:transform .15s;}
  .letra-dispersa.densa{font-size:1.9em;padding:3px 6px;}
  .letra-dispersa.resuelto{color:var(--verde);border-radius:50%;box-shadow:inset 0 0 0 4px var(--verde);}
  .letra-dispersa.incorrecto-fijo{opacity:.3;}

  /* ---- asociar ---- */
  .dos-columnas{display:flex;gap:30px;justify-content:center;align-items:flex-start;}
  .columna{display:flex;flex-direction:column;gap:12px;}
  .columna-derecha-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
  .carta-asociar{background:#fff;border:2px solid #dbe3f5;border-radius:14px;padding:16px 22px;font-size:1.3em;font-weight:bold;cursor:pointer;min-width:90px;text-align:center;}
  .carta-derecha{padding:14px 18px;}
  .carta-icono{display:flex;justify-content:center;margin-bottom:4px;}
  .carta-icono-img{width:120px;height:120px;object-fit:contain;font-size:4.4em;line-height:1;display:flex;align-items:center;justify-content:center;}
  .carta-asociar.seleccionado{border-color:var(--naranja);background:#fff3ea;}
  .carta-asociar.resuelto{border-color:var(--verde);background:#eafbf0;opacity:.7;cursor:default;}
  .mini-puntos{color:var(--rojo);letter-spacing:2px;}

  /* ---- narración vocal ---- */
  .narracion-pantalla{text-align:center;}
  .gesto{color:#777;font-style:italic;}
  .circulo-narracion{width:220px;height:220px;border-radius:50%;border:4px solid var(--azul);margin:20px auto;display:flex;align-items:center;justify-content:center;transition:transform .2s;overflow:hidden;}
  .circulo-narracion.pulso{transform:scale(1.1);}
  .icono-central-img{width:78%;height:78%;object-fit:contain;font-size:4.4em;line-height:1;display:flex;align-items:center;justify-content:center;}
  img.icono-central-img{object-fit:contain;}
  .texto-fragmento{font-size:1.3em;color:var(--azul-osc);min-height:1.6em;font-weight:bold;}

  /* ---- completar / oraciones ---- */
  .completar-pantalla{text-align:center;}
  .mini-progreso{color:#888;margin-bottom:6px;}
  .palabra-icono{font-size:4em;margin-bottom:6px;display:flex;justify-content:center;}
  .palabra-icono-img{width:110px;height:110px;object-fit:contain;font-size:4em;}
  .palabra-armada,.oracion-armada{font-size:1.8em;font-weight:bold;letter-spacing:2px;color:var(--azul-osc);margin-bottom:20px;}
  .oracion-icono{font-size:3.4em;margin-bottom:4px;display:flex;justify-content:center;}
  .oracion-icono-img{width:100px;height:100px;object-fit:contain;font-size:3.4em;}
  .opciones-vocales{max-width:420px;margin:0 auto;}
  .opcion-vocal{font-size:1.4em;}

  /* ---- resumen cierre ---- */
  .cierre-icono{display:flex;justify-content:center;margin:8px 0 4px;}
  .cierre-icono-img{width:220px;max-width:80%;height:auto;object-fit:contain;}
  .resumen{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin:20px 0;}
  .resumen-item{background:#fff;border-radius:14px;padding:14px 20px;box-shadow:0 2px 6px rgba(0,0,0,.08);font-size:1.1em;}

  @keyframes pulso{0%,100%{opacity:1;}50%{opacity:.3;}}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-8px);}75%{transform:translateX(8px);}}

  @media(max-width:640px){
    .dos-columnas{gap:14px;}
    .grid-trazos .caja-trazo{width:100%;max-width:320px;height:320px;}
    .grid-trazos-repaso{gap:6px;}
    .grid-trazos-repaso .caja-trazo{max-width:100px;}
    .circulo-narracion{width:170px;height:170px;}
    .icono-central{font-size:3.6em;}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="titulo-app">Fortalecimiento de Trayectorias</div>
    <div class="barra-progreso-cont"><div id="progresoBarra"></div></div>
    <div id="progresoTexto">1 / 27</div>
  </header>

  <div id="contenido"></div>

  <footer>
    <button id="btnSiguiente" disabled>Siguiente ▶</button>
  </footer>
</div>

<div id="lightbox">
  <button id="btnCerrarLightbox">✕</button>
  <img id="lightboxImg" src="assets/images/profe.jpg" alt="Profe Gustavo Aguilar"
       onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22><rect width=%22200%22 height=%22200%22 fill=%22%233b6fd6%22/><text x=%2250%25%22 y=%2255%25%22 font-size=%2280%22 text-anchor=%22middle%22 fill=%22white%22>👨‍🏫</text></svg>'">
  <div class="tagline">Menos prisa, más vida 🧉🫂</div>
</div>

<script src="datos.js"></script>
<script src="motor.js"></script>
</body>
</html>
