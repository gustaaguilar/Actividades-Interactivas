<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>El dado de las constelaciones · QueSepanTodos</title>
<meta name="description" content="Matemática Nivel Inicial, sala de 5: juego del dado de las constelaciones. Se tira el dado y se pinta la misma cantidad de puntitos hasta completar la grilla. QueSepanTodos.com">
<meta name="theme-color" content="#2b1d5c">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--tinta:#1d1b2f;--papel:#fff9ef;--borde:#eadcc6;--azul:#3a86ff;--rojo:#e63946;--verde:#2ecc71;--amarillo:#ffb703;--violeta:#8338ec;--radio:18px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Baloo 2',system-ui,sans-serif;color:var(--tinta);background:linear-gradient(180deg,#2b1d5c,#4b3b8f);overflow:hidden;user-select:none;-webkit-user-select:none}
#pantalla{height:100%;height:100vh;height:100dvh;display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer;border:0}
/* barra */
.barra{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#0006;color:#fff;flex:0 0 auto}
.b-tit{flex:1;font-weight:800;font-size:clamp(15px,4.2vw,20px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-pts{font-weight:800;background:#ffffff22;border-radius:999px;padding:2px 12px}
.b-ico{width:42px;height:42px;border-radius:50%;background:#ffffff26;font-size:20px;color:#fff}
/* botones */
.btn-jugar{background:linear-gradient(180deg,#ffd166,#fb8500);color:#3d1d00;font-size:clamp(22px,6vw,30px);font-weight:800;padding:10px 34px;border-radius:999px;box-shadow:0 6px 0 #b35f00,0 10px 20px #0004;animation:late 1.6s ease-in-out infinite}
.btn-jugar:active{transform:translateY(4px);box-shadow:0 2px 0 #b35f00}
@keyframes late{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.btn-sec{background:#fff;color:var(--tinta);font-weight:800;font-size:18px;padding:8px 22px;border-radius:999px;box-shadow:0 4px 0 #0003}
.btn-env{background:#25d366;color:#fff;font-weight:800;font-size:clamp(16px,4.4vw,21px);padding:8px 18px;border-radius:999px;box-shadow:0 4px 0 #128c4a}
/* portada */
.portada{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px;text-align:center;color:#fff}
.port-area{background:var(--rojo);border-radius:999px;padding:2px 14px;font-weight:800}
.port-tit{font-size:clamp(34px,10vw,58px);line-height:1;text-shadow:0 4px 0 #0005;color:#ffd166}
.port-sub{font-size:clamp(18px,5vw,24px);font-weight:800}
.port-escena{position:relative;width:min(96vw,560px);height:clamp(130px,26vh,220px);border-radius:var(--radio);overflow:hidden;box-shadow:0 8px 20px #0005}
.auto-port{position:absolute;width:30%;bottom:6%}.auto-port.a1{left:6%;animation:va 2.4s ease-in-out infinite}.auto-port.a2{left:52%;bottom:30%;width:26%;animation:va 2.4s ease-in-out infinite .6s}
@keyframes va{0%,100%{transform:translateX(0)}50%{transform:translateX(18%)}}
.port-fuente{font-size:12px;opacity:.75}
.profe{display:flex;align-items:center;gap:8px;text-align:left;color:#fff}
.profe img,.profe-emoji{width:92px;height:92px;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 3px 10px #0004;cursor:zoom-in;flex:0 0 auto}
.profe-emoji{display:flex;align-items:center;justify-content:center;font-size:46px;background:#fff}
.profe-txt{font-size:13px;font-weight:700;line-height:1.3}.profe-txt .mail{opacity:.8}
/* cierre */
.cierre{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px;color:#fff;text-align:center}
.cierre h1{font-size:clamp(30px,9vw,46px);color:#ffd166}
.trofeo{font-size:64px;display:flex;flex-direction:column;align-items:center;line-height:1}.trofeo span{font-size:20px;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:560px}
.stats div{background:#fff;color:var(--tinta);border-radius:14px;padding:6px 2px;font-weight:800;font-size:13px}
.stats b{display:block;font-size:28px}
.cie-fila{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center}
/* envío (compartido con el motor de paquetes) */
#envio{position:fixed;top:0;right:0;bottom:0;left:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:60;padding:14px}
#envio.ver{display:flex}
.envio-caja{position:relative;background:var(--papel);border-radius:var(--radio);padding:16px 18px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:10px;max-height:94vh;overflow-y:auto}
.envio-caja h2{text-align:center;font-size:22px}
.envio-caja label{display:flex;flex-direction:column;font-weight:800;font-size:15px;gap:4px}
.envio-caja input{font-family:inherit;font-size:18px;padding:8px 10px;border-radius:12px;border:3px solid var(--borde);user-select:text;-webkit-user-select:text}
.envio-msj{font-weight:700;font-size:14px;text-align:center;color:#1d6f65;min-height:1em}
.envio-x{position:absolute;top:-10px;right:-6px;width:40px;height:40px;border-radius:50%;background:#fff;font-size:20px;box-shadow:0 2px 8px #0005}
.envio-img{display:block;width:100%;max-height:46vh;object-fit:contain;border-radius:12px;border:3px solid var(--borde);background:#fff;-webkit-touch-callout:default;user-select:auto;-webkit-user-select:auto}
.envio-bots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.btn{font-family:inherit;font-weight:800;border-radius:999px;padding:8px 16px;font-size:17px;text-decoration:none;flex:1 1 140px;text-align:center}
.btn.enviar{background:#25d366;color:#fff;box-shadow:0 4px 0 #128c4a}.btn.guardar{background:var(--azul);color:#fff;box-shadow:0 4px 0 #1f5fcc}
.btn-aula{background:#f98012;color:#fff;font-weight:800;font-size:clamp(16px,4.4vw,21px);padding:8px 18px;border-radius:999px;box-shadow:0 4px 0 #b35500}
.aula-ok{background:#d8f3dc;color:#1b4332;font-weight:800;border-radius:12px;padding:6px 12px}
#aulaM{position:fixed;top:0;right:0;bottom:0;left:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:60;padding:14px}
.aula-caja{position:relative;background:var(--papel);border-radius:var(--radio);padding:16px 18px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:10px;max-height:94vh;overflow-y:auto}
.aula-caja h2{text-align:center;font-size:22px}
.aula-pasos{padding-left:22px;font-weight:700;font-size:15px;line-height:1.35}
#aulaTxt{font-family:inherit;font-size:14px;border:3px solid var(--borde);border-radius:12px;padding:8px;resize:none;user-select:text;-webkit-user-select:text}
/* lightbox */
#lightbox{position:fixed;top:0;right:0;bottom:0;left:0;background:#000d;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:50;gap:12px;overflow:hidden}
#lightbox.ver{display:flex}
#lbImg{max-width:92vw;max-height:74vh;border-radius:14px;transition:transform .3s;cursor:zoom-in}#lbImg.zoom{transform:scale(2.5)}
#lbFrase{color:#fff;font-size:clamp(18px,5vw,26px);font-weight:700;text-shadow:0 2px 6px #000}
#lbCerrar{position:absolute;top:12px;right:14px;width:44px;height:44px;border-radius:50%;font-size:22px;background:#fff;z-index:3}


.portada{position:relative}
.arranque{position:fixed;top:0;right:0;bottom:0;left:0;z-index:40;background:#2b1d5ce6;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-weight:800;font-size:clamp(24px,7vw,36px);border:0}
.arr-ico{font-size:clamp(60px,18vw,96px);animation:late 1.4s ease-in-out infinite}
.btn-oir-port{background:#ffffff26;color:#fff;font-weight:800;font-size:16px;padding:6px 18px;border-radius:999px;border:2px solid #ffffff66}
@keyframes titi{50%{color:#ffb703}}
@keyframes entra{from{transform:scale(.5);opacity:0}}
/* estrellitas de fondo (constelaciones) */
body::before{content:'';position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none;opacity:.5;background-image:radial-gradient(2px 2px at 12% 18%,#fff 50%,#0000 51%),radial-gradient(2px 2px at 78% 9%,#fff 50%,#0000 51%),radial-gradient(1.5px 1.5px at 40% 70%,#fff 50%,#0000 51%),radial-gradient(2px 2px at 88% 60%,#fff 50%,#0000 51%),radial-gradient(1.5px 1.5px at 22% 88%,#fff 50%,#0000 51%),radial-gradient(1.5px 1.5px at 60% 35%,#fff 50%,#0000 51%)}
#pantalla{position:relative;z-index:1}
/* ===== el dado (como el de goma eva: fondo violeta, borde verde) ===== */
.dado-esc{perspective:700px;width:var(--s,140px);height:var(--s,140px);flex:0 0 auto;position:relative}
.dado{position:relative;width:100%;height:100%;transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
.cara{position:absolute;top:0;left:0;width:100%;height:100%;background:#4a3a8c;border:calc(var(--s,140px)*.09) solid #8ee04a;border-radius:calc(var(--s,140px)*.12);box-shadow:inset 0 0 0 2px #6fbf2f,inset 0 0 18px #0005;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.pto{position:absolute;width:22%;height:22%;border-radius:50%;box-shadow:inset 0 -3px 0 #0003,0 2px 3px #0005}
.pto.brilla{animation:brilla .5s ease-in-out infinite alternate}
@keyframes brilla{to{box-shadow:0 0 0 5px #fff,0 0 16px 6px #fff8}}
.dado-esc.gira .dado{animation:giraP 7s linear infinite}
@keyframes giraP{from{transform:rotateX(-20deg) rotateY(0)}to{transform:rotateX(-20deg) rotateY(360deg)}}
.dado-esc.tocame{cursor:pointer;animation:late 1.3s ease-in-out infinite}
.dado-esc.rueda{animation:salta 1.4s ease-out}
@keyframes salta{0%{transform:translateY(0)}20%{transform:translateY(-22%)}45%{transform:translateY(0)}60%{transform:translateY(-8%)}75%{transform:translateY(0)}}
.dado-esc.sacude{animation:sacD .45s}
@keyframes sacD{25%{transform:translateX(-7%)}75%{transform:translateX(7%)}}
/* portada */
.port-escena{display:flex;align-items:center;justify-content:center;gap:clamp(14px,5vw,40px);height:clamp(130px,26vh,220px)}
.port-escena .dado-esc{--s:clamp(84px,17vh,140px)}
.port-hoja{height:100%;aspect-ratio:4/3;max-width:46vw}
.port-hoja .grilla{width:100%;height:100%}
/* ===== juego ===== */
.juego{flex:1;display:flex;flex-direction:column;min-height:0;position:relative;padding:6px 8px calc(8px + env(safe-area-inset-bottom));gap:6px}
.zona-dado{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:clamp(10px,4vw,28px)}
.dado-caja{display:flex;flex-direction:column;align-items:center;gap:8px}
#dadoJ{--s:clamp(96px,min(22vh,34vw),170px)}
.dado-tx{color:#fff;font-weight:800;font-size:clamp(15px,4.2vw,19px);min-height:1.3em;text-align:center;text-shadow:0 2px 3px #0006}
.lado{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:clamp(130px,36vw,220px)}
.cuenta-pint{display:flex;align-items:baseline;gap:6px;color:#fff;min-height:2.2em}
.cp-num{font-size:clamp(34px,10vw,48px);font-weight:800;line-height:1;color:#ffd166;text-shadow:0 3px 0 #0005}
.cp-tx{font-weight:800;font-size:16px}
.btn-listo{background:linear-gradient(180deg,#80ed99,#2ecc71);color:#0b3d20;font-size:clamp(22px,6vw,28px);font-weight:800;padding:8px 22px;border-radius:999px;box-shadow:0 6px 0 #1b7f45,0 10px 16px #0004;transition:opacity .2s}
.btn-listo:active{transform:translateY(4px);box-shadow:0 2px 0 #1b7f45}
.btn-listo:disabled{opacity:.35;filter:grayscale(.7);box-shadow:0 6px 0 #555}
.progreso{display:flex;align-items:center;gap:6px;color:#fff;font-weight:800;font-size:13px;width:100%}
.prog-barra{flex:1;height:12px;border-radius:99px;background:#ffffff30;overflow:hidden}
.prog-barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd166,#8ee04a);transition:width .5s}
.zona-grilla{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.zona-grilla .grilla{width:100%;height:100%;max-width:640px;touch-action:manipulation}
.hoja{fill:#fffdf6;stroke:#d8cdb8;stroke-width:3}
.celda{cursor:pointer}
.punto{fill:#6b6670;transition:fill .15s}
.punto.act{stroke:#fff;stroke-width:6}
.punto.nuevo{animation:pop .3s;transform-box:fill-box;transform-origin:center}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.enc{animation:encI .5s cubic-bezier(.3,1.5,.5,1) both;transform-box:fill-box;transform-origin:center}
@keyframes encI{from{opacity:0;transform:scale(.6)}}
.zona-grilla.festeja .grilla{animation:fest .7s ease-in-out 2}
@keyframes fest{50%{transform:scale(1.04) rotate(-1deg)}}
.pista{position:absolute;left:8px;right:8px;bottom:10px;text-align:center;pointer-events:none;z-index:3}
.pista span{display:inline-block;background:#000c;color:#fff;border-radius:14px;padding:4px 12px;font-weight:800;font-size:clamp(15px,4vw,18px);animation:entra .3s}
#manito{position:fixed;left:-100px;top:-100px;font-size:clamp(38px,10vw,56px);z-index:30;pointer-events:none;opacity:0;transform:translate(-30%,10%);transition:left .35s,top .35s,opacity .2s;filter:drop-shadow(0 3px 3px #0006)}
#manito.ver{opacity:1;animation:toca 1s ease-in-out infinite}
@keyframes toca{50%{transform:translate(-30%,25%)}}
/* modal de fin de nivel */
.modal{position:absolute;top:0;right:0;bottom:0;left:0;display:none;align-items:center;justify-content:center;background:#0006;z-index:6;padding:12px}
.modal.ver{display:flex}
.m-caja{position:relative;background:#fff;border-radius:22px;padding:14px 16px;width:100%;max-width:420px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 10px 30px #0006;max-height:100%;overflow-y:auto}
#confeti{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;pointer-events:none}
.m-pts{background:#8e7dd1;color:#fff;font-weight:800;font-size:clamp(24px,7vw,34px);border-radius:16px;padding:0 18px}
.m-tit{font-weight:800;font-size:clamp(22px,6vw,28px);line-height:1.15}
.m-alt{font-weight:800;color:#6c757d}
.m-tro{display:flex;flex-direction:column;align-items:center}
.tro{font-size:40px}.tro.gana{font-size:clamp(54px,16vw,80px);line-height:1;animation:gana .7s cubic-bezier(.3,1.6,.5,1) both}
@keyframes gana{from{transform:scale(0) rotate(-30deg)}}
.tro-nom{font-weight:800;font-size:16px;color:#6c757d}
.m-cuenta{display:flex;align-items:center;gap:6px;background:#fff3cd;border-radius:999px;padding:3px 12px}
.m-cuenta small{font-weight:800;font-size:13px;color:#7a5c00;margin-right:2px}
.m-cuenta span{width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:26px}
.m-cuenta .vacio{border:2px dashed #d4b106;border-radius:50%;width:26px;height:26px;margin:3px}
.m-cuenta .nuevo{animation:nuevo .6s .7s cubic-bezier(.3,1.6,.5,1) both}
@keyframes nuevo{from{transform:scale(0) translateY(-30px)}}
.m-total{font-weight:800;font-size:14px;background:#f1f3f5;border-radius:10px;padding:4px 10px}
.m-bots{display:flex;flex-direction:column;align-items:center;gap:8px}
.m-bots .btn-jugar{font-size:22px;padding:8px 26px}
.m-bots .btn-jugar.espera{opacity:.45;animation:none;filter:grayscale(.6);cursor:wait}
.trofeos-f{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}.trofeos-f div{display:flex;flex-direction:column;align-items:center;font-size:48px;line-height:1}.trofeos-f small{font-size:12px;font-weight:800;max-width:110px;margin-top:4px}
#envioLugar{display:flex;justify-content:center}
#envioLugar .qstEnvBtn{font-family:inherit}
/* pantallas anchas (netbooks): el dado a la izquierda, la grilla a la derecha */
@media (min-aspect-ratio:5/4){
  .juego{flex-direction:row}
  .zona-dado{flex-direction:column;width:clamp(220px,34%,380px);justify-content:center}
  #dadoJ{--s:clamp(110px,min(30vh,22vw),200px)}
  .lado{min-width:0;width:100%}
  .pista{left:34%}
  .port-escena{height:24vh}
  .m-caja{max-width:560px;gap:3px;padding:8px 14px}.m-tit{font-size:20px}.tro.gana{font-size:44px}.m-bots .btn-jugar{font-size:18px;padding:5px 18px}
  .cierre{gap:6px}.cierre h1{font-size:28px}.stats b{font-size:22px}
  .profe img,.profe-emoji{width:64px;height:64px}
}
@media (max-height:520px){.port-escena{height:22vh}.port-tit{font-size:clamp(28px,8vh,48px)}.profe img{width:56px;height:56px}}

</style>
</head>
<body>
<main id="pantalla"></main>
<div id="manito">👆</div>
<div id="lightbox"><button id="lbCerrar" aria-label="Cerrar">✕</button><img id="lbImg" alt="Profe Gustavo"><div id="lbFrase"></div></div>
<script src="datos.js"></script>
<script src="../../recursos/enviar-tarea.js"></script>
<script src="juego.js"></script>
</body>
</html>
