<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Vocales que se estiran · QueSepanTodos</title>
<meta name="description" content="Lengua 1.er grado: conciencia fonológica, sonido inicial de las vocales. Paquete interactivo de QueSepanTodos.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --a:#21a6b5; --e:#7cb342; --i:#f2a900; --o:#8e44ad; --u:#e2457a;
  --naranja:#f58b3a; --amarillo:#ffc93c; --tinta:#2b2b2b; --suave:#6b6b6b; --borde:#d9e3ea;
  --ok:#27ae60; --okf:#d4f5df; --mal:#e5534b; --malf:#ffd9d6; --radio:18px; --azul:#2d6cdf; --azul-o:#1b4a9e;
}
[hidden]{display:none!important}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Baloo 2',system-ui,sans-serif;color:var(--tinta);display:flex;flex-direction:column;height:100vh;height:100dvh;
  background:linear-gradient(180deg,#fff8ec 0%,#fffdf8 55%,#eef7ff 100%);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
header{display:flex;align-items:center;gap:6px;padding:6px 8px;flex:0 0 auto;color:#fff;
  background:linear-gradient(90deg,var(--a) 0%,var(--e) 25%,var(--i) 50%,var(--o) 75%,var(--u) 100%)}
#titulo{flex:1;font-weight:800;font-size:clamp(15px,4.2vw,22px);line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px #0007}
#marcador{display:flex;gap:8px;font-weight:700;font-size:clamp(12px,3.2vw,16px);white-space:nowrap;text-shadow:0 1px 3px #0007}
.nav{border:0;background:#fff;color:var(--o);width:36px;height:36px;border-radius:50%;font-size:20px;font-weight:800;cursor:pointer;flex:0 0 auto;box-shadow:0 2px 0 #0003}
.nav:disabled{opacity:.35}
body:not(.revision) .nav{display:none}
main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px 10px;overflow:hidden}
footer{flex:0 0 auto;padding:4px 10px 10px;display:flex;justify-content:center;gap:10px}
.btn{font-family:inherit;font-weight:800;font-size:clamp(15px,4.2vw,20px);border:0;border-radius:999px;padding:9px 22px;cursor:pointer;
  background:var(--azul);color:#fff;box-shadow:0 4px 0 var(--azul-o);transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--azul-o)}
.btn:disabled{background:#c4c4c4;box-shadow:0 4px 0 #9a9a9a;cursor:not-allowed}
.btn.grande{font-size:clamp(20px,5.5vw,28px);padding:12px 30px;background:var(--naranja);box-shadow:0 5px 0 #b35c1e}
#btnSig{min-width:190px}
.bloq{pointer-events:none}
.bloq .btn-info{pointer-events:auto}
.col{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;max-width:1000px;max-height:100%}
.enunciado{font-size:clamp(17px,4.6vw,24px);font-weight:700;text-align:center;line-height:1.2;background:#fffffff0;border-radius:14px;padding:4px 14px;max-width:100%}
.foto{max-height:30vh;max-width:92vw;border-radius:var(--radio);border:4px solid #fff;box-shadow:0 5px 16px #0002;object-fit:contain;display:block;background:#fff}
.puntitos{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.puntitos i{width:10px;height:10px;border-radius:50%;background:#d5dde3;transition:.3s}
.puntitos i.hecho{background:var(--ok)}
.puntitos i.on{background:var(--naranja);transform:scale(1.35)}
.titila{animation:titila 1.1s ease-in-out infinite}
@keyframes titila{0%,100%{box-shadow:0 0 0 0 #ffc93c00}50%{box-shadow:0 0 0 8px #ffc93caa}}
.sacude{animation:sacude .4s}
@keyframes sacude{0%,100%{transform:none}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.entra{animation:entra .4s ease}
@keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.late{animation:late .45s ease}
@keyframes late{50%{transform:scale(1.12)}}
.apagada{opacity:.35}
/* portada / cierre */
.portada h1,.cierre h1{font-size:clamp(32px,9vw,58px);line-height:1;font-weight:800;color:var(--o);text-shadow:0 3px 0 #fff;text-align:center}
.portada h1 span{color:var(--a)}
.chip{font-weight:800;color:#fff;background:linear-gradient(90deg,var(--a),var(--i),var(--u));padding:2px 14px;border-radius:99px;font-size:clamp(12px,3.4vw,16px)}
.sub{font-size:clamp(17px,4.6vw,23px);color:var(--suave);font-weight:700;margin-top:-6px}
.port-img{max-height:26vh}
.desc{font-size:clamp(14px,3.8vw,18px);font-weight:600;color:var(--tinta);text-align:center;max-width:560px;line-height:1.25;text-wrap:balance}
.btn-info{font-family:inherit;font-weight:800;font-size:clamp(13px,3.6vw,16px);border:3px solid var(--o);color:var(--o);background:#fff;border-radius:999px;padding:3px 14px;cursor:pointer}
/* modal de fundamentos */
#modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:50;padding:12px}
#modal.ver{display:flex}
#modal .hoja{background:#fffdf8;border-radius:18px;max-width:640px;width:100%;max-height:92%;overflow:auto;padding:18px 18px 16px;position:relative;box-shadow:0 10px 30px #0006;-webkit-user-select:text;user-select:text;text-align:left}
#modal h2{color:var(--o);font-size:clamp(20px,5.5vw,28px);margin:0 44px 4px 0;line-height:1.1}
#modal h3{color:var(--a);font-size:clamp(16px,4.4vw,20px);margin:10px 0 2px}
#modal p,#modal li{font-size:clamp(14px,3.9vw,17px);line-height:1.4;font-weight:500}
#modal ul{padding-left:20px;display:flex;flex-direction:column;gap:3px}
#modal .fuente{margin-top:10px;font-size:13px;color:var(--suave)}
#modal a{color:var(--azul)}
.fila{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.profe{display:flex;align-items:center;gap:8px;text-align:left}
.profe img{width:92px;height:92px;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 3px 10px #0003;cursor:zoom-in;flex:0 0 auto}
.profe div{font-size:13px;font-weight:700;line-height:1.3}
.profe small{color:var(--suave);font-weight:600;font-size:12.5px}
.profe small.credito{color:var(--tinta);font-weight:700;font-size:12px;display:inline-block;max-width:300px;line-height:1.25;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:520px}
.stats div{background:#fff;border:3px solid var(--borde);border-radius:14px;padding:6px 4px;font-size:13px;font-weight:700;display:flex;flex-direction:column;align-items:center}
.stats b{font-size:clamp(20px,6vw,30px)}
.yt{display:inline-flex;align-items:center;gap:6px;text-decoration:none;background:#ff0000;color:#fff;font-weight:800;border-radius:999px;padding:6px 14px;font-size:clamp(13px,3.6vw,16px);box-shadow:0 3px 0 #a00}
/* lightbox */
#lightbox{position:fixed;inset:0;background:#000d;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:60;gap:12px;overflow:hidden}
#lightbox.ver{display:flex}
#lbImg{max-width:92vw;max-height:72vh;border-radius:14px;transition:transform .3s;cursor:zoom-in}
#lbFrase{color:#fff;font-size:clamp(18px,5vw,26px);font-weight:700;text-shadow:0 2px 6px #000}
.cerrarX{position:absolute;top:12px;right:14px;width:44px;height:44px;border-radius:50%;border:0;font-size:22px;background:#fff;cursor:pointer;z-index:3}
/* manito */
.mano{position:fixed;z-index:40;font-size:clamp(34px,8vw,50px);line-height:1;transition:left .6s ease,top .6s ease,opacity .3s;opacity:0;pointer-events:none;filter:drop-shadow(0 3px 3px #0006);animation:toque 1s ease-in-out infinite}
.mano.ver{opacity:1}
@keyframes toque{0%,100%{margin-top:0}50%{margin-top:8px}}
.caption{min-height:2.4em;max-width:720px;width:100%;text-align:center;font-size:clamp(20px,5.6vw,30px);font-weight:700;line-height:1.25;background:#fff;border:3px solid var(--amarillo);border-radius:var(--radio);padding:6px 14px;display:flex;align-items:center;justify-content:center;gap:4px}
.caption .grande{font-size:1.5em;line-height:1}
/* palabra escrita después de acertar */
.escrita{font-weight:800;font-size:clamp(17px,4.6vw,24px);line-height:1.1;min-height:1.1em;opacity:0;transition:opacity .3s;color:var(--tinta)}
.escrita.ver{opacity:1}
/* sobres */
.sobres{display:flex;gap:min(2.2vw,14px);justify-content:center;width:100%;padding-top:1vh}
.sobres.grandes .sobre{width:min(17vw,34vh,190px)}
.sobres.grandes .letra{font-size:min(9vw,15vh,96px)}
.sobre{position:relative;width:min(18vw,19vh,150px);aspect-ratio:1/1.12;border:0;background:none;cursor:pointer;padding:0;font-family:inherit;border-radius:12px;flex:0 0 auto}
.sobre .fondo{position:absolute;left:0;right:0;bottom:0;height:60%;background:var(--co);border-radius:10px}
.sobre .ref{position:absolute;left:12%;right:12%;top:2%;aspect-ratio:1;background:#fff;border:2px solid #e3d9c4;border-radius:6px;transform:rotate(-5deg);overflow:hidden;box-shadow:0 2px 5px #0002;transition:transform .3s}
.sobre .ref img{width:100%;height:100%;object-fit:contain;display:block}
.sobre .bolsillo{position:absolute;left:0;right:0;bottom:0;height:60%;background:var(--c);border-radius:0 0 10px 10px;clip-path:polygon(0 0,50% 38%,100% 0,100% 100%,0 100%);box-shadow:inset 0 -6px 0 #0001}
.sobre .letra{position:absolute;left:0;right:0;bottom:4%;text-align:center;color:#fff;font-weight:800;font-size:min(9vw,9vh,74px);line-height:1;text-shadow:0 2px 0 #0003}
.sobre .cuenta{position:absolute;top:-6px;right:-6px;background:var(--ok);color:#fff;font-weight:800;border-radius:99px;min-width:28px;height:28px;font-size:16px;line-height:28px;text-align:center;box-shadow:0 2px 4px #0004;z-index:2}
.sobre.activo .ref{transform:rotate(0) translateY(-8%) scale(1.06)}
.sobre.titila{border-radius:14px}
.zona-tarjeta{display:flex;justify-content:center}
.tarjeta-grande{position:relative;background:#fff;border:5px solid #fff;border-radius:20px;box-shadow:0 6px 18px #0002;padding:6px 6px 2px;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:0}
.tarjeta-grande img{width:min(36vh,52vw);height:min(36vh,52vw);object-fit:contain;display:block}
.tarjeta-grande .parlante{position:absolute;top:6px;right:6px;width:44px;height:44px;border-radius:50%;background:var(--amarillo);font-size:24px;line-height:44px;text-align:center;box-shadow:0 3px 0 #c99a1a}
.tarjeta-grande.volando{position:fixed;z-index:45;margin:0;transition:transform .6s ease-in,opacity .6s ease-in;pointer-events:none}
.tarjeta-grande.volando .parlante{display:none}
/* rodear */
.rodear{display:flex;align-items:center;gap:min(3vw,18px);justify-content:center;width:100%}
.vocal-tab{color:#fff;font-weight:800;font-size:min(16vw,15vh,110px);line-height:1;width:min(22vw,19vh,140px);aspect-ratio:1;border-radius:22px;display:flex;align-items:center;justify-content:center;padding-bottom:.12em;box-shadow:0 5px 0 #0002;flex:0 0 auto}
.grid4{display:grid;grid-template-columns:repeat(4,auto);gap:min(2vw,14px)}
.dibujo{position:relative;background:#fff;border:4px solid var(--borde);border-radius:18px;padding:4px 4px 0;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;transition:opacity .3s}
.dibujo img{width:min(17vw,40vh,190px);height:min(17vw,40vh,190px);object-fit:contain;display:block}
.dibujo .circulo{position:absolute;inset:-2px -2px 18px;border:6px solid;border-radius:50%;opacity:0;transform:scale(.6) rotate(-20deg);transition:transform .45s cubic-bezier(.3,1.6,.6,1),opacity .2s;pointer-events:none}
.dibujo.hecho .circulo{opacity:1;transform:scale(1.02) rotate(-6deg)}
.dibujo.hecho{border-color:var(--ok);background:var(--okf)}
.dibujo.mal{border-color:var(--mal);background:var(--malf)}
.dibujo.titila{border-color:var(--amarillo)}
/* unir */
.unir{position:relative;display:flex;flex-direction:column;gap:9vh;align-items:center}
.unir .grupo{display:flex;gap:min(2vw,14px);position:relative;z-index:1}
.unir .lineas{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;overflow:visible}
.dibujo.chico img{width:min(15vw,24vh,150px);height:min(15vw,24vh,150px)}
.dibujo.chico .escrita{font-size:clamp(14px,3.6vw,20px)}
.dibujo.sel{border-color:var(--azul);background:#e3f0ff;transform:scale(1.06)}
@media (orientation:portrait){
  .grid4{grid-template-columns:repeat(2,auto)}
  .dibujo img{width:min(36vw,22vh);height:min(36vw,22vh)}
  .rodear{flex-direction:column}
  .vocal-tab{width:min(20vw,11vh);font-size:min(14vw,9vh)}
  .unir{flex-direction:row;gap:16vw}
  .unir .grupo{flex-direction:column;gap:1vh}
  .dibujo.chico img{width:min(26vw,10.5vh);height:min(26vw,10.5vh)}
  .dibujo.chico .escrita{font-size:clamp(12px,3.4vw,16px);min-height:1em}
  .tarjeta-grande img{width:min(30vh,62vw);height:min(30vh,62vw)}
}
</style>
</head>
<body>
<header>
  <button class="nav" id="navPrev" aria-label="Pantalla anterior">‹</button>
  <div id="titulo"></div>
  <div id="marcador"><span id="mAc">✅ 0</span><span id="mEr">❌ 0</span><span id="mPt">⭐ 0</span></div>
  <button class="nav" id="navNext" aria-label="Pantalla siguiente">›</button>
</header>
<main id="pantalla"></main>
<footer id="pie"><button class="btn" id="btnSig" disabled>Siguiente ➜</button></footer>
<div id="modal"><div class="hoja"><button class="cerrarX" id="modalCerrar" aria-label="Cerrar">✕</button><div id="modalCuerpo"></div></div></div>
<div id="lightbox"><button class="cerrarX" id="lbCerrar" aria-label="Cerrar">✕</button><img id="lbImg" alt="Profe Gustavo Aguilar"><div id="lbFrase"></div></div>
<script src="../../recursos/enviar-tarea.js"></script>
<script src="datos.js"></script>
<script src="motor.js"></script>
</body>
</html>
