<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El reloj · QueSepanTodos.com</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏰</text></svg>">
<style>
:root{
  --tinta:#1e2a5a; --azul:#1d4ed8; --rojo:#dc2626; --verde:#15803d; --amarillo:#facc15;
  --papel:#fffdf7; --linea:#dbe7f7; --gris:#64748b; --ok:#16a34a; --mal:#dc2626;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{
  font-family:"Trebuchet MS","Segoe UI",Roboto,Verdana,sans-serif;color:var(--tinta);
  background-color:var(--papel);
  background-image:linear-gradient(var(--linea) 1px,transparent 1px),linear-gradient(90deg,var(--linea) 1px,transparent 1px);
  background-size:22px 22px;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
#app{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Cabecera */
#cab{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--tinta);color:#fff;flex:0 0 auto}
#cab .ctit{font-weight:bold;white-space:nowrap}
#cab .cpant{flex:1;font-size:.9rem;opacity:.9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#cab .cpts{font-weight:bold;background:rgba(255,255,255,.15);border-radius:12px;padding:2px 10px;white-space:nowrap}
#brep{background:none;border:2px solid rgba(255,255,255,.4);color:#fff;border-radius:50%;width:34px;height:34px;font-size:1rem;cursor:pointer}
#brep.sonando{animation:pulso 1s infinite}
@keyframes pulso{50%{transform:scale(1.15);border-color:var(--amarillo)}}
/* Escena */
#esc{flex:1 1 auto;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 10px;gap:6px;min-height:0}
#esc.bloq{cursor:progress}
/* Pie */
#pie{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;flex:0 0 auto;background:rgba(30,42,90,.06);border-top:2px solid var(--linea)}
#pie.oculto{display:none}
.bnav{border:none;border-radius:10px;padding:8px 12px;font:inherit;font-size:1rem;cursor:pointer;background:#e2e8f0;color:var(--tinta)}
#bsig{background:#cbd5e1;color:#fff;font-weight:bold;padding:10px 22px;font-size:1.05rem}
#bsig.listo{background:var(--verde);animation:latido 1.4s infinite}
@keyframes latido{50%{box-shadow:0 0 0 6px rgba(21,128,61,.25)}}
#bsig:disabled{cursor:not-allowed}
#ind{font-size:.85rem;color:var(--gris)}
.rev{background:#fde68a}
/* Comunes */
.btn{white-space:nowrap;border:none;border-radius:14px;background:var(--azul);color:#fff;font:inherit;font-weight:bold;padding:12px 26px;font-size:1.15rem;cursor:pointer;box-shadow:0 4px 0 #1e3a8a}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #1e3a8a}
.oculto{display:none!important}
.titila{animation:titila 1s infinite}
@keyframes titila{0%,100%{box-shadow:0 0 0 3px var(--amarillo)}50%{box-shadow:0 0 0 3px rgba(250,204,21,.15)}}
.brilla{animation:brilla .8s infinite alternate}
@keyframes brilla{to{opacity:.35}}
.sacude{animation:sacude .4s}
@keyframes sacude{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tpreg{font-size:1.15rem;font-weight:bold;text-align:center;max-width:640px;line-height:1.3;padding:6px 12px;border-radius:12px;background:#fff}
.tprog{font-size:.8rem;color:var(--gris)}
/* Reloj */
.reloj{display:block}
.rbor{fill:var(--tinta)}
.rfondo{fill:#fff}
.rtick{stroke:#94a3b8;stroke-width:1.2}
.rtick.g{stroke:var(--tinta);stroke-width:2.6}
.rnum{font:bold 17px "Trebuchet MS",Verdana,sans-serif;fill:var(--tinta);text-anchor:middle}
.rmin{font:bold 10px Verdana,sans-serif;fill:var(--rojo);text-anchor:middle}
.aguH{stroke:var(--azul);stroke-width:7;stroke-linecap:round}
.aguM{stroke:var(--rojo);stroke-width:4.5;stroke-linecap:round}
.rcen{fill:var(--tinta)}
.rhit{cursor:pointer}
.rhit.toque{fill:var(--amarillo);fill-opacity:.55}
.digital{display:inline-block;font-family:"Courier New",monospace;font-weight:bold;background:#fff;border:4px solid var(--tinta);border-radius:12px;padding:4px 14px;font-size:2rem;letter-spacing:2px;color:var(--tinta)}
.digital.grande{font-size:2.6rem;padding:8px 22px}
.digital.mini{font-size:1.1rem;padding:1px 8px;border-width:3px;vertical-align:middle}
/* Portada */
.portada{display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;max-width:720px}
.portada .pimg{max-height:30vh;max-width:92vw;border-radius:18px;border:5px solid #fff;box-shadow:0 6px 18px rgba(30,42,90,.25)}
.portada h1{margin:0;font-size:2.4rem;letter-spacing:1px}
.portada .sub{margin:0;font-size:1rem;color:#334155;max-width:520px}
.portada .grado{display:inline-block;background:var(--amarillo);border-radius:10px;padding:2px 12px;font-weight:bold}
.pfila{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:nowrap}
.firma{display:flex;align-items:center;gap:8px;text-align:left;font-size:.78rem;line-height:1.3}
.firma div{max-width:190px}
.firma img{width:92px;height:92px;border-radius:50%;object-fit:cover;border:3px solid var(--tinta);cursor:zoom-in;background:#e2e8f0}
.fuente{font-size:.72rem;color:var(--gris);margin:0;max-width:560px}
/* Lightbox */
.lb{position:fixed;inset:0;background:rgba(15,23,42,.94);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;text-align:center;padding:16px}
.lbmarco{overflow:hidden;border-radius:16px;max-width:92vw;max-height:66vh}
.lbmarco img{display:block;max-width:92vw;max-height:66vh;transition:transform .35s;cursor:zoom-in}
.lbx{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;background:#fff;color:var(--tinta);border:none;border-radius:50%;width:42px;height:42px;font-size:1.3rem;cursor:pointer}
.lbfrase{font-size:1.4rem;font-weight:bold;margin:0}
.lbdatos{font-size:.9rem;margin:0;opacity:.85}
/* Narración */
.narr{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.nvis{display:flex;flex-direction:column;align-items:center;gap:6px}
.nvis .reloj{height:40vh;max-width:84vw}
.ncap{display:flex;flex-direction:column;gap:4px;align-items:center;min-height:2.6em}
.chip{background:#fff;border-radius:12px;padding:6px 14px;font-weight:bold;font-size:1.05rem;text-align:center;max-width:640px}
.chip.prev{opacity:.85;box-shadow:none}
.puntero{position:absolute;font-size:2.4rem;z-index:5;pointer-events:none;transition:left .6s,top .6s;display:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.fmt{display:flex;gap:14px;align-items:stretch;justify-content:center;flex-wrap:wrap}
.fcol{display:flex;flex-direction:column;align-items:center;gap:6px;background:#fff;border-radius:16px;padding:10px 12px;border:3px solid var(--linea);min-width:150px}
.flab{font-weight:bold;text-align:center;font-size:.95rem}
.fsol{font-size:3rem;line-height:1;padding:4px 12px;border-radius:14px}
/* Trivia */
.triv{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;max-width:680px}
.tvis{display:flex;justify-content:center;align-items:center}
.tvis .reloj{height:36vh;max-width:80vw}
.tvis img.decor{max-height:24vh;max-width:90vw;border-radius:14px;border:4px solid #fff;box-shadow:0 3px 10px rgba(30,42,90,.2)}
.topc{display:grid;gap:8px;width:100%;max-width:520px}
.topc.dos{grid-template-columns:1fr 1fr}
.topc.uno{grid-template-columns:1fr}
.opc{border:3px solid var(--tinta);background:#fff;border-radius:14px;padding:10px 8px;font:inherit;font-size:1.25rem;font-weight:bold;color:var(--tinta);cursor:pointer;min-height:52px}
.topc.uno .opc{font-size:1.05rem}
.opc.ok{background:var(--ok);border-color:var(--ok);color:#fff;opacity:1!important}
.opc.mal{background:#fee2e2;border-color:var(--mal);color:var(--mal);pointer-events:none}
.opc.atenuada{opacity:.35;pointer-events:none}
.invit{display:flex;gap:10px;align-items:center;background:#fff;border:4px dashed #ec4899;border-radius:16px;padding:8px;max-width:560px}
.invit img{height:20vh;max-width:36vw;border-radius:10px;object-fit:cover}
.invtxt{font-size:.95rem;line-height:1.45}
.invtit{font-weight:bold;color:#db2777;font-size:1.05rem}
/* Asociar */
.decor-svg svg{height:12vh}
.asoc{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;width:100%;max-width:560px}
.acol{display:flex;flex-direction:column;gap:8px}
.tarj{border:3px solid var(--tinta);background:#fff;border-radius:12px;padding:8px;font:inherit;font-weight:bold;font-size:1.02rem;color:var(--tinta);cursor:pointer;min-height:50px}
.tarj.sel{background:#fef9c3;border-color:#ca8a04}
.tarj.par{color:#fff;cursor:default}
/* Poner hora */
.ph{display:flex;flex-direction:column;align-items:center;gap:8px}
.ph .reloj{height:44vh;max-width:88vw}
.phpaso{font-weight:bold;background:#fff;border-radius:12px;padding:6px 14px;text-align:center}
/* Clasificar */
.clas{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;max-width:640px}
.clas img.decor{max-height:17vh;border-radius:12px;border:3px solid #fff}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.cat{background:#fff;border:3px dashed var(--tinta);border-radius:14px;padding:6px;min-height:15vh;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.cat.am{border-color:#ca8a04;background:#fffbeb}
.cat.pm{border-color:#4338ca;background:#eef2ff}
.cattit{font-weight:bold;text-align:center}
.catcont{display:flex;flex-direction:column;gap:3px}
.cartas{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%}
.carta{border:2px solid var(--tinta);background:#fff;border-radius:10px;padding:7px 6px;font:inherit;font-size:.95rem;font-weight:bold;color:var(--tinta);cursor:pointer}
.carta.sel{background:#fef9c3;border-color:#ca8a04;transform:scale(1.04)}
.ubic{font-size:.78rem;background:rgba(255,255,255,.8);border-radius:8px;padding:2px 6px;text-align:center}
/* Duración */
.dur{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;max-width:620px}
.tdur{border-collapse:collapse;width:100%;background:#fff;font-size:.92rem}
.tdur th,.tdur td{border:2px solid var(--tinta);padding:4px 6px;text-align:left}
.tdur th{background:var(--tinta);color:#fff}
.tdur tr.actual td{background:#fef9c3}
.tdur td.escrito{color:var(--verde);font-weight:bold}
.drel{display:flex;gap:18px;justify-content:center}
.drel div{display:flex;flex-direction:column;align-items:center;font-weight:bold;font-size:.85rem}
.drel .reloj{height:18vh}
/* Sopa */
.sopa{display:grid;width:min(94vw,50vh);gap:2px;touch-action:manipulation}
.cel{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--linea);font-weight:bold;font-size:min(4.6vw,2.6vh);border-radius:4px;color:var(--tinta)}
.cel.ini{background:var(--amarillo)}
.cel.hall{color:#fff}
.spal{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:560px}
.spal span{background:#fff;border:2px solid var(--tinta);border-radius:10px;padding:3px 10px;font-weight:bold}
.spal span.hall{text-decoration:line-through;color:#fff}
/* Invitación */
.miinv{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;max-width:560px}
.miinv img.decor{max-height:16vh;border-radius:12px;border:3px solid #fff}
.tarjinv{background:#fff;border:4px dashed #ec4899;border-radius:16px;padding:10px 14px;width:100%}
.tarjinv .invtit{text-align:center;margin-bottom:6px}
.tarjinv label{display:flex;align-items:center;gap:8px;margin:5px 0;font-weight:bold}
.tarjinv input{flex:1;font:inherit;border:none;border-bottom:2px dashed var(--gris);padding:4px;background:transparent;color:var(--tinta);-webkit-user-select:text;user-select:text}
/* Cierre */
.cierre{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.cierre img.cimg{max-height:30vh;max-width:90vw;border-radius:18px;border:5px solid #fff;box-shadow:0 6px 18px rgba(30,42,90,.25)}
.cierre h2{margin:0;font-size:2rem}
.stats{display:grid;grid-template-columns:repeat(4,auto);gap:8px}
.stats div{background:#fff;border-radius:12px;padding:6px 12px;border:2px solid var(--linea);font-size:1.05rem}
.stats b{display:block;font-size:1.4rem}
@media (prefers-reduced-motion:reduce){.titila,.brilla,#bsig.listo,#brep.sonando{animation:none}}
@media (max-width:480px){.cierre .pfila{flex-wrap:wrap}.pfila .btn{padding:12px 14px;font-size:1rem;white-space:nowrap;flex-shrink:0}.firma{font-size:.7rem}.firma div{max-width:150px}.portada h1{font-size:2rem}}
@media (max-height:620px){.tpreg{font-size:1rem}.opc{min-height:44px;padding:6px;font-size:1.1rem}.portada h1{font-size:1.8rem}}
</style>
</head>
<body>
<div id="app"></div>
<script src="datos.js"></script>
<script src="motor.js"></script>
</body>
</html>
